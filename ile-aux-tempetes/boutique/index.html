<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Boutique</title></head><body style="margin:0;background:#10110d;color:#f3ead7"><div id="load" style="font-family:system-ui;padding:30px;text-align:center">Chargement de la boutique…</div><script src="payload.js"></script><script>(async()=>{try{let s=(window.__IAT_DATA||'').replace(/\s/g,'');while(s.length%4)s+='=';const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);let h;if(typeof DecompressionStream!=='undefined'){const ds=new DecompressionStream('gzip');h=await new Response(new Blob([b]).stream().pipeThrough(ds)).text()}else{await new Promise((ok,no)=>{const z=document.createElement('script');z.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';z.onload=ok;z.onerror=no;document.head.appendChild(z)});h=new TextDecoder().decode(pako.ungzip(b))}document.open();document.write(h);document.close()}catch(e){document.getElementById('load').innerHTML='Impossible de charger la boutique.<br><small>'+String(e&&e.message?e.message:e)+'</small>'}})();</script></body></html>
