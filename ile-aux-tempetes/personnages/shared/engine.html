<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interface personnage — Île aux Tempêtes</title><style>
:root{--bg:#0d1114;--panel:#171d22;--panel2:#202830;--text:#f6f5f1;--muted:#abb5bd;--accent:#d8b56e;--line:#34404a;--danger:#e98787;--ok:#8fd19b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}.app{max-width:760px;margin:auto;padding:12px 12px 92px}.top{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 10px}.hero{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.heroid{display:flex;gap:10px;align-items:center;min-width:0}.avatar{width:58px;height:72px;border-radius:14px;object-fit:cover;object-position:center;border:1px solid var(--line);background:var(--panel2);flex:0 0 auto}.name{font-size:24px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:2px}.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px}.search{margin-top:10px;width:100%;border:1px solid var(--line);background:#11171c;color:white;border-radius:14px;padding:13px 14px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center;color:var(--text);font:inherit}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.hpbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.hpnum{font-size:28px;font-weight:900}.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:white;border-radius:13px;padding:12px 10px;font-weight:800;font-size:14px;min-height:46px}.btn.primary{background:var(--accent);color:#101316;border-color:transparent}.btn.danger{border-color:#633b3b;color:#ffd1d1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.resource{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.dots{display:flex;gap:5px}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}.dot.used{background:var(--accent)}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 9px}.list{display:grid;gap:8px}.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:white;border-radius:15px;padding:12px}.item strong{display:block;font-size:16px}.item small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--panel2);font-size:11px;margin:5px 4px 0 0}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#10161bee;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}.nav{border:0;background:none;color:var(--muted);padding:8px 2px;font-size:11px}.nav b{display:block;font-size:18px}.nav.active{color:var(--accent)}.page{display:none}.page.active{display:block}.modal{position:fixed;inset:0;background:#0009;z-index:90;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#171d22;border-radius:24px 24px 0 0;border:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.close{float:right;width:38px;height:38px;border-radius:50%;border:0;background:#2a343d;color:white;font-size:20px}.sheet h2{margin:2px 48px 4px 0}.meta{color:var(--muted);font-size:12px}.steps{margin:14px 0;display:grid;gap:8px}.step{background:#11171c;border:1px solid var(--line);border-radius:13px;padding:11px}.step b{display:block;margin-bottom:4px}.calc{font-size:20px;font-weight:900;color:var(--accent)}.why,.learn{background:#131a1f;border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px;line-height:1.45}.warn{background:#2a2115;border:1px solid #665232;padding:10px;border-radius:12px;color:#ffe0a0;font-size:13px;margin-top:10px}.result{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px}.money{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.coin{background:var(--panel);border:1px solid var(--line);padding:11px 5px;border-radius:13px;text-align:center;color:white}.coin b{display:block;font-size:18px}.coin span{font-size:10px;color:var(--muted)}.tapnote{font-size:12px;color:var(--muted);margin:4px 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checkline{display:flex;gap:8px;align-items:center}.checkline input{width:22px;height:22px}@media(max-width:390px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.name{font-size:21px}.avatar{width:52px;height:66px}}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;max-height:82vh}}
.turnbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px;margin:8px 0 12px}.turnhead{display:flex;gap:8px;align-items:center;justify-content:space-between}.turnhead strong{font-size:16px}.turntokens{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.turntoken{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 8px;text-align:left;min-height:55px}.turntoken b{display:block;font-size:13px}.turntoken span{font-size:11px;color:var(--muted)}.turntoken.spent{opacity:.5;text-decoration:line-through}.movebox{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}.movecontrols{display:flex;gap:5px}.movecontrols button{min-width:38px;border:1px solid var(--line);background:#101612;color:var(--text);border-radius:10px;padding:7px}.turnfoot{display:flex;gap:7px;margin-top:8px}.turnfoot .btn{flex:1;min-height:40px;padding:8px;font-size:12px}@media(max-width:390px){.turntokens{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><div class="top"><div class="hero"><div class="heroid"><img id="heroAvatar" class="avatar" alt=""><div><div class="name" id="heroName"></div><div class="sub" id="heroSub"></div></div></div><div class="pill">Niveau 1</div></div><input id="search" class="search" placeholder="Rechercher : perception, soin, feu, corde…"><div id="searchResults"></div></div><main><section id="home" class="page active"></section><section id="combat" class="page"></section><section id="tests" class="page"></section><section id="magic" class="page"></section><section id="bag" class="page"></section></main></div><div class="bottom"><button class="nav active" data-page="home"><b>⌂</b>Accueil</button><button class="nav" data-page="combat"><b>⚔</b>Combat</button><button class="nav" data-page="tests"><b>🎲</b>Tests</button><button class="nav" data-page="magic"><b>✨</b>Magie</button><button class="nav" data-page="bag"><b>🎒</b>Sac</button></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><script src="data.js"></script><script>
const DATA=window.__IAT_PLAYER_DATA;if(!DATA)throw new Error('Données personnage absentes');document.getElementById('heroName').textContent=DATA.name;document.getElementById('heroSub').textContent=DATA.species+' • '+DATA.class+' niveau '+DATA.level+' • '+DATA.background;const av=document.getElementById('heroAvatar');av.src=DATA.portrait||('../../assets/personnages/'+DATA.id+'.jpg');av.alt='Figurine de '+DATA.name;
const KEY='guiltanas_pj_v2_'+DATA.id;
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{hp:DATA.maxHP,temp:0,used:{},money:{...DATA.money},prepared:[],concentration:null,turn:{action:false,bonus:false,reaction:false,move:DATA.speedFt},inventory:DATA.inventory.map(x=>[...x])};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function el(id){return document.getElementById(id)}function clamp(n,a,b){return Math.max(a,Math.min(b,n))}function sign(n){return n>=0?'+'+n:String(n)}function use(id,max){state.used[id]=clamp((state.used[id]||0)+1,0,max);save();render()}function restore(id,max){state.used[id]=clamp((state.used[id]||0)-1,0,max);save();render()}function resource(r){let u=state.used[r.id]||0;return `<div class="resource"><div><strong>${r.label}</strong><small>${r.rest==='short'?'Repos court ou long':'Repos long'} • ${maxText(r.max-u,r.max)}</small></div><div><button class="btn" onclick="restore('${r.id}',${r.max})">−</button> <button class="btn" onclick="use('${r.id}',${r.max})">+</button></div></div>`}function maxText(a,b){return `${a}/${b}`}
function render(){renderHome();renderCombat();renderTests();renderMagic();renderBag()}function renderHome(){let rs=DATA.resources.map(resource).join('');el('home').innerHTML=`<div class="stats"><button class="stat"><b>${DATA.ac}</b><span>CA</span></button><button class="stat"><b>${sign(DATA.init)}</b><span>Initiative</span></button><button class="stat"><b>${DATA.speedFt*1.5} m</b><span>Vitesse</span></button><button class="stat"><b>${DATA.passive}</b><span>Perception passive</span></button></div><div class="hpbox"><div class="hpnum">${state.hp} / ${DATA.maxHP} PV</div><div>${state.temp?`${state.temp} PV temporaires`:''}</div><div class="btnrow"><button class="btn" onclick="hp(-1)">−1 PV</button><button class="btn" onclick="hp(1)">+1 PV</button><button class="btn" onclick="temp()">PV temp.</button></div><div class="btnrow"><button class="btn" onclick="rest('short')">Repos court</button><button class="btn primary" onclick="rest('long')">Repos long</button><button class="btn" onclick="resetTurn()">Nouveau tour</button></div></div><div class="grid"><div class="card"><h3>Ressources</h3>${rs||'<p>Aucune ressource limitée.</p>'}</div><div class="card"><h3>Défenses & sens</h3>${DATA.defenses.map(x=>`<p>• ${x}</p>`).join('')}</div></div>`}
function hp(d){state.hp=clamp(state.hp+d,0,DATA.maxHP);save();render()}function temp(){let n=prompt('PV temporaires ?',state.temp||0);if(n!==null){state.temp=Math.max(0,parseInt(n)||0);save();render()}}function rest(kind){if(kind==='long'){state.hp=DATA.maxHP;state.temp=0;for(const r of DATA.resources)state.used[r.id]=0;state.concentration=null}else{for(const r of DATA.resources)if(r.rest==='short')state.used[r.id]=0}save();render()}function resetTurn(){state.turn={action:false,bonus:false,reaction:false,move:DATA.speedFt};save();renderCombat()}
function renderCombat(){let weapons=DATA.weapons.map(w=>`<button class="item" onclick='showWeapon(${JSON.stringify(w).replace(/'/g,"&#39;")})'><strong>${w.name}</strong><small>${sign(w.attack)} pour toucher • ${w.damage} ${w.type}</small></button>`).join('');let feats=DATA.features.map(f=>`<button class="item" onclick='showFeature(${JSON.stringify(f).replace(/'/g,"&#39;")})'><strong>${f.name}</strong><small>${f.action||''} ${f.summary||''}</small></button>`).join('');el('combat').innerHTML=`<div class="turnbox"><div class="turnhead"><strong>Tour en cours</strong><button class="btn" onclick="resetTurn()">Réinitialiser</button></div><div class="turntokens"><button class="turntoken ${state.turn.action?'spent':''}" onclick="toggleTurn('action')"><b>Action</b><span>${state.turn.action?'Dépensée':'Disponible'}</span></button><button class="turntoken ${state.turn.bonus?'spent':''}" onclick="toggleTurn('bonus')"><b>Action bonus</b><span>${state.turn.bonus?'Dépensée':'Disponible'}</span></button><button class="turntoken ${state.turn.reaction?'spent':''}" onclick="toggleTurn('reaction')"><b>Réaction</b><span>${state.turn.reaction?'Dépensée':'Disponible'}</span></button><div class="turntoken movebox"><div><b>Déplacement</b><span>${state.turn.move*1.5} m restants</span></div><div class="movecontrols"><button onclick="move(-5)">−1,5 m</button><button onclick="move(5)">+1,5 m</button></div></div></div></div><div class="section"><h2>Attaques</h2><div class="list">${weapons}</div></div><div class="section"><h2>Capacités</h2><div class="list">${feats}</div></div>`}function toggleTurn(k){state.turn[k]=!state.turn[k];save();renderCombat()}function move(d){state.turn.move=clamp(state.turn.move+d,0,DATA.speedFt);save();renderCombat()}
function renderTests(){let ab=Object.entries(DATA.abilities).map(([k,v])=>`<div class="result"><strong>${k}</strong> ${v[0]} (${sign(v[1])}) • sauvegarde ${sign(DATA.saves[k][0])}${DATA.saves[k][1]?' maîtrisée':''}</div>`).join('');let sk=Object.entries(DATA.skills).map(([k,v])=>`<div class="result"><strong>${k}</strong> ${sign(v[1])}${v[2]?' • maîtrise':''}${v[3]!=null?' • passive '+v[3]:''}</div>`).join('');el('tests').innerHTML=`<div class="section"><h2>Caractéristiques & sauvegardes</h2>${ab}</div><div class="section"><h2>Compétences</h2>${sk}</div>`}
function renderMagic(){let spells=DATA.spells||[];let prep=DATA.magicMode==='prepare4'?`<div class="card"><h3>Préparation des sorts</h3><p>Prépare ${DATA.prepCount} sorts de niveau 1. Les sorts marqués « toujours préparé » ne comptent pas dans ce total.</p><p>${state.prepared.length}/${DATA.prepCount} préparés</p></div>`:'';el('magic').innerHTML=`${prep}<div class="section"><h2>Magie</h2><p class="tapnote">DD ${DATA.spellDC} • attaque magique ${sign(DATA.spellAttack)} • ${DATA.spellAbility}</p><div class="list">${spells.map(s=>`<button class="item" onclick='showSpell(${JSON.stringify(s).replace(/'/g,"&#39;")})'><strong>${s.name}</strong><small>${s.level?`Niveau ${s.level}`:'Tour de magie'} • ${s.cast} • ${s.range}</small></button>`).join('')}</div></div>`}
function renderBag(){let money=Object.entries(state.money).map(([k,v])=>`<button class="coin" onclick="money('${k}')"><b>${v}</b><span>${k}</span></button>`).join('');let inv=state.inventory.map((x,i)=>`<button class="item" onclick="inv(${i})"><strong>${x[0]}</strong><small>Qté ${x[1]}${x[2]?` • ${x[2]} lb`:''}</small></button>`).join('');el('bag').innerHTML=`<div class="section"><h2>Argent</h2><p class="tapnote">Touchez une monnaie pour modifier le montant.</p><div class="money">${money}</div></div><div class="section"><h2>Inventaire</h2><div class="list">${inv}</div></div>`}function money(k){let n=prompt(`${k} ?`,state.money[k]);if(n!==null){state.money[k]=Math.max(0,parseInt(n)||0);save();renderBag()}}function inv(i){let x=state.inventory[i],n=prompt(`${x[0]} — quantité ?`,x[1]);if(n!==null){x[1]=Math.max(0,parseInt(n)||0);save();renderBag()}}
function sheet(html){el('sheet').innerHTML=`<button class="close" onclick="closeSheet()">×</button>${html}`;el('modal').classList.add('show')}function closeSheet(){el('modal').classList.remove('show')}el('modal').onclick=e=>{if(e.target===el('modal'))closeSheet()};function showWeapon(w){sheet(`<h2>${w.name}</h2><p class="meta">${sign(w.attack)} pour toucher • ${w.range}</p><div class="calc">${w.damage} ${w.type}</div><div class="why">${w.props||''}${w.mastery?`<br><b>Maîtrise : ${w.mastery}</b> — ${w.masteryText||''}`:''}</div>`)}function showFeature(f){sheet(`<h2>${f.name}</h2><p class="meta">${f.action||''}</p><div class="why">${f.detail||f.summary||''}</div>${f.resource?`<button class="btn primary" onclick="use('${f.resource}',(DATA.resources.find(r=>r.id==='${f.resource}')||{max:1}).max);closeSheet()">Utiliser</button>`:''}`)}function showSpell(s){let prepared=s.always||s.prepared||state.prepared.includes(s.id);let canPrep=DATA.magicMode==='prepare4'&&s.level===1&&s.selectable;let prepBtn=canPrep?`<button class="btn" onclick="togglePrep('${s.id}')">${prepared?'Retirer de la préparation':'Préparer'}</button>`:'';let slot=DATA.resources.find(r=>r.id==='slots');let free=s.freeResource?DATA.resources.find(r=>r.id===s.freeResource):null;let actions='';if(s.level===0){actions=`<button class="btn primary" onclick="cast('${s.id}','cantrip')">Lancer</button>`}else{if(free&&(state.used[free.id]||0)<free.max)actions+=`<button class="btn primary" onclick="cast('${s.id}','free')">Lancer gratuitement</button>`;if(slot&&((state.used[slot.id]||0)<slot.max)&&(prepared||DATA.magicMode==='fixed'))actions+=`<button class="btn primary" onclick="cast('${s.id}','slot')">Utiliser un emplacement</button>`}sheet(`<h2>${s.name}</h2><p class="meta">${s.level?`Niveau ${s.level}`:'Tour de magie'} • ${s.cast} • ${s.range} • ${s.duration}</p><div class="why">${s.effect||''}</div>${s.damage?`<div class="calc">${s.damage}</div>`:''}${s.heal?`<div class="calc">${s.heal}</div>`:''}${s.save?`<div class="warn">Sauvegarde : ${s.save}</div>`:''}${s.concentration?`<div class="warn">Concentration</div>`:''}<div class="btnrow">${prepBtn}${actions}</div>`)}function togglePrep(id){let i=state.prepared.indexOf(id);if(i>=0)state.prepared.splice(i,1);else if(state.prepared.length<DATA.prepCount)state.prepared.push(id);save();closeSheet();renderMagic()}function cast(id,mode){let s=DATA.spells.find(x=>x.id===id);if(mode==='slot'){let r=DATA.resources.find(x=>x.id==='slots');if(r)state.used[r.id]=clamp((state.used[r.id]||0)+1,0,r.max)}if(mode==='free'&&s.freeResource){let r=DATA.resources.find(x=>x.id===s.freeResource);if(r)state.used[r.id]=clamp((state.used[r.id]||0)+1,0,r.max)}if(s.concentration)state.concentration=s.id;save();closeSheet();render()}
for(const b of document.querySelectorAll('.nav'))b.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===b.dataset.page))};el('search').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q){el('searchResults').innerHTML='';return}let rows=[];for(const s of DATA.spells||[])if(JSON.stringify(s).toLowerCase().includes(q))rows.push(`<button class="item" onclick='showSpell(${JSON.stringify(s).replace(/'/g,"&#39;")})'><strong>${s.name}</strong><small>Sort</small></button>`);for(const w of DATA.weapons||[])if(JSON.stringify(w).toLowerCase().includes(q))rows.push(`<button class="item" onclick='showWeapon(${JSON.stringify(w).replace(/'/g,"&#39;")})'><strong>${w.name}</strong><small>Attaque</small></button>`);for(const f of DATA.features||[])if(JSON.stringify(f).toLowerCase().includes(q))rows.push(`<button class="item" onclick='showFeature(${JSON.stringify(f).replace(/'/g,"&#39;")})'><strong>${f.name}</strong><small>Capacité</small></button>`);el('searchResults').innerHTML=`<div class="list">${rows.slice(0,8).join('')||'<div class="result">Aucun résultat</div>'}</div>`};render();
</script></body></html>
