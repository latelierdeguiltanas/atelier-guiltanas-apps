<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Interface personnage — Île aux Tempêtes</title><style>
:root{--bg:#0d1114;--panel:#171d22;--panel2:#202830;--text:#f6f5f1;--muted:#abb5bd;--accent:#d8b56e;--line:#34404a;--danger:#e98787;--ok:#8fd19b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}.app{max-width:760px;margin:auto;padding:12px 12px 92px}.top{position:sticky;top:0;z-index:30;background:linear-gradient(var(--bg) 82%,transparent);padding:8px 0 10px}.hero{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.name{font-size:24px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin-top:2px}.pill{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-weight:800;font-size:13px}.search{margin-top:10px;width:100%;border:1px solid var(--line);background:#11171c;color:white;border-radius:14px;padding:13px 14px;font-size:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 12px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center;color:var(--text);font:inherit}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.hpbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.hpnum{font-size:28px;font-weight:900}.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.btn{border:1px solid var(--line);background:var(--panel2);color:white;border-radius:13px;padding:12px 10px;font-weight:800;font-size:14px;min-height:46px}.btn.primary{background:var(--accent);color:#101316;border-color:transparent}.btn.danger{border-color:#633b3b;color:#ffd1d1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.resource{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.dots{display:flex;gap:5px}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent)}.dot.used{background:var(--accent)}.section{margin-top:16px}.section h2{font-size:18px;margin:0 0 9px}.list{display:grid;gap:8px}.item{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:white;border-radius:15px;padding:12px}.item strong{display:block;font-size:16px}.item small{display:block;color:var(--muted);margin-top:3px;line-height:1.35}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:var(--panel2);font-size:11px;margin:5px 4px 0 0}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#10161bee;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px max(7px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(7px,env(safe-area-inset-left))}.nav{border:0;background:none;color:var(--muted);padding:8px 2px;font-size:11px}.nav b{display:block;font-size:18px}.nav.active{color:var(--accent)}.page{display:none}.page.active{display:block}.modal{position:fixed;inset:0;background:#0009;z-index:90;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#171d22;border-radius:24px 24px 0 0;border:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.close{float:right;width:38px;height:38px;border-radius:50%;border:0;background:#2a343d;color:white;font-size:20px}.sheet h2{margin:2px 48px 4px 0}.meta{color:var(--muted);font-size:12px}.steps{margin:14px 0;display:grid;gap:8px}.step{background:#11171c;border:1px solid var(--line);border-radius:13px;padding:11px}.step b{display:block;margin-bottom:4px}.calc{font-size:20px;font-weight:900;color:var(--accent)}.why,.learn{background:#131a1f;border-left:3px solid var(--accent);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13px;line-height:1.45}.warn{background:#2a2115;border:1px solid #665232;padding:10px;border-radius:12px;color:#ffe0a0;font-size:13px;margin-top:10px}.result{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:8px}.money{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.coin{background:var(--panel);border:1px solid var(--line);padding:11px 5px;border-radius:13px;text-align:center;color:white}.coin b{display:block;font-size:18px}.coin span{font-size:10px;color:var(--muted)}.tapnote{font-size:12px;color:var(--muted);margin:4px 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checkline{display:flex;gap:8px;align-items:center}.checkline input{width:22px;height:22px}@media(max-width:390px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.name{font-size:21px}}@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px;max-height:82vh}}
.turnbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px;margin:8px 0 12px}.turnhead{display:flex;gap:8px;align-items:center;justify-content:space-between}.turnhead strong{font-size:16px}.turntokens{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:9px}.turntoken{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:9px 8px;text-align:left;min-height:55px}.turntoken b{display:block;font-size:13px}.turntoken span{font-size:11px;color:var(--muted)}.turntoken.spent{opacity:.5;text-decoration:line-through}.movebox{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px}.movecontrols{display:flex;gap:5px}.movecontrols button{min-width:38px;border:1px solid var(--line);background:#101612;color:var(--text);border-radius:10px;padding:7px}.turnfoot{display:flex;gap:7px;margin-top:8px}.turnfoot .btn{flex:1;min-height:40px;padding:8px;font-size:12px}@media(max-width:390px){.turntokens{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><div class="top"><div class="hero"><div><div class="name" id="heroName"></div><div class="sub" id="heroSub"></div></div><div class="pill">Niveau 1</div></div><input id="search" class="search" placeholder="Rechercher : perception, soin, feu, corde…"><div id="searchResults"></div></div><main><section id="home" class="page active"></section><section id="combat" class="page"></section><section id="tests" class="page"></section><section id="magic" class="page"></section><section id="bag" class="page"></section></main></div><div class="bottom"><button class="nav active" data-page="home"><b>⌂</b>Accueil</button><button class="nav" data-page="combat"><b>⚔</b>Combat</button><button class="nav" data-page="tests"><b>🎲</b>Tests</button><button class="nav" data-page="magic"><b>✨</b>Magie</button><button class="nav" data-page="bag"><b>🎒</b>Sac</button></div><div id="modal" class="modal"><div id="sheet" class="sheet"></div></div><script src="data.js"></script><script>
const DATA=window.__IAT_PLAYER_DATA;if(!DATA)throw new Error('Données personnage absentes');document.getElementById('heroName').textContent=(DATA.icon||'')+' '+DATA.name;document.getElementById('heroSub').textContent=DATA.species+' • '+DATA.class+' niveau '+DATA.level+' • '+DATA.background;
const KEY='guiltanas_pj_v2_'+DATA.id;
function fresh(){const resources={};DATA.resources.forEach(r=>resources[r.id]=0);return{hp:DATA.maxHP,tempHP:0,resources,concentration:null,conditions:[],money:{...DATA.money},inventory:DATA.inventory.map(x=>({name:x[0],qty:x[1],weight:x[2]})),prepared:DATA.magicMode==='prepare4'?[]:DATA.spells.filter(s=>s.prepared).map(s=>s.id),log:[]}}
let S=(()=>{try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}})();if(!S.resources)S.resources=fresh().resources;if(!S.prepared)S.prepared=[];
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function fmt(n){return n>=0?'+'+n:String(n)}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function abilityName(k){return({FOR:'Force',DEX:'Dextérité',CON:'Constitution',INT:'Intelligence',SAG:'Sagesse',CHA:'Charisme'})[k]}
function speedM(){return DATA.speedFt*.3}function speedCases(){return DATA.speedFt/5}function mtxt(m){return Number.isInteger(m)?String(m):String(m).replace('.',',')}function formatKg(lb){const kg=lb*.45359237;return (Math.round(kg*10)/10).toLocaleString('fr-FR',{maximumFractionDigits:1})}
function nav(page){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(page).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render(page)}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>nav(b.dataset.page));
function openM(html){document.getElementById('sheet').innerHTML='<button class="close" onclick="closeM()">×</button>'+html;document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}
function resourceDots(id,max){const used=S.resources[id]||0;return Array.from({length:max},(_,i)=>`<span class="dot ${i<used?'used':''}"></span>`).join('')}
function remaining(id){const r=DATA.resources.find(x=>x.id===id);return r?Math.max(0,r.max-(S.resources[id]||0)):0}
function resourceSummary(){return DATA.resources.map(r=>`${remaining(r.id)}/${r.max} ${r.label.toLowerCase()}`).join(' • ')}
function renderHome(){document.getElementById('home').innerHTML=`<div class="tapnote">💡 Touche une valeur ou un élément marqué « ? » pour savoir à quoi il sert.</div><div class="stats"><button class="stat" onclick="explain('ac')"><b>${DATA.ac}</b><span>CA • ?</span></button><button class="stat" onclick="explain('initiative')"><b>${fmt(DATA.init)}</b><span>Initiative • ?</span></button><button class="stat" onclick="explain('speed')"><b>${mtxt(speedM())} m <small>(${speedCases()} cases)</small></b><span>Vitesse • ?</span></button><button class="stat" onclick="explain('passive')"><b>${DATA.passive}</b><span>Perception passive • ?</span></button></div><div class="hpbox"><button style="border:0;background:none;color:inherit;text-align:left;padding:0" onclick="explain('hp')"><div class="sub">POINTS DE VIE • ?</div><div class="hpnum">${S.hp} / ${DATA.maxHP}${S.tempHP?` <small>(+${S.tempHP} temporaires)</small>`:''}</div></button><div class="btnrow"><button class="btn danger" onclick="hpDialog('damage')">DÉGÂTS</button><button class="btn" onclick="hpDialog('heal')">SOIN</button><button class="btn" onclick="hpDialog('temp')">PV TEMP</button></div></div><div class="grid"><button class="item" onclick="nav('combat')"><strong>⚔ Combat & capacités</strong><small>Armes, actions courantes et capacités spéciales.</small></button><button class="item" onclick="nav('magic')"><strong>✨ Magie</strong><small>Sorts, ressources, concentration et préparation si nécessaire.</small></button><button class="item" onclick="nav('tests')"><strong>🎲 Tests & sauvegardes</strong><small>Quand le MJ te demande Perception, Sagesse, Dextérité, etc.</small></button><button class="item" onclick="openResources()"><strong>⏱ Ressources</strong><small>${resourceSummary()}</small></button></div><div class="section"><h2>État actuel</h2><div class="card"><p><button class="btn" style="width:100%;margin-bottom:7px" onclick="explain('concentration')"><b>Concentration :</b> ${S.concentration?esc(S.concentration):'Aucune'} • ?</button><b>Conditions :</b> ${S.conditions.length?S.conditions.map(esc).join(', '):'Aucune'}<br><b>Défenses utiles :</b> ${DATA.defenses.map(esc).join(' ; ')||'Aucune particulière'}</p></div></div>`}
function attackCard(w){return `<button class="item" onclick="openWeapon('${w.id}')"><strong>${w.name} • ${fmt(w.attack)}</strong><small>${w.damage} ${w.type} • ${w.range}</small>${w.mastery?`<span class="tag">Maîtrise : ${w.mastery}</span>`:''}</button>`}
function turnGuide(){return `<div class="section"><h2>🧭 Comment fonctionne ton tour ?</h2><div class="tapnote">Tu n'as pas besoin de mémoriser les règles : utilise les boutons du bandeau Combat. L'application te propose les choix qui correspondent à chaque type d'action.</div><div class="card"><b>🚶 Mouvement</b><p>Tu peux parcourir jusqu'à <b>${mtxt(speedM())} m (${speedCases()} cases)</b> pendant ton tour, sans dépenser ton action. Tu peux fractionner ce déplacement : bouger, agir, puis continuer avec ce qu'il te reste.</p></div><div class="card"><b>⚔️ Action</b><p>Tu as normalement <b>1 action</b> à ton tour. Appuie sur « Action » pour choisir : attaquer, utiliser la magie, Foncer, Se désengager, Esquiver, Aider, Se cacher, Se préparer, Chercher, Étudier, Influencer ou Utiliser, ainsi que les capacités de ton personnage qui emploient une action.</p></div><div class="card"><b>➕ Action bonus</b><p>Tu peux en utiliser <b>au maximum une par tour</b>, mais seulement si un sort ou une capacité t'en propose une. Le bouton affiche directement tes possibilités.</p></div><div class="card"><b>⚡ Réaction</b><p>Elle répond à un déclencheur et peut être utilisée pendant le tour de quelqu'un d'autre. Une fois dépensée, elle revient au début de ton prochain tour. L'attaque d'opportunité est la réaction la plus courante.</p></div><div class="card"><b>🖐️ Interaction simple</b><p>Une interaction simple avec un objet ou le décor peut normalement être faite sans action pendant ton mouvement ou ton action (par exemple ouvrir une porte non bloquée). Une interaction supplémentaire ou complexe peut demander l'action Utiliser.</p></div><div class="learn"><b>Important pour la magie :</b> un tour de magie ne dépense pas d'emplacement de sort, mais il consomme quand même le type d'action indiqué par son temps d'incantation. Pendant ton propre tour, tu ne peux dépenser qu'un seul emplacement de sort pour lancer un sort.</div></div>`}
function ensureTurn(){if(!S.turn||typeof S.turn!=="object")S.turn={action:null,bonus:null,reaction:null,moveLeft:speedCases(),moveMax:speedCases(),slotSpellThisTurn:false};if(typeof S.turn.moveMax!=="number")S.turn.moveMax=speedCases();if(typeof S.turn.moveLeft!=="number")S.turn.moveLeft=S.turn.moveMax;if(typeof S.turn.action==='boolean')S.turn.action=S.turn.action?'Action utilisée':null;if(typeof S.turn.bonus==='boolean')S.turn.bonus=S.turn.bonus?'Action bonus utilisée':null;if(typeof S.turn.reaction==='boolean')S.turn.reaction=S.turn.reaction?'Réaction utilisée':null;return S.turn}
function spendMove(n){const t=ensureTurn();t.moveLeft=Math.max(0,Math.min(t.moveMax,t.moveLeft-n));save();renderCombat()}
function resetTurn(){S.turn={action:null,bonus:null,reaction:null,moveLeft:speedCases(),moveMax:speedCases(),slotSpellThisTurn:false};save();renderCombat()}
function undoTurn(k){const t=ensureTurn();t[k]=null;if(k==='action'&&t.moveMax>speedCases()){const spent=t.moveMax-t.moveLeft;t.moveMax=speedCases();t.moveLeft=Math.max(0,speedCases()-Math.min(spent,speedCases()))}save();renderCombat()}
function consumeTurn(k,label){const t=ensureTurn();if(t[k])return false;t[k]=label;save();return true}
function openTurnGuide(){openM(`<h2>🧭 Ton tour, simplement</h2>${turnGuide()}`)}
function spellTiming(s,kind){const c=(s.cast||'').toLowerCase();if(kind==='bonus')return c.includes('action bonus');if(kind==='reaction')return c.includes('réaction')||c.includes('reaction');return !c.includes('action bonus')&&!c.includes('réaction')&&!c.includes('reaction')&&(c.includes('1 action')||c.includes('action ou rituel'))}
function featureTiming(f,kind){const a=(f.action||'').toLowerCase();if(kind==='bonus')return a.includes('action bonus');if(kind==='reaction')return a.includes('réaction')||a.includes('reaction');return a==='action'||a.includes('action utiliser')}
function chooseAttack(){openM(`<h2>⚔️ Choisis ton attaque</h2><div class="tapnote">Tu peux ouvrir chaque attaque pour lire ses détails et la comparer. <b>Rien n’est consommé tant que tu n’appuies pas sur CONFIRMER.</b></div><div class="list">${DATA.weapons.map(w=>`<button class="item" onclick="previewAttack('${w.id}')"><strong>${w.name} • ${fmt(w.attack)}</strong><small>${w.damage} ${w.type} • ${w.range}</small></button>`).join('')}</div><button class="btn" style="width:100%;margin-top:10px" onclick="actionMenu()">← Retour aux actions</button>`) }
function previewAttack(id){const w=DATA.weapons.find(x=>x.id===id);openM(`<h2>${w.name}</h2><div class="meta">${w.props} • ${w.range}</div><div class="steps"><div class="step"><b>POUR TOUCHER</b><div class="calc">🎲 1d20 ${fmt(w.attack)}</div></div><div class="step"><b>SI TU TOUCHES</b><div class="calc">🎲 ${w.damage} ${w.type}</div></div>${w.mastery?`<div class="step"><b>MAÎTRISE — ${w.mastery}</b>${w.masteryText||''}</div>`:''}</div><div class="tapnote">👀 Consultation seulement : ton action est encore disponible.</div><div class="btnrow"><button class="btn" onclick="chooseAttack()">← Comparer une autre attaque</button><button class="btn primary" onclick="commitAttack('${id}')">✓ CONFIRMER CETTE ATTAQUE</button></div>`)}
function commitAttack(id){const w=DATA.weapons.find(x=>x.id===id);if(!consumeTurn('action','Attaque — '+w.name))return;closeM();renderCombat();openWeapon(id)}
function chooseMagic(kind){const list=(DATA.spells||[]).filter(s=>spellTiming(s,kind));if(!list.length)return info('Magie','Aucun sort de ta fiche n’utilise ce type d’action.');openM(`<h2>✨ Choisis ton sort</h2><div class="tapnote">Tour de magie = aucun emplacement dépensé. Un sort de niveau 1 peut demander un emplacement ou une utilisation gratuite.</div><div class="list">${list.map(s=>`<button class="item" onclick="previewSpellChoice('${s.id}','${kind}')"><strong>${s.name}</strong><small>${s.cast} • ${s.level===0?'tour de magie, aucun emplacement':(s.freeMax?'niveau 1 • lancement gratuit possible ou emplacement':'niveau 1 • emplacement')}</small></button>`).join('')}</div>`)}
function previewSpellChoice(id,kind){const s=DATA.spells.find(x=>x.id===id);openM(`<h2>✨ ${s.name}</h2><div class="meta">${s.source||''} • ${s.cast}</div><div class="two"><div class="step"><b>Portée</b>${s.range||'—'}</div><div class="step"><b>Durée</b>${s.duration||'—'}</div></div>${s.effect?`<div class="why"><b>Effet :</b> ${s.effect}</div>`:''}${s.damage?`<div class="why"><b>Dégâts :</b> ${s.damage}</div>`:''}${s.heal?`<div class="why"><b>Soin :</b> ${s.heal}</div>`:''}<div class="tapnote">👀 Consultation seulement : rien n’est encore consommé.</div><div class="btnrow"><button class="btn" onclick="chooseMagic('${kind}')">← Comparer un autre sort</button><button class="btn primary" onclick="commitSpellChoice('${id}','${kind}')">✓ CONFIRMER CE SORT</button></div>`)}
function commitSpellChoice(id,kind){const s=DATA.spells.find(x=>x.id===id),key=kind==='bonus'?'bonus':kind==='reaction'?'reaction':'action';if(!s)return;const t=ensureTurn();if(t[key])return info('Action déjà utilisée','Ce budget de tour est déjà consommé.');if(s.level===0)return commitSpellUse(id,kind,'cantrip');let b='';if(s.freeResource&&remaining(s.freeResource)>0)b+=`<button class="btn primary" onclick="commitSpellUse('${id}','${kind}','free')">LANCER GRATUITEMENT (${remaining(s.freeResource)})</button>`;if(spellAvailable(s)&&remaining('slots')>0)b+=`<button class="btn" onclick="commitSpellUse('${id}','${kind}','slot')">UTILISER 1 EMPLACEMENT (${remaining('slots')} restant)</button>`;if(s.ritual)b+=`<button class="btn" onclick="commitSpellUse('${id}','${kind}','ritual')">LANCER EN RITUEL • 0 emplacement</button>`;if(!b)b='<button class="btn" disabled>Aucune ressource magique disponible</button>';openM(`<h2>✨ ${s.name}</h2><div class="tapnote">Choisis maintenant comment lancer ce sort. <b>Rien n’est consommé avant ton choix.</b></div><div class="btnrow">${b}<button class="btn" onclick="previewSpellChoice('${id}','${kind}')">← Retour</button></div>`)}
function commitSpellUse(id,kind,mode){const s=DATA.spells.find(x=>x.id===id),key=kind==='bonus'?'bonus':kind==='reaction'?'reaction':'action';if(!s)return;const t=ensureTurn();if(t[key])return;if(mode==='slot'&&remaining('slots')<=0)return info('Plus d’emplacement','Tu n’as plus d’emplacement de niveau 1.');if(mode==='free'&&(!s.freeResource||remaining(s.freeResource)<=0))return info('Utilisation gratuite dépensée','Cette utilisation gratuite n’est plus disponible.');t[key]='Magie — '+s.name;if(mode==='slot')S.resources.slots=(S.resources.slots||0)+1;if(mode==='free')S.resources[s.freeResource]=(S.resources[s.freeResource]||0)+1;if(s.concentration)S.concentration=s.name;save();closeM();renderCombat();openM(`<h2>✓ ${s.name}</h2><div class="learn">${mode==='slot'?'Action validée et <b>1 emplacement de sort dépensé</b>.':mode==='free'?'Action validée et <b>utilisation gratuite dépensée</b>.':'Action validée. <b>Aucun emplacement dépensé</b>.'}</div><div class="why"><b>Effet :</b> ${s.effect}</div><button class="btn primary" onclick="closeM();render()">OK</button>`)}
function previewStandard(id){const labels={dash:'Foncer',disengage:'Se désengager',dodge:'Esquiver',help:'Aider',hide:'Se cacher',ready:'Se préparer',search:'Chercher',study:'Étudier',influence:'Influencer',utilize:'Utiliser'};const texts={dash:'Tu gagnes un déplacement supplémentaire égal à ta vitesse.',disengage:'Ton déplacement ne provoque pas d’attaque d’opportunité pour le reste de ce tour.',dodge:'Tu te concentres sur ta défense jusqu’au début de ton prochain tour.',help:'Tu aides une autre créature selon les conditions de l’action Aider.',hide:'Tu tentes de te cacher.',ready:'Tu prépares une réponse à un déclencheur perceptible.',search:'Tu cherches activement quelque chose.',study:'Tu analyses une information, un objet ou une situation.',influence:'Tu essaies d’influencer une créature.',utilize:'Tu utilises un objet ou mécanisme qui exige cette action.'};openM(`<h2>${labels[id]}</h2><div class="learn">${texts[id]}</div><div class="tapnote">👀 Consultation seulement : ton action est encore disponible.</div><div class="btnrow"><button class="btn" onclick="actionMenu()">← Retour</button><button class="btn primary" onclick="commitStandard('${id}')">✓ CONFIRMER</button></div>`)}
function commitStandard(id){const labels={dash:'Foncer',disengage:'Se désengager',dodge:'Esquiver',help:'Aider',hide:'Se cacher',ready:'Se préparer',search:'Chercher',study:'Étudier',influence:'Influencer',utilize:'Utiliser'};if(!consumeTurn('action',labels[id]))return;if(id==='dash'){const t=ensureTurn();t.moveMax+=speedCases();t.moveLeft+=speedCases();save()}renderCombat();const texts={dash:`Tu gagnes immédiatement ${speedCases()} cases de déplacement supplémentaires pour ce tour.`,disengage:`Ton déplacement ne provoque pas d'attaque d'opportunité pour le reste de ce tour.`,dodge:`Jusqu'au début de ton prochain tour, les attaques contre toi ont Désavantage si tu les vois et tu as Avantage aux jets de sauvegarde de Dextérité.`,help:`Tu aides une autre créature selon les conditions de l'action Aider.`,hide:`Tu tentes de te cacher. Utilise ton bonus de Discrétion indiqué dans l'onglet Tests.`,ready:`Annonce un déclencheur perceptible et ce que tu feras lorsqu'il survient. L'exécution utilisera normalement ta réaction.`,search:`Tu cherches activement quelque chose. Le MJ indique le test approprié.`,study:`Tu étudies une information, un objet ou une situation. Le MJ indique le test approprié.`,influence:`Tu essaies d'influencer une créature par la conversation ou le comportement.`,utilize:`Tu utilises un objet ou un élément qui exige l'action Utiliser.`};info(labels[id],texts[id])}
function previewFeature(id,kind){const f=(DATA.features||[]).find(x=>x.id===id);if(!f)return;const back=kind==='bonus'?`bonusMenu()`:kind==='reaction'?`reactionMenu()`:`actionMenu()`;openM(`<h2>⭐ ${f.name}</h2><div class="meta">${f.action||''}</div><div class="learn"><b>${esc(f.summary||'')}</b><br><br>${esc(f.detail||'')}</div><div class="tapnote">👀 Consultation seulement : rien n’est encore consommé.</div><div class="btnrow"><button class="btn" onclick="${back}">← Retour</button><button class="btn primary" onclick="commitFeature('${id}','${kind}')">✓ CONFIRMER</button></div>`)}
function commitFeature(id,kind){const f=(DATA.features||[]).find(x=>x.id===id);if(!f)return;const key=kind==='bonus'?'bonus':kind==='reaction'?'reaction':'action';if(!consumeTurn(key,f.name))return;closeM();renderCombat();info(f.name,`<b>${esc(f.summary||'')}</b><br><br>${esc(f.detail||'')}`)}
function previewOpportunity(){openM(`<h2>⚔️ Attaque d’opportunité</h2><div class="learn">Quand une créature que tu peux atteindre quitte ta portée en utilisant son déplacement, son action ou sa réaction sans s’être Désengagée, tu peux utiliser ta réaction pour faire une attaque de mêlée contre elle, juste avant qu’elle quitte ta portée.</div><div class="tapnote">👀 Consultation seulement : ta réaction est encore disponible.</div><div class="btnrow"><button class="btn" onclick="reactionMenu()">← Retour</button><button class="btn primary" onclick="opportunity()">✓ CONFIRMER</button></div>`)}
function opportunity(){if(!consumeTurn('reaction',"Attaque d'opportunité"))return;closeM();renderCombat();info("Attaque d'opportunité",`Réaction consommée : attaque d’opportunité.`)}
function actionMenu(){const feats=(DATA.features||[]).filter(f=>featureTiming(f,'action'));openM(`<h2>⚔️ Que veux-tu faire avec ton action ?</h2><div class="list"><button class="item" onclick="chooseAttack()"><strong>⚔️ Attaquer</strong><small>Choisir une arme et faire une attaque.</small></button>${(DATA.spells||[]).some(s=>spellTiming(s,'action'))?`<button class="item" onclick="chooseMagic('action')"><strong>✨ Magie</strong><small>Sorts et tours de magie qui utilisent ton action.</small></button>`:''}${feats.map(f=>`<button class="item" onclick="previewFeature('${f.id}','action')"><strong>⭐ ${f.name}</strong><small>${f.summary||f.action}</small></button>`).join('')}${[['dash','🏃 Foncer','Ajouter ta vitesse à ton déplacement du tour.'],['disengage','↩️ Se désengager','Éviter les attaques d’opportunité dues à ton déplacement.'],['dodge','🛡️ Esquiver','Te concentrer sur ta défense.'],['help','🤝 Aider','Aider une autre créature.'],['hide','🥷 Se cacher','Tenter de devenir caché.'],['ready','⏳ Se préparer','Préparer une réponse à un déclencheur.'],['search','🔎 Chercher','Chercher activement.'],['study','📚 Étudier','Analyser une information ou une situation.'],['influence','💬 Influencer','Essayer d’influencer une créature.'],['utilize','🖐️ Utiliser','Utiliser un objet ou mécanisme qui exige une action.']].map(x=>`<button class="item" onclick="previewStandard('${x[0]}')"><strong>${x[1]}</strong><small>${x[2]}</small></button>`).join('')}</div>`)}
function bonusMenu(){const spells=(DATA.spells||[]).filter(s=>spellTiming(s,'bonus')),feats=(DATA.features||[]).filter(f=>featureTiming(f,'bonus'));openM(`<h2>➕ Tes actions bonus possibles</h2>${!spells.length&&!feats.length?`<div class="card"><p>Ta fiche ne te donne actuellement aucune action bonus utilisable sans condition particulière.</p></div>`:`<div class="list">${spells.map(s=>`<button class="item" onclick="commitSpellChoice('${s.id}','bonus')"><strong>✨ ${s.name}</strong><small>${s.cast}</small></button>`).join('')}${feats.map(f=>`<button class="item" onclick="previewFeature('${f.id}','bonus')"><strong>⭐ ${f.name}</strong><small>${f.summary||f.action}</small></button>`).join('')}</div>`}`)}
function reactionMenu(){const spells=(DATA.spells||[]).filter(s=>spellTiming(s,'reaction')),feats=(DATA.features||[]).filter(f=>featureTiming(f,'reaction'));openM(`<h2>⚡ Tes réactions possibles</h2><div class="tapnote">Une réaction exige toujours un déclencheur. Ne la dépense que lorsque ce déclencheur arrive.</div><div class="list"><button class="item" onclick="previewOpportunity()"><strong>⚔️ Attaque d'opportunité</strong><small>Un ennemi quitte ta portée sans se Désengager.</small></button>${spells.map(s=>`<button class="item" onclick="commitSpellChoice('${s.id}','reaction')"><strong>✨ ${s.name}</strong><small>${s.cast}</small></button>`).join('')}${feats.map(f=>`<button class="item" onclick="previewFeature('${f.id}','reaction')"><strong>⭐ ${f.name}</strong><small>${f.summary||f.action}</small></button>`).join('')}</div>`)}
function chooseTurn(k){const t=ensureTurn();if(t[k])return undoTurn(k);if(k==='action')actionMenu();else if(k==='bonus')bonusMenu();else if(k==='reaction')reactionMenu()}
function turnTracker(){const t=ensureTurn();const tok=(k,icon,label)=>`<button class="turntoken ${t[k]?'spent':''}" onclick="chooseTurn('${k}')"><b>${icon} ${label}</b><span>${t[k]?`✓ ${esc(t[k])} — toucher pour annuler`:'DISPONIBLE — toucher pour choisir'}</span></button>`;return `<div class="turnbox"><div class="turnhead"><strong>🎯 Mon tour</strong><button class="btn" style="min-height:36px;padding:6px 9px" onclick="openTurnGuide()">? Règles du tour</button></div><div class="turntokens"><div class="turntoken movebox ${t.moveLeft===0?'spent':''}"><div><b>🚶 Mouvement</b><span><b style="display:inline;color:inherit">${t.moveLeft}/${t.moveMax} cases</b> restantes</span></div><div class="movecontrols"><button onclick="spendMove(1)">−1</button><button onclick="spendMove(2)">−2</button><button onclick="spendMove(-1)">+1</button></div></div>${tok('action','⚔️','Action')}${tok('bonus','➕','Action bonus')}${tok('reaction','⚡','Réaction')}</div><div class="turnfoot"><div class="tapnote">🖐️ 1 interaction simple avec le décor/objet peut normalement se faire sans action pendant ton mouvement ou ton action.</div><button class="btn primary" onclick="resetTurn()">↻ Nouveau tour</button></div></div>`}
function renderCombat(){document.getElementById('combat').innerHTML=turnTracker()+`<div class="section"><h2>Raccourcis</h2><div class="grid"><button class="item" onclick="chooseTurn('action')"><strong>⚔️ Choisir mon action</strong><small>L'application la consommera quand tu auras choisi quoi faire.</small></button><button class="item" onclick="chooseTurn('bonus')"><strong>➕ Action bonus</strong><small>Uniquement les possibilités réelles de ${DATA.name}.</small></button></div></div><div class="section"><h2>Attaques — consultation</h2><div class="tapnote">Tu peux consulter une attaque ici sans consommer ton action. Pour jouer ton tour, passe par « Choisir mon action ».</div><div class="list">${DATA.weapons.map(attackCard).join('')}</div></div>`}
function renderTests(){const abs=Object.entries(DATA.abilities).map(([k,v])=>`<button class="item" onclick="openCheck('${k}',${v[1]},'Test de caractéristique')"><strong>${abilityName(k)} ${fmt(v[1])}</strong><small>Score ${v[0]}</small></button>`).join('');const sk=Object.entries(DATA.skills).map(([n,v])=>`<button class="item" onclick="openSkill('${n}')"><strong>${n} ${fmt(v[1])} ${v[2]?'★':''}</strong><small>${abilityName(v[0])}${v[3]!=null?` • passive : ${v[3]}`:''}</small></button>`).join('');const sv=Object.entries(DATA.saves).map(([k,v])=>`<button class="item" onclick="openCheck('${k}',${v[0]},'Jet de sauvegarde',${v[1]})"><strong>${abilityName(k)} ${fmt(v[0])} ${v[1]?'★':''}</strong><small>${v[1]?'Maîtrisé':'Non maîtrisé'}</small></button>`).join('');document.getElementById('tests').innerHTML=`<div class="tapnote">💡 ★ = ton personnage maîtrise ce jet ou cette compétence. Le bonus affiché est déjà complet : ne rajoute pas la maîtrise une deuxième fois.</div><div class="section"><h2>Caractéristiques <button class="btn" onclick="explain('check')">?</button></h2><div class="list">${abs}</div></div><div class="section"><h2>Compétences</h2><div class="list">${sk}</div></div><div class="section"><h2>Jets de sauvegarde <button class="btn" onclick="explain('save')">?</button></h2><div class="list">${sv}</div></div>`}
function spellAvailable(s){if(DATA.magicMode!=='prepare4')return true;if(s.level===0||s.always||s.freeResource)return true;return S.prepared.includes(s.id)}
function spellCostText(s){if(s.level===0)return 'À volonté';let a=[];if(s.freeResource&&remaining(s.freeResource)>0)a.push(`gratuit ${remaining(s.freeResource)}`);if(spellAvailable(s))a.push(`${remaining('slots')} emplacement(s)`);return a.join(' • ')||'indisponible'}
function renderMagic(){let prep='';if(DATA.magicMode==='prepare4'){const selectable=DATA.spells.filter(s=>s.selectable);prep=`<div class="section"><h2>Préparer tes sorts (${S.prepared.length}/${DATA.prepCount})</h2><div class="tapnote">Après un repos long, choisis ${DATA.prepCount} sorts de Druide pour la journée. Les sorts toujours préparés/gratuits restent séparés.</div><div class="list">${selectable.map(s=>`<label class="item checkline"><input type="checkbox" ${S.prepared.includes(s.id)?'checked':''} onchange="togglePrep('${s.id}')"><span><strong>${s.name}</strong><small>${s.cast} • ${s.range}</small></span></label>`).join('')}</div></div>`}const can=DATA.spells.filter(s=>s.level===0);const lvl=DATA.spells.filter(s=>s.level===1&&(DATA.magicMode!=='prepare4'||s.always||s.freeResource||S.prepared.includes(s.id)));document.getElementById('magic').innerHTML=`<div class="card"><h3>${DATA.spellAbility} • <button class="btn" onclick="explain('dc')">DD ${DATA.spellDC} • ?</button> <button class="btn" onclick="explain('spellattack')">Attaque ${fmt(DATA.spellAttack)} • ?</button></h3>${DATA.resources.filter(r=>r.id==='slots'||r.id.toLowerCase().includes('free')).map(r=>`<div class="resource"><span>${r.label}</span><div class="dots">${resourceDots(r.id,r.max)}</div></div>`).join('')}<p style="margin-top:10px">Concentration : <b>${S.concentration||'aucune'}</b></p></div><div class="section"><h2>Tours de magie</h2><div class="list">${can.map(spellCard).join('')}</div></div>${prep}<div class="section"><h2>Sorts utilisables maintenant</h2><div class="list">${lvl.map(spellCard).join('')||'<div class="card"><p>Aucun sort de niveau 1 préparé pour le moment.</p></div>'}</div></div><div class="section"><button class="btn" onclick="longRest()">🌙 Repos long</button>${DATA.shortRest?` <button class="btn" onclick="shortRest()">☀ Repos court</button>`:''}</div>`}
function spellCard(s){return `<button class="item" onclick="openSpell('${s.id}')"><strong>${s.name}</strong><small>${s.cast} • ${spellCostText(s)}</small>${s.concentration?'<span class="tag">Concentration</span>':''}${s.ritual?'<span class="tag">Rituel</span>':''}${s.always?'<span class="tag">Toujours préparé</span>':''}</button>`}
function renderBag(){const items=S.inventory.map((x,i)=>`<button class="item" onclick="invDialog(${i})"><strong>${esc(x.name)} × ${x.qty}</strong><small>${x.weight?formatKg(x.weight)+' kg au total':'Poids non indiqué'}</small></button>`).join('');document.getElementById('bag').innerHTML=`<div class="section"><h2>Monnaie <button class="btn" onclick="explain('money')">?</button></h2><div class="money">${Object.entries(S.money).map(([k,v])=>`<button class="coin" onclick="moneyDialog('${k}')"><b>${v}</b><span>${k}</span></button>`).join('')}</div></div><div class="section"><h2>Inventaire</h2><div class="list">${items}</div><button class="btn" style="margin-top:10px" onclick="addItem()">＋ Ajouter un objet</button></div><div class="section"><button class="btn" onclick="backup()">Exporter sauvegarde</button> <button class="btn danger" onclick="resetAll()">Réinitialiser</button></div>`}
function render(p=document.querySelector('.page.active')?.id||'home'){({home:renderHome,combat:renderCombat,tests:renderTests,magic:renderMagic,bag:renderBag})[p]()}
const HELP={ac:['Classe d’armure (CA)',`C’est le nombre qu’un ennemi doit atteindre avec son attaque pour te toucher. ${DATA.name} a <b>${DATA.ac}</b> : en dessous, l’attaque rate ; à ${DATA.ac} ou plus, elle touche.`],initiative:['Initiative',`Au début d’un combat, lance <b>1d20 ${fmt(DATA.init)}</b>. Le résultat sert à déterminer l’ordre des tours.`],speed:['Vitesse',`Tu peux normalement parcourir <b>${mtxt(speedM())} m (${speedCases()} cases)</b> pendant ton tour. Avec Foncer, tu gagnes encore la même distance.`],passive:['Perception passive',`Le MJ peut utiliser directement <b>${DATA.passive}</b> pour savoir ce que ${DATA.name} remarque sans demander de jet.`],hp:['Points de vie (PV)','Ils représentent les dégâts que tu peux encore encaisser. Les PV temporaires absorbent d’abord les dégâts et ne s’ajoutent pas à tes PV maximum.'],concentration:['Concentration','Tu ne peux maintenir qu’un seul sort à concentration à la fois. En commencer un autre met fin au précédent.'],slots:['Emplacements de sorts','Ce sont les ressources qui permettent de lancer les sorts de niveau 1. Un repos long les récupère.'],dc:['DD de tes sorts',`Quand ton sort demande à la cible de résister, elle doit atteindre ton DD. Ici : <b>${DATA.spellDC}</b>.`],spellattack:['Attaque de sort',`Quand un sort demande une attaque, lance <b>1d20 ${fmt(DATA.spellAttack)}</b> contre la CA de la cible.`],check:['Test de caractéristique','Quand le MJ demande un test de Force, Dextérité, etc., lance 1d20 et ajoute le bonus affiché.'],save:['Jet de sauvegarde','C’est un jet fait pour résister à un danger, un sort ou un effet. Lance 1d20 et ajoute le bonus affiché.'],money:['Monnaie','PC = pièces de cuivre, PA = argent, PE = électrum, PO = or, PP = platine.']};
function explain(k){const h=HELP[k];if(h)openM(`<h2>${h[0]}</h2><div class="learn">${h[1]}</div>`)}function info(t,b){openM(`<h2>${t}</h2><div class="learn">${b}</div>`)}
function openWeapon(id){const w=DATA.weapons.find(x=>x.id===id);openM(`<h2>${w.name}</h2><div class="meta">${w.props||''} • ${w.range}</div><div class="steps"><div class="step"><b>1. POUR TOUCHER</b><div class="calc">🎲 1d20 ${fmt(w.attack)}</div>Donne le total au MJ.</div><div class="step"><b>2. SI TU TOUCHES</b><div class="calc">🎲 ${w.damage}</div>${w.type}</div>${w.mastery?`<div class="step"><b>3. MAÎTRISE — ${w.mastery}</b>${w.masteryText}</div>`:''}</div>${w.ammo?`<div class="why">Cette arme utilise : <b>${w.ammo}</b>.</div>`:''}`)}
function openFeature(id){const f=DATA.features.find(x=>x.id===id);let use='';if(f.resource){const n=remaining(f.resource);use=n>0?`<button class="btn primary" onclick="useFeature('${id}')">UTILISER (${n} restant)</button>`:`<button class="btn" disabled>Plus d’utilisation disponible</button>`}openM(`<h2>${f.name}</h2><div class="meta">${f.action}</div><div class="learn">${f.detail}</div>${use}`)}function useFeature(id){const f=DATA.features.find(x=>x.id===id);if(f.resource){const r=DATA.resources.find(x=>x.id===f.resource);if((S.resources[f.resource]||0)>=r.max)return;S.resources[f.resource]=(S.resources[f.resource]||0)+1;save()}closeM();render()}
function openCheck(k,bonus,type,prof=false){openM(`<h2>${type} — ${abilityName(k)}</h2><div class="step"><b>Ce que tu lances</b><div class="calc">🎲 1d20 ${fmt(bonus)}</div></div><div class="why">${prof?'★ Maîtrisé : le bonus de maîtrise est déjà inclus.':'Le nombre affiché est le bonus total à ajouter.'}</div>`)}function openSkill(n){const v=DATA.skills[n];openM(`<h2>${n}</h2><div class="step"><b>Quand le MJ demande ${n}</b><div class="calc">🎲 1d20 ${fmt(v[1])}</div></div><div class="why">${abilityName(v[0])} ${fmt(DATA.abilities[v[0]][1])}${v[2]?` + maîtrise +${DATA.prof}`:''} = <b>${fmt(v[1])}</b>. ${v[2]?'Ne rajoute rien de plus.':''}</div>${v[3]!=null?`<div class="learn">Valeur passive : <b>${v[3]}</b>.</div>`:''}`)}
function openSpell(id){const s=DATA.spells.find(x=>x.id===id);if(!s)return;let buttons='';if(s.level===0)buttons=`<button class="btn primary" onclick="useSpell('${id}','cantrip')">UTILISER</button>`;else{if(s.freeResource&&remaining(s.freeResource)>0)buttons+=`<button class="btn primary" onclick="useSpell('${id}','free')">LANCER GRATUITEMENT (${remaining(s.freeResource)})</button>`;if(spellAvailable(s)&&remaining('slots')>0)buttons+=`<button class="btn" onclick="useSpell('${id}','slot')">UTILISER 1 EMPLACEMENT (${remaining('slots')} restant)</button>`;if(s.ritual)buttons+=`<button class="btn" onclick="useSpell('${id}','ritual')">LANCER EN RITUEL • 0 emplacement</button>`;if(!buttons)buttons='<button class="btn" disabled>Sort indisponible actuellement</button>'}openM(`<h2>${s.name}</h2><div class="meta">${s.source} • ${s.cast}</div><div class="two"><div class="step"><b>Portée</b>${s.range}</div><div class="step"><b>Durée</b>${s.duration}</div></div><div class="steps">${s.how.map((x,i)=>`<div class="step"><b>${i+1}. ${i===0?'COMMENCE ICI':'ENSUITE'}</b>${x}</div>`).join('')}</div>${s.damage?`<div class="why"><b>Dégâts :</b> ${s.damage}</div>`:''}${s.heal?`<div class="why"><b>Soin :</b> ${s.heal}</div>`:''}${s.save?`<div class="why"><b>Sauvegarde :</b> ${s.save}</div>`:''}<div class="why"><b>Effet :</b> ${s.effect}</div>${s.concentration&&S.concentration&&S.concentration!==s.name?`<div class="warn">Tu te concentres déjà sur ${S.concentration}. Ce sort mettra fin à cette concentration.</div>`:''}<div class="btnrow">${buttons}</div>`)}
function useSpell(id,mode){const s=DATA.spells.find(x=>x.id===id);if(mode==='slot'){if(remaining('slots')<=0)return;S.resources.slots=(S.resources.slots||0)+1}if(mode==='free'&&s.freeResource){if(remaining(s.freeResource)<=0)return;S.resources[s.freeResource]=(S.resources[s.freeResource]||0)+1}if(s.concentration)S.concentration=s.name;save();closeM();render()}
function togglePrep(id){if(DATA.magicMode!=='prepare4')return;if(S.prepared.includes(id))S.prepared=S.prepared.filter(x=>x!==id);else{if(S.prepared.length>=DATA.prepCount){alert(`Maximum : ${DATA.prepCount} sorts préparés.`);renderMagic();return}S.prepared.push(id)}save();renderMagic()}
function openResources(){openM(`<h2>Ressources</h2>${DATA.resources.map(r=>`<div class="resource"><span>${r.label}</span><b>${remaining(r.id)}/${r.max}</b></div>`).join('')}<div class="resource"><span>Concentration</span><b>${S.concentration||'—'}</b></div>${S.concentration?'<button class="btn danger" style="width:100%;margin-top:12px" onclick="endConcentration()">Arrêter la concentration</button>':''}`)}function endConcentration(){S.concentration=null;save();closeM();render()}
function longRest(){if(!confirm('Appliquer un repos long ? Les ressources concernées seront récupérées.'))return;DATA.resources.filter(r=>r.rest==='long'||r.rest==='short').forEach(r=>S.resources[r.id]=0);S.concentration=null;save();render()}function shortRest(){if(!confirm('Appliquer un repos court ?'))return;DATA.resources.filter(r=>r.rest==='short').forEach(r=>S.resources[r.id]=0);save();render()}
function hpDialog(mode){const label=mode==='damage'?'Dégâts reçus':mode==='heal'?'PV soignés':'PV temporaires';openM(`<h2>${label}</h2><input id="num" type="number" min="0" inputmode="numeric" style="width:100%;font-size:22px;padding:12px;border-radius:12px"><button class="btn primary" style="width:100%;margin-top:10px" onclick="applyHP('${mode}')">VALIDER</button>`)}function applyHP(mode){let n=Math.max(0,parseInt(document.getElementById('num').value||0));if(mode==='damage'){let left=n;if(S.tempHP>0){const a=Math.min(S.tempHP,left);S.tempHP-=a;left-=a}S.hp=Math.max(0,S.hp-left)}else if(mode==='heal')S.hp=Math.min(DATA.maxHP,S.hp+n);else S.tempHP=Math.max(S.tempHP,n);save();closeM();render()}
function invDialog(i){const x=S.inventory[i];openM(`<h2>${esc(x.name)}</h2><div class="learn">Quantité : <b>${x.qty}</b>${x.weight?` • Poids total : <b>${formatKg(x.weight)} kg</b>`:''}</div><div class="btnrow"><button class="btn" onclick="changeQty(${i},1)">+1</button><button class="btn" onclick="changeQty(${i},-1)">−1</button><button class="btn danger" onclick="removeItem(${i})">Retirer</button></div>`)}function changeQty(i,d){S.inventory[i].qty=Math.max(0,S.inventory[i].qty+d);save();closeM();renderBag()}function removeItem(i){if(confirm('Retirer cet objet ?')){S.inventory.splice(i,1);save();closeM();renderBag()}}function addItem(){const n=prompt('Nom de l’objet :');if(!n)return;S.inventory.push({name:n,qty:1,weight:0});save();renderBag()}
function moneyDialog(k){openM(`<h2>${k}</h2><div class="learn">Tu possèdes <b>${S.money[k]}</b>.</div><div class="btnrow"><button class="btn" onclick="moneyChange('${k}',1)">+1</button><button class="btn" onclick="moneyChange('${k}',-1)">−1</button><button class="btn" onclick="moneyChange('${k}',10)">+10</button></div>`)}function moneyChange(k,d){S.money[k]=Math.max(0,S.money[k]+d);save();closeM();renderBag()}
function backup(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=DATA.id+'_sauvegarde.json';a.click();URL.revokeObjectURL(a.href)}function resetAll(){if(confirm('Réinitialiser complètement les données variables de ce personnage ?')){S=fresh();save();render()}}
function searchNow(q){q=q.trim().toLowerCase();if(!q){document.getElementById('searchResults').innerHTML='';return}const R=[];Object.entries(DATA.skills).forEach(([n,v])=>{if(n.toLowerCase().includes(q))R.push([n,`Compétence • 1d20 ${fmt(v[1])}`,`openSkill(${JSON.stringify(n)})`])});Object.entries(DATA.saves).forEach(([k,v])=>{const n='sauvegarde '+abilityName(k).toLowerCase();if(n.includes(q)||abilityName(k).toLowerCase().includes(q))R.push(['Sauvegarde '+abilityName(k),`1d20 ${fmt(v[0])}`,`openCheck('${k}',${v[0]},'Jet de sauvegarde',${v[1]})`])});DATA.weapons.forEach(w=>{if((w.name+' '+(w.mastery||'')).toLowerCase().includes(q))R.push([w.name,`Attaque ${fmt(w.attack)} • ${w.damage}`,`openWeapon('${w.id}')`])});DATA.features.forEach(f=>{if((f.name+' '+f.summary).toLowerCase().includes(q))R.push([f.name,f.summary,`openFeature('${f.id}')`])});DATA.spells.forEach(s=>{if((s.name+' '+s.source+' '+s.effect).toLowerCase().includes(q))R.push([s.name,`${s.cast} • ${s.range}`,`openSpell('${s.id}')`])});S.inventory.forEach((x,i)=>{if(x.name.toLowerCase().includes(q))R.push([x.name,`Objet × ${x.qty}`,`invDialog(${i})`])});document.getElementById('searchResults').innerHTML=R.length?`<div class="section"><h2>Résultats</h2>${R.slice(0,12).map(r=>`<button class="result" onclick="${r[2]}"><b>${r[0]}</b><div>${r[1]}</div></button>`).join('')}</div>`:`<div class="card"><p>Aucun résultat pour « ${esc(q)} ».</p></div>`}
document.getElementById('search').addEventListener('input',e=>searchNow(e.target.value));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});render();
</script></body></html>
