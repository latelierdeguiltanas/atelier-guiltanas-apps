<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vax'Ildan — Île aux Tempêtes</title><script>(async()=>{let b='';for(let i=1;i<=3;i++)b+=await(await fetch('payload-'+i+'.txt')).text();const a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const s=new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'));const h=await new Response(s).text();document.open();document.write(h);document.close()})().catch(e=>document.body.innerHTML='<p style="font-family:sans-serif;padding:2rem">Impossible de charger cette application.</p>')</script>
