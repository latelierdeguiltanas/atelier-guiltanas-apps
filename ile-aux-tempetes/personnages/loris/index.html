<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a0d08"><title>Loris</title></head><body style="margin:0;background:#120804;color:#f4eadb"><div id="load" style="font-family:system-ui;padding:30px;text-align:center">Chargement de Loris…</div><script src="p1.js"></script><script src="p2.js"></script><script>async function inflateIAT(){let s=((window.__IAT_P1||'')+(window.__IAT_P2||'')).replace(/\s/g,'');while(s.length%4)s+='=';const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);if(typeof DecompressionStream!=='undefined'){const ds=new DecompressionStream('gzip'),r=new Response(new Blob([b]).stream().pipeThrough(ds));return await r.text()}return await new Promise((ok,no)=>{const z=document.createElement('script');z.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';z.onload=()=>{try{ok(new TextDecoder().decode(pako.ungzip(b)))}catch(e){no(e)}};z.onerror=no;document.head.appendChild(z)})}(async()=>{try{const h=await inflateIAT();if(!h||!/^\s*<!doctype html/i.test(h))throw new Error('Contenu de fiche invalide');document.open();document.write(h);document.close()}catch(e){const l=document.getElementById('load');if(l)l.innerHTML='Impossible de charger la fiche.<br><small style="display:block;margin-top:8px;opacity:.75">'+String(e&&e.message?e.message:e)+'</small><button onclick="location.reload()" style="margin-top:16px;padding:12px 18px">Réessayer</button>'}})();</script></body></html>
