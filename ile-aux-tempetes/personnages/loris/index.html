<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1a0d08"><title>Loris</title></head><body style="margin:0;background:#120804;color:#f4eadb"><div id="load" style="font-family:system-ui;padding:30px;text-align:center">Chargement de Loris…</div><script src="p1.js"></script><script src="p2.js"></script><script src="p3.js"></script><script>async function inflateIAT(){let s=((window.__IAT_P1||'')+(window.__IAT_P2||'')+(window.__IAT_P3||'')).replace(/\s/g,'');const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('DecompressionStream indisponible');const ds=new DecompressionStream('gzip');return await new Response(new Blob([b]).stream().pipeThrough(ds)).text()}(async()=>{try{const h=await inflateIAT();document.open();document.write(h);document.close()}catch(e){const l=document.getElementById('load');if(l)l.innerHTML='Impossible de charger la fiche.<br><small>'+String(e.message||e)+'</small><br><button onclick="location.reload(true)" style="margin-top:16px;padding:12px 18px">Réessayer</button>'}})();</script></body></html>
