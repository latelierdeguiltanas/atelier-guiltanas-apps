<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hammerz</title></head><body><div id="load" style="font-family:system-ui;padding:30px">Chargement de Hammerz…</div><script src="p1.js"></script><script src="p2.js"></script><script>(async()=>{try{let s=atob((window.__IAT_P1||'')+(window.__IAT_P2||'')),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);let ds=new DecompressionStream('gzip'),r=new Response(new Blob([b]).stream().pipeThrough(ds)),h=await r.text();document.open();document.write(h);document.close()}catch(e){document.getElementById('load').textContent='Impossible de charger la fiche sur ce navigateur.'}})();</script></body></html>
