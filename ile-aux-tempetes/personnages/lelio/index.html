<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1710"><title>Lelio</title></head><body style="margin:0;background:#081109;color:#f0eadb"><div id="load" style="font-family:system-ui;padding:30px;text-align:center">Chargement de Lelio…</div><script src="p1.js"></script><script src="p2.js"></script><script>function b64bytes(s){s=(s||'').replace(/\s/g,'');const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);return b}async function inflateIAT(){const a=b64bytes(window.__IAT_P1),c=b64bytes(window.__IAT_P2),b=new Uint8Array(a.length+c.length);b.set(a,0);b.set(c,a.length);if(typeof DecompressionStream!=='undefined'){const ds=new DecompressionStream('gzip'),r=new Response(new Blob([b]).stream().pipeThrough(ds));return await r.text()}return await new Promise((ok,no)=>{const x=document.createElement('script');x.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';x.onload=()=>{try{ok(new TextDecoder().decode(pako.ungzip(b)))}catch(e){no(e)}};x.onerror=no;document.head.appendChild(x)})}(async()=>{try{const h=await inflateIAT();document.open();document.write(h);document.close()}catch(e){const l=document.getElementById('load');if(l)l.innerHTML='Impossible de charger la fiche.<br><button onclick="location.reload()" style="margin-top:16px;padding:12px 18px">Réessayer</button>'}})();</script></body></html>
