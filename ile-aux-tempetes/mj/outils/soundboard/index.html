</head><body style="margin:0;background:#100e0d;color:#f1e6d3"><div id="load" style="font-family:system-ui;padding:30px;text-align:center">Chargement du soundboard…</div><script src="p1.js"></script><script src="p2.js"></script><script src="p3.js"></script><script src="p4.js"></script><script>(async()=>{try{let s=((window.__IAT_P1||'')+(window.__IAT_P2||'')+(window.__IAT_P3||'')+(window.__IAT_P4||'')).replace(/\s/g,'');while(s.length%4)s+='=';const x=atob(s),b=new Uint8Array(x.length);for(let i=0;i<x.length;i++)b[i]=x.charCodeAt(i);let h;if(typeof DecompressionStream!=='undefined'){h=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}else{await new Promise((ok,no)=>{const z=document.createElement('script');z.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';z.onload=ok;z.onerror=no;document.head.appendChild(z)});h=new TextDecoder().decode(pako.ungzip(b))}h=h.replace('</body>','<script src="../../../assets/social-nav.js?v=1"></'+'script></body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('load').innerHTML='Impossible de charger le soundboard.<br><small>'+String(e&&e.message?e.message:e)+'</small>'}})();</script></body></html>
