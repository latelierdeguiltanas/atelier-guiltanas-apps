<script>
/* V4.8 — correctif réel : critique x2 + robustesse zombie fiable par ID */
(function(){
  function fighterById(id){ return fighters.findIndex(f => f && f.id === id); }
  function safeNum(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

  window.applyDamage = function(i,dmg,type,crit,why,autoRender=true){
    let f = fighters[i];
    if(!f) return {dmg:0,note:'cible introuvable',before:0,after:0,base:0};

    const raw = Math.max(0, safeNum(dmg));
    const finalBase = crit ? raw * 2 : raw;
    let adj = adjustedDamage(f, finalBase, type || 'tranchant');
    let before = safeNum(f.pv);
    let after = Math.max(0, before - adj.dmg);
    f.pv = after;

    let notes = [];
    if(crit) notes.push(`critique ${raw} ×2 = ${finalBase}`);
    if(adj.note) notes.push(adj.note);
    const note = notes.join(' ; ');

    logEvent(`${f.name} subit ${adj.dmg} ${type}${note?' ('+note+')':''} — ${why} — PV ${before} → ${after}`);

    const isZombie = f.ref === 'zombie';
    if(isZombie && before > 0 && after <= 0){
      const radiant = String(type||'').toLowerCase() === 'radiant';
      if(radiant || crit){
        f.pending = null;
        logEvent(`${f.name} : Robustesse ignorée (${radiant ? 'dégâts radiants' : 'coup critique'})`);
      }else{
        f.pending = {type:'undeadFortitude', dc:5 + adj.dmg, damage:adj.dmg, targetId:f.id};
        logEvent(`${f.name} déclenche Robustesse de la non-vie : JS CON DD ${5 + adj.dmg}`);
      }
    }

    saveAll();
    if(autoRender) renderFighters();
    return {dmg:adj.dmg,note,before,after:f.pv,base:finalBase,raw,crit:!!crit};
  };

  window.pendingHTML = function(f,i){
    if(f.pending && f.pending.type === 'undeadFortitude'){
      const fid = String(f.id).replace(/'/g,"\\'");
      return `<div class="warnbox"><h4>Robustesse de la non-vie</h4><p>Le zombie est à 0 PV, mais peut rester debout. DD Constitution : <b>${f.pending.dc}</b>. Bonus CON du zombie : <b>+3</b>. Entre le résultat total du jet.</p><div class="row"><input id="uf_${f.id}" type="number" placeholder="Résultat JS CON total"><button class="good" onclick="resolveUndeadById('${fid}')">Résoudre</button><button onclick="cancelPendingById('${fid}')">Ignorer</button></div></div>`;
    }
    return '';
  };

  window.resolveUndeadById = function(id){
    const i = fighterById(id);
    if(i < 0){ alert('Zombie introuvable.'); return; }
    const f = fighters[i];
    if(!f.pending || f.pending.type !== 'undeadFortitude'){
      alert('Aucune Robustesse à résoudre pour ce zombie.');
      return;
    }
    const input = document.getElementById('uf_' + f.id);
    const v = safeNum(input && input.value);
    if(!input || input.value === ''){ alert('Entre le résultat total du jet de Constitution.'); return; }
    if(v >= f.pending.dc){
      f.pv = 1;
      logEvent(`${f.name} réussit Robustesse (${v} ≥ ${f.pending.dc}) : revient à 1 PV`);
      setLastResult('hit','🧟 Robustesse réussie',`${f.name} réussit son JS CON ${v} ≥ DD ${f.pending.dc} : il reste à 1 PV.`);
    }else{
      f.pv = 0;
      logEvent(`${f.name} rate Robustesse (${v} < ${f.pending.dc}) : reste à 0 PV`);
      setLastResult('miss','☠️ Robustesse ratée',`${f.name} rate son JS CON ${v} < DD ${f.pending.dc} : il tombe définitivement.`);
    }
    f.pending = null;
    saveAll();
    renderFighters();
  };

  window.cancelPendingById = function(id){
    const i = fighterById(id);
    if(i >= 0){ fighters[i].pending = null; saveAll(); renderFighters(); }
  };

  // Compatibilité avec les anciens boutons éventuels encore présents dans une vue déjà chargée.
  window.resolveUndead = function(i){
    const f = fighters[i];
    if(!f) return;
    resolveUndeadById(f.id);
  };
  window.cancelPending = function(i){
    const f = fighters[i];
    if(!f) return;
    cancelPendingById(f.id);
  };
})();
</script>

<script>
/* V4.9 — automatisations pouvoirs de monstres */
(function(){
  function idxById(id){ return fighters.findIndex(f=>f && f.id===id); }
  function n(v){ const x=Number(v); return Number.isFinite(x)?x:0; }
  function escId(id){ return String(id||'').replace(/'/g,"\\'"); }
  function ensureAuto(f){ f.auto=f.auto||{}; return f.auto; }
  function addCondById(id,c){ const i=idxById(id); if(i<0)return false; fighters[i].conditions=fighters[i].conditions||[]; if(!fighters[i].conditions.includes(c))fighters[i].conditions.push(c); return true; }
  function remCondById(id,c){ const i=idxById(id); if(i<0)return false; fighters[i].conditions=(fighters[i].conditions||[]).filter(x=>x!==c); return true; }
  function livingPJs(){ return fighters.filter(f=>f.kind==='pj'); }
  function livingTargets(){ return fighters.filter(f=>f.pv>0); }
  function optsPJs(){ return livingPJs().map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join(''); }
  function pjRows(prefix, saveLabel='JS total'){
    return livingPJs().map(f=>`<div class="targetSelectRow"><label><b>${esc(f.name)}</b><input id="${prefix}_${f.id}" type="number" placeholder="${saveLabel}"></label><span class="pill">PJ</span></div>`).join('') || '<p class="mini">Aucun PJ trouvé.</p>';
  }
  function roll(d){ return Math.floor(Math.random()*d)+1; }
  function info(title,detail){ setLastResult('info',title,detail); logEvent(`${title} — ${detail}`); saveAll(); renderFighters(); }

  window.monsterAutomationButtons = function(f,i){
    if(!f || !f.ref) return '';
    let b=[];
    if(f.ref==='zombie') b.push(`<button onclick="modal('Robustesse zombie','<div class=\'dm\'>Automatique : quand le zombie tombe à 0 PV sans radiant ni critique, une carte Robustesse apparaît avec DD = 5 + dégâts reçus.</div>')">🧟 Robustesse auto</button>`);
    if(f.ref==='harpie') b.push(`<button onclick="autoHarpieChant(${i})">🎵 Chant captivant — JS SAG</button>`, `<button onclick="autoStopHarpie(${i})">⏹ Stop chant</button>`);
    if(f.ref==='goule') b.push(`<button onclick="autoGouleParalysie(${i})">☠️ Griffes — JS CON paralysie</button>`);
    if(f.ref==='strige') {
      const linked=getStrigeAttachedTarget(f);
      if(linked.target) {
        b.push(`<button onclick="autoStrigeDrain(${i})">🩸 Drain</button>`, `<button onclick="autoStrigeDetach(${i})">✋ Détacher</button>`);
      } else {
        b.push(`<button onclick="autoStrigeAttach(${i})">🩸 Drain de sang</button>`);
      }
    }
    if(f.ref==='pieuvre-spores') b.push(`<button onclick="autoPieuvreGrapple(${i})">🐙 Tentacules — agrippé/entravé</button>`, `<button onclick="autoPieuvreRelease(${i})">✋ Relâcher étreinte</button>`);
    if(f.ref==='myconide-adulte') b.push(`<button onclick="autoMyconidePacify(${i})">🍄 Spores pacificatrices — JS CON</button>`, `<button onclick="autoMyconideCom(${i})">🍄 Spores de communication</button>`);
    if(f.ref==='pousse-myconide') b.push(`<button onclick="autoMyconideCom(${i})">🍄 Spores de communication</button>`, `<button onclick="autoSunWeakness(${i})">☀️ Soleil gênant</button>`);
    if(f.ref==='sinensa') b.push(`<button onclick="autoSinensaHallucination(${i})">🍄 Spores hallucinogènes</button>`, `<button onclick="autoSunWeakness(${i})">☀️ Soleil gênant</button>`);
    if(f.ref==='serpent-feu') b.push(`<button onclick="autoSerpentBurn(${i})">🔥 Corps brûlant — 1d6 feu</button>`, `<button onclick="autoSerpentCold(${i})">❄️ Vulnérabilité froid rappel</button>`);
    if(f.ref==='dragonnet-bleu') b.push(`<button onclick="autoRechargeBreath(${i})">⚡ Recharge souffle 5–6</button>`, `<button onclick="autoLightningBreath(${i},22,'ligne 9 m')">⚡ Souffle foudre — JS DEX DD12</button>`);
    if(f.ref==='dragonnet-bronze') b.push(`<button onclick="autoRechargeBreath(${i})">⚡ Recharge souffle 5–6</button>`, `<button onclick="autoLightningBreath(${i},16,'ligne 12 m')">⚡ Souffle foudre — JS DEX DD12</button>`, `<button onclick="autoRepulsionBreath(${i})">💨 Souffle répulsif — JS FOR DD12</button>`);
    if(f.ref==='runara-dragon') b.push(`<button onclick="autoRechargeBreath(${i})">⚡ Recharge souffle 5–6</button>`, `<button onclick="autoLegendaryResistance(${i})">🛡️ Résistance légendaire</button>`);
    if(f.ref==='kobold' || f.ref==='kobold-ailé' || f.ref==='bricoleur-kobold') b.push(`<button onclick="autoKoboldPack(${i})">🦎 Tactique de meute</button>`, `<button onclick="autoSunWeakness(${i})">☀️ Sensibilité soleil</button>`);
    if(f.ref==='thallophyte-violette') b.push(`<button onclick="autoThallophyteMulti(${i})">☠️ Attaques multiples 1d4</button>`, `<button onclick="autoFalseAppearance(${i})">🍄 Faux-semblant</button>`);
    if(f.ref==='hibours') b.push(`<button onclick="autoKeenSenses(${i})">👃 Odorat / vue aiguisés</button>`);
    if(f.ref==='tarak-stat') b.push(`<button onclick="autoTarakCunning(${i})">🧪 Ruse — bonus action</button>`);
    return b.length ? `<div class="row">${b.join('')}</div>` : '';
  };

  window.autoHarpieChant = function(i){
    const f=fighters[i]; if(!f)return; ensureAuto(f).chant=true; saveAll();
    modal('🎵 Chant captivant — Harpie', `<div class="dm">Chaque PJ qui entend le chant : <b>JS Sagesse DD 11</b>. Échec : état <b>charmé</b> et rappel neutralisé / avance vers la harpie.</div>${pjRows('harpieSave','JS SAG total')}<button class="good" onclick="resolveHarpieChant(${i})">Résoudre les sauvegardes</button>`);
  };
  window.resolveHarpieChant = function(i){
    const f=fighters[i]; if(!f)return; const dc=11; let out=[];
    livingPJs().forEach(p=>{ const el=document.getElementById('harpieSave_'+p.id); if(!el || el.value==='')return; const v=n(el.value); if(v<dc){ addCondById(p.id,'charmé'); out.push(`${p.name} échoue (${v}<${dc}) : charmé`); } else { remCondById(p.id,'charmé'); out.push(`${p.name} réussit (${v}≥${dc})`); }});
    logEvent(`${f.name} — Chant captivant : ${out.join(' ; ')||'aucun JS saisi'}`); setLastResult('info','🎵 Chant résolu',out.join(' · ')||'Aucun JS saisi.'); closeModal(); saveAll(); renderFighters();
  };
  window.autoStopHarpie = function(i){ const f=fighters[i]; if(!f)return; ensureAuto(f).chant=false; info('⏹ Chant arrêté',`${f.name} cesse le chant. Les PJ charmés peuvent être retirés manuellement si l’effet prend fin.`); };

  window.autoGouleParalysie = function(i){
    const f=fighters[i]; if(!f)return; modal('☠️ Griffes de goule', `<div class="combat">Après une touche des griffes : la cible fait un <b>JS Constitution DD 10</b>. Échec : <b>paralysé 1 minute</b>, nouveau JS à la fin de ses tours.</div><div class="targetSelectRow"><select id="gouleTarget">${optsPJs()}</select><input id="gouleSave" type="number" placeholder="JS CON total"></div><button class="good" onclick="resolveGouleParalysie(${i})">Résoudre</button>`);
  };
  window.resolveGouleParalysie = function(i){ const id=document.getElementById('gouleTarget')?.value; const v=n(document.getElementById('gouleSave')?.value); const t=fighters[idxById(id)]; if(!t)return; if(v<10){addCondById(id,'paralysé'); info('☠️ Paralysie',`${t.name} rate le JS CON ${v}<10 : paralysé.`);} else {remCondById(id,'paralysé'); info('☠️ Résistance',`${t.name} réussit le JS CON ${v}≥10 : pas paralysé.`);} closeModal(); };

  window.autoMyconidePacify = function(i){ const f=fighters[i]; if(!f)return; modal('🍄 Spores pacificatrices', `<div class="dm">Une créature à 1,50 m : <b>JS Constitution DD 11</b>. Échec : <b>étourdi</b> 1 minute, nouveau JS à la fin de ses tours.</div><div class="targetSelectRow"><select id="mycoTarget">${livingTargets().filter(x=>x.id!==f.id).map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select><input id="mycoSave" type="number" placeholder="JS CON total"></div><button class="good" onclick="resolveMyconidePacify(${i})">Résoudre</button>`); };
  window.resolveMyconidePacify = function(i){ const id=document.getElementById('mycoTarget')?.value; const v=n(document.getElementById('mycoSave')?.value); const t=fighters[idxById(id)]; if(!t)return; if(v<11){addCondById(id,'étourdi'); info('🍄 Spores pacificatrices',`${t.name} rate ${v}<11 : étourdi.`);} else {remCondById(id,'étourdi'); info('🍄 Spores pacificatrices',`${t.name} réussit ${v}≥11 : pas d’effet.`);} closeModal(); };
  window.autoMyconideCom = function(i){ const f=fighters[i]; info('🍄 Spores de communication',`${f.name} active la télépathie de zone pendant 1 heure. Aucun calcul nécessaire.`); };
  window.autoSinensaHallucination = function(i){ const f=fighters[i]; info('🍄 Spores hallucinogènes',`${f.name} déclenche les hallucinations : applique l’effet narratif de confusion/couleurs. Automatisation légère volontaire.`); };

  window.autoStrigeAttach = function(i){
    const f=fighters[i]; if(!f)return;
    const options = optsPJs();
    if(!options){
      modal('🩸 Strige — aucune cible', `<div class="warnbox">Aucun PJ trouvé dans le combat. Ajoute ou recrée les 4 PJ avant d’utiliser la Strige.</div>`);
      return;
    }
    modal('🩸 Strige — attaque Drain de sang', `
      <div class="combat">
        Choisis le PJ ciblé, puis renseigne le <b>d20 brut</b>. L’application ajoute <b>+5</b> et compare à la CA du PJ. Si l’attaque touche : <b>1d4+3 dégâts perforants immédiats</b>, puis fixation automatique.
      </div>
      <label>Cible PJ</label>
      <select id="strigeTarget">${options}</select>
      <label>Résultat brut du d20</label>
      <input id="strigeAutoD20" type="number" min="1" max="20" placeholder="Ex : 12">
      <button class="good" onclick="resolveStrigeAttach(${i})">Calculer attaque</button>
    `);
  };
  window.resolveStrigeAttach = function(i){
    const f=fighters[i];
    const id=document.getElementById('strigeTarget')?.value;
    const t=fighters[idxById(id)];
    const d20=Number(document.getElementById('strigeAutoD20')?.value);
    if(!f || !t){
      modal('🩸 Strige — cible manquante', `<div class="warnbox">Choisis un PJ cible avant de valider.</div><button class="good" onclick="autoStrigeAttach(${i})">Choisir une cible</button>`);
      return;
    }
    if(Number.isNaN(d20)||d20<1||d20>20){ alert('Entre un résultat de d20 entre 1 et 20.'); return; }
    const total=d20+5, ca=Number(t.ca)||10;
    if(total<ca){
      const msg=`${f.name} rate ${t.name} : d20 ${d20} + 5 = ${total} contre CA ${ca}. Aucun dégât et aucune fixation.`;
      logEvent(`🩸 ${msg}`); setLastResult('miss','🩸 Drain raté',msg);
      modal('🩸 Drain de sang — RATÉ', `<div class="combat"><b>ATTAQUE RATÉE</b></div><div class="warnbox">${esc(f.name)} obtient <b>${d20}+5=${total}</b> contre la CA <b>${ca}</b> de ${esc(t.name)}.<br><b>0 dégât — la Strige ne se fixe pas.</b></div><button class="good" onclick="closeModal()">OK</button>`);
      return;
    }
    modal('🩸 Drain touche — dégâts initiaux', `
      <div class="goodbox"><b>TOUCHÉ.</b> ${esc(f.name)} touche ${esc(t.name)} : ${d20}+5=<b>${total}</b> contre CA ${ca}.</div>
      <label>Résultat du d4 pour les dégâts initiaux 1d4+3</label>
      <input id="strigeAutoD4" type="number" min="1" max="4" placeholder="Ex : 3">
      <button class="good" onclick="finishAutoStrigeAttach(${i},'${esc(id)}',${d20},${total},${ca})">Calculer dégâts + fixer</button>
    `);
  };
  window.finishAutoStrigeAttach = function(i,id,d20,total,ca){
    const f=fighters[i], t=fighters[idxById(id)]; if(!f||!t)return;
    const d4=Number(document.getElementById('strigeAutoD4')?.value);
    if(Number.isNaN(d4)||d4<1||d4>4){ alert('Entre un d4 entre 1 et 4.'); return; }
    const dmg=d4+3;
    ensureAuto(f).attachedTo=id;
    ensureAuto(f).drained=dmg;
    f.attachedTo=id;
    f.drained=dmg;
    f.conditions=f.conditions||[]; if(!f.conditions.includes('fixée'))f.conditions.push('fixée');
    addCondById(id,'saigne');
    const msg=`${f.name} touche ${t.name} : d20 ${d20}+5=${total} contre CA ${ca}. ${t.name} subit ${dmg} dégâts perforants (${d4}+3) et la Strige se fixe. Total drainé : ${dmg}/10.`;
    logEvent(`🩸 ${msg}`); setLastResult('hit','🩸 Strige fixée',msg); saveAll(); renderFighters();
    modal('🩸 Drain de sang — TOUCHÉ', `<div class="goodbox"><b>ATTAQUE RÉUSSIE</b><br>${esc(f.name)} : <b>${d20}+5=${total}</b> contre CA <b>${ca}</b>.</div><div class="combat"><b>${esc(t.name)} subit ${dmg} dégâts perforants</b> (${d4}+3).<br>La Strige est maintenant <b>fixée</b>.<br>Total drainé : <b>${dmg}/10</b>.</div><button class="good" onclick="closeModal()">OK</button>`);
  };
  window.autoStrigeDrain = function(i){
    const f=fighters[i]; if(!f)return;
    const a=ensureAuto(f);
    if(a.attachedTo && !f.attachedTo) f.attachedTo=a.attachedTo;
    if(a.drained && !f.drained) f.drained=a.drained;
    const linked=getStrigeAttachedTarget(f);
    if(!linked.target){
      modal('🩸 Strige — aucune cible fixée', `<div class="warnbox">Cette Strige n’est fixée à aucun PJ. Il faut d’abord utiliser <b>Se fixer à une cible</b> après une attaque réussie.</div><button class="good" onclick="autoStrigeAttach(${i})">Choisir la cible maintenant</button>`);
      return;
    }
    openStrigeDrainPopup(i, linked.index, true);
  };
  window.autoStrigeDetach = function(i){ const f=fighters[i]; if(!f)return; detachStrigeFromTarget(i,false,false); info('✋ Strige détachée',`${f.name} n’est plus fixée.`); closeModal(); };

  window.autoPieuvreGrapple = function(i){ const f=fighters[i]; if(!f)return; modal('🐙 Tentacules de pieuvre', `<div class="combat">Sur touche : la cible est <b>agrippée</b> et <b>entravée</b>. La pieuvre ne peut pas utiliser ses tentacules sur une autre cible tant que l’étreinte dure.</div><div class="targetSelectRow"><select id="pieuvreTarget">${optsPJs()}</select><button class="good" onclick="resolvePieuvreGrapple(${i})">Appliquer</button></div>`); };
  window.resolvePieuvreGrapple = function(i){ const f=fighters[i], id=document.getElementById('pieuvreTarget')?.value, t=fighters[idxById(id)]; if(!f||!t)return; ensureAuto(f).grappling=id; addCondById(id,'agrippé'); addCondById(id,'entravé'); info('🐙 Étreinte',`${t.name} est agrippé et entravé par ${f.name}.`); closeModal(); };
  window.autoPieuvreRelease = function(i){ const f=fighters[i]; if(!f)return; const a=ensureAuto(f), t=fighters[idxById(a.grappling)]; if(t){remCondById(t.id,'agrippé'); remCondById(t.id,'entravé');} a.grappling=null; info('✋ Étreinte relâchée',`${f.name} libère sa cible.`); };

  window.autoSerpentBurn = function(i){ const f=fighters[i]; const dmg=roll(6); info('🔥 Corps brûlant',`${f.name} inflige ${dmg} dégâts de feu à la créature qui le touche au corps à corps. Les joueurs retirent les PV.`); };
  window.autoSerpentCold = function(i){ const f=fighters[i]; info('❄️ Vulnérabilité froid',`${f.name} subit automatiquement ×2 aux dégâts de froid quand tu appliques un dégât de type froid.`); };

  window.autoRechargeBreath = function(i){ const f=fighters[i]; if(!f)return; const r=roll(6); ensureAuto(f).breathReady = r>=5; info('⚡ Recharge souffle',`${f.name} lance d6=${r} : ${r>=5?'souffle disponible':'souffle non rechargé'}.`); };
  window.autoLightningBreath = function(i,base,label){ const f=fighters[i]; if(!f)return; modal('⚡ Souffle de foudre', `<div class="combat"><b>${esc(f.name)}</b> — ${label}. JS Dextérité DD 12. Échec : ${base} dégâts foudre ; réussite : ${Math.floor(base/2)}. Les joueurs gèrent leurs PV.</div>${pjRows('breathSave','JS DEX total')}<button class="good" onclick="resolveLightningBreath(${i},${base})">Résoudre</button>`); };
  window.resolveLightningBreath = function(i,base){ const f=fighters[i]; if(!f)return; let out=[]; livingPJs().forEach(p=>{ const el=document.getElementById('breathSave_'+p.id); if(!el||el.value==='')return; const v=n(el.value), dmg=v>=12?Math.floor(base/2):base; out.push(`${p.name} ${v>=12?'réussit':'rate'} (${v}) : ${dmg} foudre`); }); ensureAuto(f).breathReady=false; logEvent(`${f.name} souffle foudre : ${out.join(' ; ')||'aucun JS saisi'}`); setLastResult('info','⚡ Souffle résolu',out.join(' · ')||'Aucun JS saisi.'); closeModal(); saveAll(); renderFighters(); };
  window.autoRepulsionBreath = function(i){ const f=fighters[i]; if(!f)return; modal('💨 Souffle répulsif', `<div class="combat">Cône de 9 m : <b>JS Force DD 12</b>. Échec : repoussé de 9 m.</div>${pjRows('repulseSave','JS FOR total')}<button class="good" onclick="resolveRepulsionBreath(${i})">Résoudre</button>`); };
  window.resolveRepulsionBreath = function(i){ const f=fighters[i]; if(!f)return; let out=[]; livingPJs().forEach(p=>{ const el=document.getElementById('repulseSave_'+p.id); if(!el||el.value==='')return; const v=n(el.value); out.push(`${p.name} ${v>=12?'résiste':'échoue : repoussé 9 m'}`); }); info('💨 Souffle répulsif',out.join(' · ')||'Aucun JS saisi.'); closeModal(); };
  window.autoLegendaryResistance = function(i){ const f=fighters[i]; const a=ensureAuto(f); if(a.legendaryLeft===undefined)a.legendaryLeft=3; if(a.legendaryLeft>0)a.legendaryLeft--; info('🛡️ Résistance légendaire',`${f.name} choisit de réussir un JS raté. Utilisations restantes : ${a.legendaryLeft}/3.`); };

  window.autoKoboldPack = function(i){ const f=fighters[i]; info('🦎 Tactique de meute',`${f.name} a avantage si un allié est à 1,50 m de la cible et non neutralisé.`); };
  window.autoSunWeakness = function(i){ const f=fighters[i]; info('☀️ Soleil gênant',`${f.name} a désavantage aux attaques / Perception visuelle exposées au soleil. Pour les myconides : trop de soleil peut les tuer.`); };
  window.autoThallophyteMulti = function(i){ const f=fighters[i]; const r=roll(4); info('☠️ Attaques multiples',`${f.name} effectue ${r} attaque(s) de Contact putréfiant ce tour.`); };
  window.autoFalseAppearance = function(i){ const f=fighters[i]; info('🍄 Faux-semblant',`${f.name} immobile : avantage initiative ; pour l’identifier comme créature, test Intelligence (Nature) DD 18.`); };
  window.autoKeenSenses = function(i){ const f=fighters[i]; info('👃 Sens aiguisés',`${f.name} a avantage aux tests de Perception basés sur l’odorat / la vue selon la situation.`); };
  window.autoTarakCunning = function(i){ const f=fighters[i]; info('🧪 Ruse',`${f.name} peut Foncer, Se cacher ou Se désengager en action bonus.`); };

  // Ajout visuel discret dans les fiches de monstres en combat : les boutons ci-dessus sont injectés via monsterAutomationButtons.
  if(typeof renderFighters === 'function') renderFighters();
})();
</script>


<script>
/* V5.1 — Robustesse de la non-vie : popup immédiate avec saisie du jet MJ */
(function(){
  function idxById(id){ return fighters.findIndex(f => f && f.id === id); }
  function cleanId(id){ return String(id || '').replace(/'/g,"\\'"); }
  function num(v){ const n = Number(v); return Number.isFinite(n) ? n : 0; }

  window.openUndeadFortitudeModal = function(id){
    const i = idxById(id);
    if(i < 0) return;
    const f = fighters[i];
    if(!f || !f.pending || f.pending.type !== 'undeadFortitude') return;
    const dc = f.pending.dc;
    const dmg = f.pending.damage || Math.max(0, dc - 5);
    modal('🧟 Robustesse de la non-vie', `
      <div class="warnbox">
        <h3>${esc(f.name)} tombe à 0 PV</h3>
        <p><b>Jet à faire maintenant :</b> 1d20 + 3 Constitution</p>
        <p>Dégâts reçus : <b>${dmg}</b><br>DD : <b>5 + dégâts = ${dc}</b></p>
      </div>
      <div class="card">
        <label>Résultat total du JS Constitution du zombie</label>
        <input id="uf_modal_${f.id}" type="number" placeholder="Ex : 17 si tu as fait 14 au dé +3" autofocus>
        <div class="row">
          <button class="good" onclick="resolveUndeadModal('${cleanId(f.id)}')">Valider la Robustesse</button>
          <button class="danger" onclick="failUndeadModal('${cleanId(f.id)}')">Le laisser mort</button>
        </div>
        <p class="mini">Réussite : résultat ≥ ${dc} → le zombie revient automatiquement à 1 PV. Échec : il reste à 0 PV.</p>
      </div>
    `);
    setTimeout(()=>document.getElementById('uf_modal_'+f.id)?.focus(),80);
  };

  window.resolveUndeadModal = function(id){
    const i = idxById(id);
    if(i < 0){ alert('Zombie introuvable.'); return; }
    const f = fighters[i];
    if(!f.pending || f.pending.type !== 'undeadFortitude'){
      alert('Aucune Robustesse à résoudre pour ce zombie.');
      return;
    }
    const el = document.getElementById('uf_modal_' + f.id) || document.getElementById('uf_' + f.id);
    if(!el || el.value === ''){
      alert('Entre le résultat total du jet de Constitution du zombie.');
      return;
    }
    const v = num(el.value);
    const dc = f.pending.dc;
    if(v >= dc){
      f.pv = 1;
      logEvent(`${f.name} réussit Robustesse (${v} ≥ ${dc}) : revient à 1 PV`);
      setLastResult('hit','🧟 Robustesse réussie',`${f.name} réussit son JS CON ${v} ≥ DD ${dc} : il revient à 1 PV.`);
    }else{
      f.pv = 0;
      logEvent(`${f.name} rate Robustesse (${v} < ${dc}) : reste à 0 PV`);
      setLastResult('miss','☠️ Robustesse ratée',`${f.name} rate son JS CON ${v} < DD ${dc} : il reste mort.`);
    }
    f.pending = null;
    saveAll();
    closeModal();
    renderFighters();
  };

  window.failUndeadModal = function(id){
    const i = idxById(id);
    if(i >= 0){
      const f = fighters[i];
      f.pv = 0;
      f.pending = null;
      logEvent(`${f.name} : Robustesse ignorée manuellement → reste à 0 PV`);
      setLastResult('miss','☠️ Zombie détruit',`${f.name} reste à 0 PV.`);
      saveAll();
    }
    closeModal();
    renderFighters();
  };

  // Remplace aussi la carte intégrée : elle ouvre la même logique propre que la popup.
  window.pendingHTML = function(f,i){
    if(f && f.pending && f.pending.type === 'undeadFortitude'){
      const fid = cleanId(f.id);
      return `<div class="warnbox"><h4>🧟 Robustesse à résoudre</h4><p>DD CON : <b>${f.pending.dc}</b>. Lance <b>1d20 + 3</b>, puis clique ci-dessous.</p><button class="good" onclick="openUndeadFortitudeModal('${fid}')">Ouvrir le jet de Robustesse</button></div>`;
    }
    return '';
  };

  const previousApplyDamage = window.applyDamage;
  window.applyDamage = function(i,dmg,type,crit,why,autoRender=true){
    const result = previousApplyDamage(i,dmg,type,crit,why,autoRender);
    const f = fighters[i];
    if(f && f.pending && f.pending.type === 'undeadFortitude'){
      const id = f.id;
      setTimeout(()=>openUndeadFortitudeModal(id),120);
    }
    return result;
  };
})();
</script>




<script>
/* V8 — MODULE STRIGE AUTONOME ET PRIORITAIRE */
(function(){
  const state={strigeId:null,targetId:null};
  const byId=id=>fighters.findIndex(f=>f&&f.id===id);
  const attached=f=>{
    const id=f?.attachedTo||f?.auto?.attachedTo||null;
    const index=id?byId(id):-1;
    return {id,index,target:index>=0?fighters[index]:null};
  };
  const drainTotal=f=>Number(f?.drained ?? f?.auto?.drained ?? 0)||0;
  const sync=(f,targetId,total)=>{
    f.auto=f.auto||{};
    f.attachedTo=targetId||null;
    f.auto.attachedTo=targetId||null;
    f.drained=Number(total)||0;
    f.auto.drained=Number(total)||0;
    f.conditions=f.conditions||[];
    if(targetId && !f.conditions.includes('fixée'))f.conditions.push('fixée');
    if(!targetId)f.conditions=f.conditions.filter(c=>c!=='fixée');
  };
  const detach=(f,preserve=false)=>{
    const a=attached(f);
    if(a.target) a.target.conditions=(a.target.conditions||[]).filter(c=>c!=='saigne');
    sync(f,null,preserve?drainTotal(f):0);
    saveAll(); renderFighters();
  };
  window.strigeDetachV8=function(strigeId){
    const i=byId(strigeId); if(i<0)return;
    const f=fighters[i]; detach(f,false);
    logEvent(`✋ ${f.name} se détache.`);
    setLastResult('info','✋ Strige détachée',`${f.name} n’est plus fixée.`);
    closeModal();
  };
  window.strigeOpenDrainV8=function(strigeId){
    const i=byId(strigeId); if(i<0)return;
    const s=fighters[i], a=attached(s);
    if(!a.target){
      modal('🩸 Strige — aucune cible fixée',`<div class="warnbox">${esc(s.name)} n’est fixée à aucune cible.</div><button class="good" onclick="autoStrigeAttach(${i})">Lancer Drain de sang</button>`);
      return;
    }
    const total=drainTotal(s);
    if(total>=10){
      detach(s,true);
      modal('🩸 Strige repue',`<div class="goodbox"><b>${esc(s.name)}</b> a déjà drainé <b>${total}/10 PV</b> et se détache.</div><button class="good" onclick="closeModal()">OK</button>`);
      return;
    }
    state.strigeId=s.id; state.targetId=a.target.id;
    modal('🩸 Strige — drain de début de tour',`
      <div class="combat"><b>${esc(s.name)}</b> est fixée sur <b>${esc(a.target.name)}</b>.<br>Entre seulement le résultat du <b>d4</b>. Le bonus <b>+3</b> est automatique.</div>
      <div class="goodbox">Total drainé : <b>${total}/10</b></div>
      <input id="strigeV8D4" type="number" inputmode="numeric" min="1" max="4" placeholder="1 à 4" autofocus>
      <div class="row"><button class="good" onclick="strigeApplyDrainV8()">Appliquer le drain</button><button class="danger" onclick="strigeDetachV8('${s.id}')">Détacher</button></div>`);
    setTimeout(()=>document.getElementById('strigeV8D4')?.focus(),50);
  };
  window.strigeApplyDrainV8=function(){
    const i=byId(state.strigeId), pi=byId(state.targetId);
    if(i<0||pi<0){alert('La Strige ou sa cible n’est plus dans le combat.');return;}
    const input=document.getElementById('strigeV8D4');
    const d4=Number(input?.value);
    if(!Number.isInteger(d4)||d4<1||d4>4){alert('Entre 1, 2, 3 ou 4.');input?.focus();return;}
    const s=fighters[i], p=fighters[pi], dmg=d4+3, total=drainTotal(s)+dmg, repue=total>=10;
    sync(s,p.id,total);
    if(repue)detach(s,true); else {saveAll();renderFighters();}
    const msg=`${s.name} draine ${dmg} PV à ${p.name} (${d4}+3). Total drainé : ${total}/10.${repue?' La Strige se détache.':''}`;
    logEvent(`🩸 ${msg}`); setLastResult('hit','🩸 Drain de sang',msg); saveAll();
    modal('🩸 Drain de sang — résultat',`<div class="combat"><b>${esc(p.name)} subit ${dmg} dégâts perforants.</b></div><div class="goodbox">Calcul : <b>${d4}+3=${dmg}</b><br>Total drainé : <b>${total}/10</b><br>${repue?'<b>La Strige est repue et se détache automatiquement.</b>':'La Strige reste fixée.'}</div><button class="good" onclick="closeModal()">OK</button>`);
  };
  window.strigeStartTurnV8=function(index){
    const f=fighters[index];
    if(f?.ref==='strige' && attached(f).target) setTimeout(()=>window.strigeOpenDrainV8(f.id),0);
  };
  window.handleStartOfTurnEffects=function(index){ window.strigeStartTurnV8(index); };
  window.openStrigeDrainPopup=function(i){ const f=fighters[i]; if(f)window.strigeOpenDrainV8(f.id); };
  window.autoStrigeDrain=function(i){ const f=fighters[i]; if(f)window.strigeOpenDrainV8(f.id); };
  window.autoStrigeDetach=function(i){ const f=fighters[i]; if(f)window.strigeDetachV8(f.id); };
  const previousNext=window.nextTurn;
  window.nextTurn=function(){
    if(!fighters.length)return;
    turn=(turn+1)%fighters.length;
    saveAll(); renderFighters();
    setTimeout(()=>document.querySelector('.initChip.active')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'}),0);
    logEvent(`Tour : ${fighters[turn].name}`);
    window.strigeStartTurnV8(turn);
  };
})();
</script>


<script>
/* V10 — MYCONIDES COMPLETS : Pousse, Adulte et Sinensa */
(function(){
  const MYCO_REFS=new Set(['pousse-myconide','myconide-adulte','sinensa']);
  const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const byId=id=>fighters.findIndex(f=>f&&f.id===id);
  const living=sourceId=>fighters.filter(f=>f&&f.pv>0&&f.id!==sourceId);
  const sync=()=>{saveAll();renderFighters();};
  const profile=ref=>({
    'pousse-myconide':{label:'Pousse de myconide',atk:1,blDice:1,blBonus:-1,poDice:1,comUses:3,comRadius:'3 m'},
    'myconide-adulte':{label:'Myconide adulte',atk:2,blDice:2,blBonus:0,poDice:2,comUses:3,comRadius:'6 m',pacify:true},
    'sinensa':{label:'Sinensa',atk:3,blDice:3,blBonus:1,poDice:2,comUses:null,comRadius:'9 m',hallucinate:true}
  }[ref]||null);

  if(!conds.some(c=>c[0]==='neutralisé')) conds.push(['neutralisé','Ne peut entreprendre ni action ni réaction.']);

  function ensureAuto(f){f.auto=f.auto||{};f.auto.myco=f.auto.myco||{};return f.auto.myco;}
  function usesLeft(f,key,max){const a=ensureAuto(f);if(a[key]===undefined)a[key]=max;return a[key];}
  function consume(f,key,max){const a=ensureAuto(f);const left=usesLeft(f,key,max);if(left<=0)return false;a[key]=left-1;return true;}
  function addCond(f,c){f.conditions=f.conditions||[];if(!f.conditions.includes(c))f.conditions.push(c);}
  function removeCond(f,c){f.conditions=(f.conditions||[]).filter(x=>x!==c);}
  function clearSporeEffect(target,reason){
    const e=target?.auto?.mycoEffect;if(!e)return;
    (e.conditions||[]).forEach(c=>removeCond(target,c));
    delete target.auto.mycoEffect;
    if(reason)logEvent(`🍄 ${target.name} : ${reason}`);
  }
  function alertDistress(f){
    if(!f||!MYCO_REFS.has(f.ref))return;
    logEvent(`🍄 Spores de détresse : tous les autres myconides dans un rayon de 72 m perçoivent la douleur de ${f.name}.`);
    setLastResult('info','🍄 Spores de détresse',`Les autres myconides proches perçoivent immédiatement la douleur de ${f.name}.`);
  }
  function targetOptions(sourceId){return living(sourceId).map(t=>`<option value="${safe(t.id)}">${safe(t.name)} — CA ${t.ca} — PV ${t.pv}/${t.max}</option>`).join('');}
  function dieFields(prefix,count,label){let s=`<div class="subcard"><b>${label}</b><div class="fieldmini">`;for(let i=0;i<count;i++)s+=`<input id="${prefix}${i}" type="number" min="1" max="4" inputmode="numeric" placeholder="d4 ${i+1}">`;return s+'</div></div>';}
  function readDice(prefix,count){let vals=[];for(let i=0;i<count;i++){const el=document.getElementById(prefix+i);const v=Number(el?.value);if(!Number.isInteger(v)||v<1||v>4){alert(`Chaque d4 doit être compris entre 1 et 4.`);el?.focus();return null;}vals.push(v);}return vals;}

  window.monsterAutomationButtons=function(f,i){
    if(!f.ref)return '';
    let html='';
    if(f.ref==='dragonnet-bleu'||f.ref==='dragonnet-bronze')html+=`<button onclick="rollRecharge(${i})">⚡ Recharge</button>`;
    if(f.ref==='harpie')html+=`<button onclick="startHarpieSong(${i})">🎵 Chant</button>`;
    if(f.ref==='strige'){
      const linked=getStrigeAttachedTarget(f);
      html+=linked.target?`<button onclick="autoStrigeDrain(${i})">🩸 Drain</button><button onclick="autoStrigeDetach(${i})">✋ Détacher</button>`:`<button onclick="startStrigeDrain(${i})">🩸 Drain de sang</button>`;
    }
    if(f.ref==='goule')html+=`<button onclick="startGouleClaws(${i})">☠️ Griffes</button>`;
    if(f.ref==='pieuvre-spores')html+=`<button onclick="startOctopusTentacles(${i})">🐙 Tentacules</button>`;
    if(f.ref==='serpent-feu')html+=`<button onclick="startFireSnakeBurn(${i})">🔥 Contact</button>`;
    if(MYCO_REFS.has(f.ref)){
      const p=profile(f.ref),a=ensureAuto(f),com=p.comUses===null?'∞':usesLeft(f,'communication',p.comUses);
      html+=`<button onclick="openMycoPunchV10('${safe(f.id)}',false)">👊 Poing automatisé</button>`;
      if(f.ref==='sinensa')html+=`<button onclick="openMycoPunchV10('${safe(f.id)}',true)">🍄 Attaques multiples</button>`;
      html+=`<button onclick="useMycoCommunicationV10('${safe(f.id)}')">🗣️ Communication (${com})</button>`;
      if(f.ref==='myconide-adulte')html+=`<button onclick="openMycoSporeSaveV10('${safe(f.id)}','pacify')">🕊️ Pacificatrices (${usesLeft(f,'pacify',3)}/3)</button>`;
      if(f.ref==='sinensa')html+=`<button onclick="openMycoSporeSaveV10('${safe(f.id)}','hallucinate')">🌀 Hallucinogènes</button>`;
      html+=`<button onclick="toggleMycoSunV10('${safe(f.id)}')">☀️ Soleil : ${a.sunExposed?'EXPOSÉ':'non'}</button>`;
      if(a.communicationActive)html+=`<button onclick="endMycoCommunicationV10('${safe(f.id)}')">✋ Fin communication</button>`;
    }
    return html;
  };

  window.openMycoPunchV10=function(sourceId,continueToSpores){
    const i=byId(sourceId),f=fighters[i],p=profile(f?.ref);if(i<0||!p)return;
    modal(`👊 ${p.label} — Poing`, `<div class="combat"><b>${safe(f.name)}</b> attaque au contact.<br>Entre le résultat brut du d20. Bonus automatique : <b>+${p.atk}</b>.</div><label>Cible</label><select id="mycoAtkTarget">${targetOptions(f.id)}</select><label>d20 brut</label><input id="mycoAtkD20" type="number" min="1" max="20" inputmode="numeric" autofocus><button class="good" onclick="resolveMycoAttackV10('${safe(f.id)}',${continueToSpores?'true':'false'})">Résoudre l’attaque</button>`);
    setTimeout(()=>document.getElementById('mycoAtkD20')?.focus(),30);
  };
  window.resolveMycoAttackV10=function(sourceId,continueToSpores){
    const si=byId(sourceId),ti=byId(document.getElementById('mycoAtkTarget')?.value),raw=Number(document.getElementById('mycoAtkD20')?.value),s=fighters[si],t=fighters[ti],p=profile(s?.ref);
    if(si<0||ti<0||!p){alert('Source ou cible introuvable.');return;}if(!Number.isInteger(raw)||raw<1||raw>20){alert('Le d20 doit être compris entre 1 et 20.');return;}
    const total=raw+p.atk,hit=raw===20||(raw!==1&&total>=Number(t.ca||10)),crit=raw===20;
    if(!hit){const msg=`${s.name} rate ${t.name} : ${raw}+${p.atk}=${total} contre CA ${t.ca}.`;logEvent(`🍄 ${msg}`);setLastResult('miss','👊 Poing raté',msg);closeModal();sync();if(continueToSpores)setTimeout(()=>openMycoSporeSaveV10(sourceId,'hallucinate'),80);return;}
    modal(`👊 ${p.label} — Dégâts`, `<div class="goodbox"><b>Touché${crit?' — CRITIQUE':''}</b> : ${raw}+${p.atk}=${total} contre CA ${t.ca}.</div>${dieFields('mycoBl',p.blDice,`${p.blDice}d4 contondants${p.blBonus?` ${p.blBonus>0?'+':''}${p.blBonus}`:''}`)}${dieFields('mycoPo',p.poDice,`${p.poDice}d4 poison`)}<button class="good" onclick="applyMycoDamageV10('${safe(sourceId)}','${safe(t.id)}',${crit?'true':'false'},${continueToSpores?'true':'false'})">Appliquer les dégâts</button>`);
  };
  window.applyMycoDamageV10=function(sourceId,targetId,crit,continueToSpores){
    const si=byId(sourceId),ti=byId(targetId),s=fighters[si],t=fighters[ti],p=profile(s?.ref);if(si<0||ti<0||!p)return;
    const bl=readDice('mycoBl',p.blDice),po=readDice('mycoPo',p.poDice);if(!bl||!po)return;
    const blRaw=Math.max(0,bl.reduce((a,b)=>a+b,0)+p.blBonus),poRaw=po.reduce((a,b)=>a+b,0),before=t.pv;
    window.__mycoDamageBatch=true;
    const r1=applyDamage(ti,blRaw,'contondant',crit,`${s.name} — Poing`,false);
    const r2=applyDamage(ti,poRaw,'poison',crit,`${s.name} — Poing`,false);
    window.__mycoDamageBatch=false;
    alertDistress(t);
    const msg=`${s.name} inflige ${r1.dmg} contondants + ${r2.dmg} poison à ${t.name}${crit?' (critique)':''}. PV ${before} → ${t.pv}.`;
    logEvent(`🍄 ${msg}`);setLastResult('hit','👊 Poing — dégâts appliqués',msg);closeModal();sync();

    if(s.ref==='sinensa'){
      const nextButton=continueToSpores
        ? `<button class="good" onclick="closeModal();openMycoSporeSaveV10('${safe(sourceId)}','hallucinate')">Continuer avec les spores hallucinogènes</button>`
        : `<button class="good" onclick="closeModal()">OK</button>`;
      setTimeout(()=>modal('💥 Dégâts de Sinensa',`
        <div class="goodbox">
          <b>${safe(t.name)}</b><br>
          ${r1.dmg} dégâts contondants + ${r2.dmg} dégâts de poison
          ${crit?'<br><b>COUP CRITIQUE</b>':''}
        </div>
        <div class="combat"><b>Total : ${r1.dmg+r2.dmg} dégâts</b><br>PV : ${before} → ${t.pv}</div>
        ${nextButton}
      `),40);
      return;
    }

    if(continueToSpores)setTimeout(()=>openMycoSporeSaveV10(sourceId,'hallucinate'),100);
  };

  window.useMycoCommunicationV10=function(sourceId){
    const i=byId(sourceId),f=fighters[i],p=profile(f?.ref);if(i<0||!p)return;
    if(p.comUses!==null&&!consume(f,'communication',p.comUses)){alert('Plus aucune utilisation de Spores de communication disponible aujourd’hui.');return;}
    const a=ensureAuto(f);a.communicationActive=true;a.communicationRounds=600;
    const left=p.comUses===null?'illimitées':`${a.communication}/${p.comUses}`;
    logEvent(`🍄 ${f.name} déploie ses Spores de communication : nuage de ${p.comRadius}, télépathie à 9 m, durée 1 heure.`);
    setLastResult('info','🗣️ Spores de communication',`${f.name} : zone ${p.comRadius}, télépathie entre créatures affectées à 9 m ou moins. Utilisations restantes : ${left}.`);sync();
  };
  window.endMycoCommunicationV10=function(sourceId){const i=byId(sourceId),f=fighters[i];if(i<0)return;const a=ensureAuto(f);a.communicationActive=false;a.communicationRounds=0;logEvent(`🍄 ${f.name} met fin à ses Spores de communication.`);sync();};

  window.openMycoSporeSaveV10=function(sourceId,type){
    const si=byId(sourceId),s=fighters[si],p=profile(s?.ref);if(si<0||!p)return;
    if(type==='pacify'&&usesLeft(s,'pacify',3)<=0){alert('Plus aucune utilisation de Spores pacificatrices disponible aujourd’hui.');return;}
    const dc=type==='pacify'?11:12,name=type==='pacify'?'Spores pacificatrices':'Spores hallucinogènes';
    modal(`🍄 ${name}`, `<div class="dm"><b>${safe(s.name)}</b> vise une créature visible à 1,50 m.<br>JS Constitution DD <b>${dc}</b>.</div><label>Cible</label><select id="mycoSporeTarget">${targetOptions(s.id)}</select><label>Résultat total du JS Constitution</label><input id="mycoSporeSave" type="number" inputmode="numeric" autofocus><button class="good" onclick="resolveMycoSporeSaveV10('${safe(sourceId)}','${type}')">Résoudre</button>`);
  };
  window.resolveMycoSporeSaveV10=function(sourceId,type){
    const si=byId(sourceId),ti=byId(document.getElementById('mycoSporeTarget')?.value),s=fighters[si],t=fighters[ti],total=Number(document.getElementById('mycoSporeSave')?.value),dc=type==='pacify'?11:12;
    if(si<0||ti<0){alert('Source ou cible introuvable.');return;}if(!Number.isFinite(total)){alert('Entre le résultat total du JS Constitution.');return;}
    if(type==='pacify'&&!consume(s,'pacify',3)){alert('Plus aucune utilisation disponible.');return;}
    clearSporeEffect(t);
    if(total>=dc){const msg=`${t.name} réussit son JS CON ${total} ≥ ${dc} : aucun effet.`;logEvent(`🍄 ${msg}`);setLastResult('hit','🍄 Sauvegarde réussie',msg);}
    else{
      const conditions=type==='pacify'?['étourdi']:['empoisonné','neutralisé'];conditions.forEach(c=>addCond(t,c));
      t.auto=t.auto||{};t.auto.mycoEffect={type,sourceId:s.id,dc,turnsLeft:10,conditions};
      const desc=type==='pacify'?'étourdi':'empoisonné, neutralisé et victime d’hallucinations';
      const msg=`${t.name} rate son JS CON ${total} < ${dc} : ${desc} pendant 1 minute maximum.`;logEvent(`🍄 ${msg}`);setLastResult('miss','🍄 Effet appliqué',msg);
    }
    closeModal();sync();
  };

  window.openMycoEndSaveV10=function(targetId){
    const ti=byId(targetId),t=fighters[ti],e=t?.auto?.mycoEffect;if(ti<0||!e)return false;
    const sidx=byId(e.sourceId),s=sidx>=0?fighters[sidx]:null,label=e.type==='pacify'?'Spores pacificatrices':'Spores hallucinogènes';
    window.__mycoResolving=true;
    modal(`🍄 Fin de tour — ${label}`, `<div class="warnbox"><b>${safe(t.name)}</b> doit effectuer un JS Constitution DD <b>${e.dc}</b>${s?` contre l’effet de ${safe(s.name)}`:''}.</div><div class="mini">Durée restante : ${e.turnsLeft} tour(s) maximum.</div><input id="mycoEndSave" type="number" inputmode="numeric" autofocus><div class="row"><button class="good" onclick="resolveMycoEndSaveV10('${safe(t.id)}')">Résoudre et terminer le tour</button><button class="danger" onclick="removeMycoEffectV10('${safe(t.id)}')">Retirer l’effet</button></div>`);
    return true;
  };
  function advanceAfterSave(){window.__mycoResolving=false;closeModal();sync();setTimeout(()=>advanceBaseTurn(),0);}
  window.resolveMycoEndSaveV10=function(targetId){
    const ti=byId(targetId),t=fighters[ti],e=t?.auto?.mycoEffect,total=Number(document.getElementById('mycoEndSave')?.value);if(ti<0||!e){advanceAfterSave();return;}if(!Number.isFinite(total)){alert('Entre le résultat total du JS Constitution.');return;}
    if(total>=e.dc){clearSporeEffect(t,`réussit son JS CON ${total} ≥ ${e.dc} : l’effet prend fin.`);setLastResult('hit','🍄 Effet terminé',`${t.name} réussit sa sauvegarde.`);}
    else{e.turnsLeft=Math.max(0,e.turnsLeft-1);if(e.turnsLeft<=0){clearSporeEffect(t,'l’effet expire après 1 minute.');setLastResult('info','🍄 Effet expiré',`${t.name} est libéré après 1 minute.`);}else{logEvent(`🍄 ${t.name} rate encore son JS CON ${total} < ${e.dc} : effet maintenu (${e.turnsLeft} tour(s)).`);setLastResult('miss','🍄 Effet maintenu',`${t.name} reste affecté.`);}}
    advanceAfterSave();
  };
  window.removeMycoEffectV10=function(targetId){const ti=byId(targetId),t=fighters[ti];if(ti<0)return;clearSporeEffect(t,'effet retiré manuellement.');setLastResult('info','🍄 Effet retiré',`${t.name} n’est plus affecté.`);advanceAfterSave();};

  window.toggleMycoSunV10=function(sourceId){
    const i=byId(sourceId),f=fighters[i];if(i<0)return;const a=ensureAuto(f);a.sunExposed=!a.sunExposed;if(a.sunRounds===undefined)a.sunRounds=0;
    logEvent(`☀️ ${f.name} : exposition au soleil ${a.sunExposed?'activée':'désactivée'}${a.sunExposed?' (désavantage aux tests, attaques et sauvegardes)':''}.`);setLastResult('info','☀️ Soleil gênant',a.sunExposed?`${f.name} est exposé : désavantage aux tests de caractéristique, jets d’attaque et jets de sauvegarde.`:`${f.name} n’est plus exposé. Temps cumulé conservé : ${a.sunRounds} round(s).`);sync();
  };
  function startTurnMycoChecks(){
    const f=fighters[turn];if(!f||!MYCO_REFS.has(f.ref))return;const a=ensureAuto(f);
    if(a.sunExposed){a.sunRounds=(Number(a.sunRounds)||0)+1;if(a.sunRounds>600&&f.pv>0){const before=f.pv;f.pv=0;logEvent(`☀️ ${f.name} meurt après plus de 1 heure d’exposition au soleil — PV ${before} → 0.`);setLastResult('miss','☀️ Exposition mortelle',`${f.name} a dépassé 1 heure au soleil et meurt.`);}else{setLastResult('info','☀️ Soleil gênant',`${f.name} est exposé : désavantage à tous ses tests de caractéristique, attaques et sauvegardes. ${a.sunRounds}/600 rounds.`);}sync();}
  }

  const baseApplyDamage=window.applyDamage;
  window.applyDamage=function(i,dmg,type,crit,why,autoRender=true){const before=fighters[i]?.pv,result=baseApplyDamage(i,dmg,type,crit,why,autoRender),f=fighters[i];if(!window.__mycoDamageBatch&&f&&MYCO_REFS.has(f.ref)&&Number(dmg)>0&&before!==f.pv){alertDistress(f);saveAll();if(autoRender)renderFighters();}return result;};

  const baseNextTurn=window.nextTurn;
  function advanceBaseTurn(){baseNextTurn();setTimeout(startTurnMycoChecks,20);}
  window.nextTurn=function(){if(window.__mycoResolving)return;const current=fighters[turn];if(current?.auto?.mycoEffect){openMycoEndSaveV10(current.id);return;}advanceBaseTurn();};
})();
</script>


<script>
/* V11 — ÉCONOMIE D'ACTION STRICTE
   Verrouille 1 action par tour pour les monstres actuellement automatisés.
   Gère correctement l'Attaques multiples de Sinensa (Poing + Spores hallucinogènes = une seule action).
*/
(function(){
  const MANAGED=new Set(['zombie','strige','pousse-myconide','myconide-adulte','sinensa']);
  const MYCO=new Set(['pousse-myconide','myconide-adulte','sinensa']);
  const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const byId=id=>fighters.findIndex(f=>f&&f.id===id);
  let turnSerial=Number(localStorage.getItem('dm_turn_serial_v11')||0);

  function econ(f){
    f.auto=f.auto||{};
    f.auto.economy=f.auto.economy||{serial:-1,actionUsed:false,actionName:'',bonusUsed:false};
    return f.auto.economy;
  }
  function beginTurn(f,reason){
    if(!f)return;
    turnSerial+=1;
    localStorage.setItem('dm_turn_serial_v11',String(turnSerial));
    const e=econ(f);
    e.serial=turnSerial;
    e.actionUsed=false;
    e.actionName='';
    e.bonusUsed=false;
    e.chain=null;
    e.reason=reason||'nouveau tour';
    saveAll();
  }
  function currentOk(f){
    return !!f && fighters[turn]===f;
  }
  function blockMessage(f,detail){
    const e=econ(f);
    const msg=!currentOk(f)
      ? `Ce n’est pas le tour de ${f.name}. Sélectionne d’abord ce monstre dans l’initiative.`
      : `${f.name} a déjà utilisé son action ce tour${e.actionName?` : ${e.actionName}`:''}. Passe au tour suivant.`;
    setLastResult('miss','⛔ Action impossible',msg);
    alert(msg+(detail?`\n\n${detail}`:''));
    renderFighters();
    return false;
  }
  function canAct(f){
    if(!f||f.pv<=0)return blockMessage(f||{name:'Ce monstre',auto:{}},'Un monstre à 0 PV ne peut pas agir.');
    if(!currentOk(f))return blockMessage(f);
    const e=econ(f);
    if(e.actionUsed)return blockMessage(f);
    return true;
  }
  function spend(f,name){
    if(!canAct(f))return false;
    const e=econ(f);
    e.actionUsed=true;
    e.actionName=name;
    logEvent(`⏱️ ${f.name} utilise son action : ${name}.`);
    saveAll();
    return true;
  }
  function refund(f,name){
    const e=econ(f);
    if(e.actionUsed && (!name||e.actionName===name)){
      e.actionUsed=false;e.actionName='';e.chain=null;saveAll();renderFighters();
    }
  }
  function actionDisabled(f,i){
    return i!==turn || f.pv<=0 || econ(f).actionUsed;
  }
  function disabledAttr(f,i){
    return actionDisabled(f,i)?' disabled title="Action indisponible : mauvais tour, monstre hors combat ou action déjà utilisée"':'';
  }
  function economyHTML(f){
    if(!f||f.kind==='pj')return '';
    const e=econ(f), managed=MANAGED.has(f.ref);
    const actionClass=e.actionUsed?'used':'available';
    const actionText=e.actionUsed?`Utilisée : ${safe(e.actionName||'action')}`:'Disponible (1/1)';
    const bonusText='Aucune action bonus sur cette fiche';
    return `<div class="economyBar">
      <div class="economySlot ${actionClass}"><b>Action</b><br>${actionText}</div>
      <div class="economySlot none"><b>Action bonus</b><br>${bonusText}</div>
      <div class="economySlot available"><b>Déplacement</b><br>Indépendant de l’action</div>
    </div>${managed?'':`<div class="economyWarning">⚠️ Verrouillage complet en attente pour ce monstre. Ses boutons génériques consomment néanmoins une seule action.</div>`}`;
  }

  // Affichage du compteur directement dans le panneau du tour actif.
  const baseActivePanelHTML=window.activePanelHTML;
  window.activePanelHTML=function(f,i){
    const html=baseActivePanelHTML(f,i);
    if(!f||f.kind==='pj')return html;
    return html.replace('<div class="monsterTurnActions">',economyHTML(f)+'<div class="monsterTurnActions">');
  };

  // Tous les boutons génériques d'une fiche consomment une action et sont bloqués ensuite.
  window.economyGenericActionV11=function(i,ai){
    const f=fighters[i],m=f?.ref?monster(f.ref):null,a=m?.actions?.[ai];
    if(!f||!a)return;
    if(!spend(f,a.name))return;
    logAbility(i,ai);
    setLastResult('info','⏱️ Action utilisée',`${f.name} utilise ${a.name}. Aucune autre action n’est possible pendant ce tour.`);
    renderFighters();
  };
  window.monsterActionButtons=function(f,i){
    if(!f.ref)return '';
    if(['strige','pousse-myconide','myconide-adulte','sinensa'].includes(f.ref))return '';
    const m=monster(f.ref);if(!m)return '';
    return (m.actions||[]).map((a,ai)=>`<button${disabledAttr(f,i)} onclick="economyGenericActionV11(${i},${ai})">${safe(a.name)}</button>`).join('');
  };

  // Recrée les boutons d'automatisation avec verrouillage visuel.
  window.monsterAutomationButtons=function(f,i){
    if(!f.ref)return '';
    let html='',d=disabledAttr(f,i);
    if(f.ref==='dragonnet-bleu'||f.ref==='dragonnet-bronze')html+=`<button onclick="rollRecharge(${i})">⚡ Recharge</button>`;
    if(f.ref==='harpie')html+=`<button${d} onclick="startHarpieSong(${i})">🎵 Chant</button>`;
    if(f.ref==='strige'){
      const linked=getStrigeAttachedTarget(f);
      html+=linked.target
        ? `<button onclick="autoStrigeDrain(${i})">🩸 Drain automatique</button><button onclick="autoStrigeDetach(${i})">✋ Détacher</button>`
        : `<button${d} onclick="startStrigeDrain(${i})">🩸 Drain de sang</button>`;
    }
    if(f.ref==='goule')html+=`<button${d} onclick="startGouleClaws(${i})">☠️ Griffes</button>`;
    if(f.ref==='pieuvre-spores')html+=`<button${d} onclick="startOctopusTentacles(${i})">🐙 Tentacules</button>`;
    if(f.ref==='serpent-feu')html+=`<button onclick="startFireSnakeBurn(${i})">🔥 Contact passif</button>`;
    if(MYCO.has(f.ref)){
      const a=f.auto?.myco||{},comMax=f.ref==='sinensa'?null:3;
      const com=comMax===null?'∞':(a.communication===undefined?comMax:a.communication);
      html+=`<button${d} onclick="openMycoPunchV10('${safe(f.id)}',false)">👊 Poing automatisé</button>`;
      if(f.ref==='sinensa')html+=`<button${d} onclick="openMycoPunchV10('${safe(f.id)}',true)">🍄 Attaques multiples</button>`;
      html+=`<button${d} onclick="useMycoCommunicationV10('${safe(f.id)}')">🗣️ Communication (${com})</button>`;
      if(f.ref==='myconide-adulte'){
        const left=a.pacify===undefined?3:a.pacify;
        html+=`<button${d} onclick="openMycoSporeSaveV10('${safe(f.id)}','pacify')">🕊️ Pacificatrices (${left}/3)</button>`;
      }
      if(f.ref==='sinensa')html+=`<button${d} onclick="openMycoSporeSaveV10('${safe(f.id)}','hallucinate')">🌀 Hallucinogènes</button>`;
      html+=`<button onclick="toggleMycoSunV10('${safe(f.id)}')">☀️ Soleil : ${a.sunExposed?'EXPOSÉ':'non'}</button>`;
      if(a.communicationActive)html+=`<button onclick="endMycoCommunicationV10('${safe(f.id)}')">✋ Fin communication</button>`;
    }
    return html;
  };

  // MYCONIDES : consommation au moment où l'action est réellement résolue.
  const baseResolvePunch=window.resolveMycoAttackV10;
  window.resolveMycoAttackV10=function(sourceId,continueToSpores){
    const i=byId(sourceId),f=fighters[i];
    if(!f)return;
    const raw=Number(document.getElementById('mycoAtkD20')?.value);
    const targetId=document.getElementById('mycoAtkTarget')?.value;
    if(!Number.isInteger(raw)||raw<1||raw>20||byId(targetId)<0){
      baseResolvePunch(sourceId,continueToSpores);
      return;
    }
    if(!spend(f,continueToSpores?'Attaques multiples : Poing + Spores hallucinogènes':'Poing'))return;
    if(continueToSpores)econ(f).chain='sinensa-multi';
    baseResolvePunch(sourceId,continueToSpores);
  };

  const baseUseCommunication=window.useMycoCommunicationV10;
  window.useMycoCommunicationV10=function(sourceId){
    const i=byId(sourceId),f=fighters[i];if(!f)return;
    if(!spend(f,'Spores de communication'))return;
    const before=f.auto?.myco?.communication;
    baseUseCommunication(sourceId);
    // Rembourse uniquement si aucune utilisation n'était disponible.
    const after=f.auto?.myco?.communication;
    if(before!==undefined&&before<=0&&after===before)refund(f,'Spores de communication');
  };

  const baseResolveSpore=window.resolveMycoSporeSaveV10;
  window.resolveMycoSporeSaveV10=function(sourceId,type){
    const i=byId(sourceId),f=fighters[i];if(!f)return;
    const saveValue=document.getElementById('mycoSporeSave')?.value;
    const targetId=document.getElementById('mycoSporeTarget')?.value;
    if(saveValue===null||saveValue===''||!Number.isFinite(Number(saveValue))||byId(targetId)<0){
      baseResolveSpore(sourceId,type);
      return;
    }
    const e=econ(f);
    const internal=(type==='hallucinate'&&e.chain==='sinensa-multi');
    if(!internal){
      const label=type==='pacify'?'Spores pacificatrices':'Spores hallucinogènes';
      if(!spend(f,label))return;
    }
    baseResolveSpore(sourceId,type);
    if(internal){e.chain=null;saveAll();}
  };

  // STRIGE : l'attaque initiale consomme l'action ; le drain de début de tour n'en consomme aucune.
  const baseResolveStrigeAttack=window.resolveStrigeAttack;
  window.resolveStrigeAttack=function(si,pi){
    const f=fighters[si];if(!f)return;
    const raw=Number(document.getElementById('strigeAttackD20')?.value);
    if(!Number.isInteger(raw)||raw<1||raw>20){
      baseResolveStrigeAttack(si,pi);
      return;
    }
    if(!spend(f,'Drain de sang'))return;
    baseResolveStrigeAttack(si,pi);
  };

  // Empêche même l'ouverture d'une action quand elle est déjà indisponible.
  const baseStartStrige=window.startStrigeDrain;
  window.startStrigeDrain=function(i){
    const f=fighters[i];if(!f)return;
    const linked=getStrigeAttachedTarget(f);
    if(!linked.target&&!canAct(f))return;
    baseStartStrige(i);
  };
  const baseOpenPunch=window.openMycoPunchV10;
  window.openMycoPunchV10=function(sourceId,multi){
    const i=byId(sourceId),f=fighters[i];if(!f||!canAct(f))return;
    baseOpenPunch(sourceId,multi);
  };
  const baseOpenSpore=window.openMycoSporeSaveV10;
  window.openMycoSporeSaveV10=function(sourceId,type){
    const i=byId(sourceId),f=fighters[i];if(!f)return;
    const internal=(type==='hallucinate'&&econ(f).chain==='sinensa-multi');
    if(!internal&&!canAct(f))return;
    baseOpenSpore(sourceId,type);
  };

  // Nouveau tour = ressources d'action remises à zéro.
  const baseNextTurn=window.nextTurn;
  window.nextTurn=function(){
    const before=turn;
    baseNextTurn();
    if(turn!==before||fighters.length===1)beginTurn(fighters[turn],'tour suivant');
    renderFighters();
  };
  const baseSetTurn=window.setTurn;
  window.setTurn=function(i){
    const before=turn;
    baseSetTurn(i);
    if(turn!==before)beginTurn(fighters[turn],'sélection initiative');
    renderFighters();
  };
  const basePrevTurn=window.prevTurn;
  window.prevTurn=function(){
    const before=turn;
    basePrevTurn();
    if(turn!==before||fighters.length===1)beginTurn(fighters[turn],'tour précédent');
    renderFighters();
  };
  const baseStartCombat=window.startCombat;
  window.startCombat=function(){
    baseStartCombat();
    beginTurn(fighters[turn],'début du combat');
    renderFighters();
  };

  // Initialise sans effacer un tour déjà en cours à chaque rechargement.
  if(fighters[turn]&&econ(fighters[turn]).serial<0)beginTurn(fighters[turn],'initialisation');
})();
</script>












<script>
/* V13.5 — PIEUVRE CONFORME À LA FICHE OFFICIELLE */
(function(){
  const REF='pieuvre-spores';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const byId=id=>fighters.findIndex(f=>f&&f.id===id);
  function state(f){
    f.auto=f.auto||{};
    f.auto.economy=f.auto.economy||{actionUsed:false,actionName:'',chain:null};
    return f.auto;
  }
  function resultPopup(title,body){
    setTimeout(()=>modal(title,`
      <div class="subcard" style="border:2px solid var(--gold)">${body}</div>
      <button class="good" onclick="closeModal()">OK — continuer</button>
    `),0);
  }

  window.startOctopusTentacles=function(i){
    const source=fighters[i];
    if(!source||source.ref!==REF)return;
    if(source.pv<=0){
      resultPopup('🐙 TENTACULES IMPOSSIBLES','<div class="warnbox">La pieuvre est à 0 PV.</div>');
      return;
    }
    if(!(fighters[turn]&&fighters[turn].id===source.id)){
      resultPopup('🐙 TENTACULES IMPOSSIBLES','<div class="warnbox">Ce n’est pas son tour.</div>');
      return;
    }
    if(state(source).economy.actionUsed){
      resultPopup('🐙 ACTION DÉJÀ UTILISÉE','<div class="warnbox">La pieuvre a déjà utilisé son action.</div>');
      return;
    }
    const targets=fighters.filter(f=>f.kind==='pj'&&f.pv>0);
    if(!targets.length){
      resultPopup('🐙 AUCUNE CIBLE','<div class="warnbox">Aucun PJ valide.</div>');
      return;
    }
    modal('🐙 TENTACULES — JET D’ATTAQUE',`
      <div class="combat"><b>+5 pour toucher</b> · allonge 4,50 m · une cible.</div>
      <label>Cible</label>
      <select id="octoTarget">${targets.map(t=>`<option value="${esc(t.id)}">${esc(t.name)} — CA ${Number(t.ca||10)}</option>`).join('')}</select>
      <label>Résultat naturel du d20</label>
      <input id="octoAttackD20" type="number" min="1" max="20" inputmode="numeric" placeholder="1 à 20">
      <button class="good" onclick="resolveOctopusAttackOfficial('${esc(source.id)}')">Résoudre l’attaque</button>`);
  };

  window.resolveOctopusAttackOfficial=function(sourceId){
    const source=fighters[byId(sourceId)];
    const target=fighters[byId(document.getElementById('octoTarget')?.value)];
    const natural=Number(document.getElementById('octoAttackD20')?.value);
    if(!source||!target)return;
    if(!Number.isInteger(natural)||natural<1||natural>20){
      alert('Entre un résultat naturel de d20 entre 1 et 20.');
      return;
    }
    const e=state(source).economy;
    if(e.actionUsed){closeModal();renderFighters();return;}
    e.actionUsed=true;
    e.actionName='Tentacules';

    const total=natural+5;
    const crit=natural===20;
    const hit=crit || (natural!==1 && total>=Number(target.ca||10));
    logEvent(`⏱️ ${source.name} utilise son action : Tentacules.`);

    if(!hit){
      const detail=`${source.name} rate ${target.name} : ${natural} + 5 = ${total} contre CA ${target.ca}.`;
      logEvent(`🐙 ${detail}`);
      setLastResult('miss','🐙 Tentacules — RATÉ',detail);
      saveAll();renderFighters();
      resultPopup('🐙 RÉSULTAT — RATÉ',`
        <div class="warnbox"><b>${esc(source.name)}</b> attaque <b>${esc(target.name)}</b></div>
        <div class="combat">
          <b>Jet :</b> ${natural} + 5 = ${total}<br>
          <b>CA :</b> ${target.ca}<br>
          <b>Dégâts :</b> 0<br>
          <b>Effet supplémentaire :</b> aucun
        </div>`);
      return;
    }

    modal(crit?'💥 COUP CRITIQUE — DÉGÂTS':'💥 TOUCHÉ — DÉGÂTS',`
      <div class="goodbox">${natural} + 5 = <b>${total}</b> contre CA ${target.ca}.</div>
      ${crit?`
        <label>Premier d8</label><input id="octoD8a" type="number" min="1" max="8" inputmode="numeric">
        <label>Deuxième d8</label><input id="octoD8b" type="number" min="1" max="8" inputmode="numeric">
        <div class="mini">Critique : 2d8 + 3 contondants.</div>
      `:`
        <label>Résultat du d8</label><input id="octoD8a" type="number" min="1" max="8" inputmode="numeric">
        <div class="mini">Dégâts : 1d8 + 3 contondants.</div>
      `}
      <button class="good" onclick="finishOctopusDamageOfficial('${esc(source.id)}','${esc(target.id)}',${natural},${total},${crit})">Appliquer les dégâts</button>`);
  };

  window.finishOctopusDamageOfficial=function(sourceId,targetId,natural,total,crit){
    const source=fighters[byId(sourceId)];
    const ti=byId(targetId);
    const target=fighters[ti];
    const a=Number(document.getElementById('octoD8a')?.value);
    const b=crit?Number(document.getElementById('octoD8b')?.value):0;
    if(!Number.isInteger(a)||a<1||a>8){alert('Entre un d8 entre 1 et 8.');return;}
    if(crit&&(!Number.isInteger(b)||b<1||b>8)){alert('Entre le second d8 entre 1 et 8.');return;}

    const raw=a+b+3;
    const before=target.pv;
    const result=applyDamage(ti,raw,'contondant',false,`${source.name} — Tentacules`,false);
    const diceText=crit?`2d8 [${a} + ${b}] + 3`:`1d8 [${a}] + 3`;
    const detail=`${source.name} inflige ${result.dmg} dégâts contondants à ${target.name}. PV ${before} → ${target.pv}.`;
    setLastResult('hit',crit?'🐙 Tentacules — CRITIQUE':'🐙 Tentacules — TOUCHÉ',detail);
    saveAll();renderFighters();

    resultPopup(crit?'💥 RÉSULTAT — CRITIQUE':'💥 RÉSULTAT — TENTACULES',`
      <div class="goodbox"><b>${esc(source.name)}</b> touche <b>${esc(target.name)}</b></div>
      <div class="combat">
        <b>Jet :</b> ${natural} + 5 = ${total}<br>
        <b>CA :</b> ${target.ca}<br>
        <b>Dégâts :</b> ${esc(diceText)} = <b>${result.dmg} contondants</b><br>
        <b>PV :</b> ${before} → <b>${target.pv}</b><br>
        <b>Effet supplémentaire :</b> aucun
      </div>`);
  };

  const oldMonsterActionButtons=window.monsterActionButtons;
  window.monsterActionButtons=function(f,i){
    if(f?.ref===REF)return '';
    return oldMonsterActionButtons?oldMonsterActionButtons(f,i):'';
  };

  const oldLogAbility=window.logAbility;
  window.logAbility=function(i,ai){
    const f=fighters?.[i];
    const m=f?.ref?monster(f.ref):null;
    if(f?.ref===REF && m?.actions?.[ai]?.name==='Tentacules')return startOctopusTentacles(i);
    return oldLogAbility?oldLogAbility(i,ai):undefined;
  };

  const oldAutomationButtons=window.monsterAutomationButtons;
  window.monsterAutomationButtons=function(f,i){
    let html=oldAutomationButtons?oldAutomationButtons(f,i):'';
    if(!f||f.ref!==REF)return html;
    html=html.replace(/<button[^>]*onclick="startOctopusTentacles\([^)]*\)"[^>]*>[\s\S]*?<\/button>/g,'');
    const disabled=(i!==turn||f.pv<=0||state(f).economy.actionUsed)?' disabled':'';
    return html+`<button${disabled} onclick="startOctopusTentacles(${i})">🐙 Tentacules</button>`;
  };

  setTimeout(()=>window.renderFighters?.(),0);
})();
</script>

      delete f.auto.octopusGrappledBy;

<script>
/* V13.9 — fin de tour automatique des monstres déjà validés */
(function(){
  const VALIDATED=new Set([
    'zombie',
    'strige',
    'pousse-myconide',
    'myconide-adulte',
    'sinensa',
    'pieuvre-spores'
  ]);

  let pending=null;
  const fighterById=id=>fighters.find(f=>f&&f.id===id);
  const indexById=id=>fighters.findIndex(f=>f&&f.id===id);
  const modalVisible=()=>document.getElementById('modal')?.classList.contains('on');

  function advancePending(){
    if(!pending)return;
    const source=fighterById(pending.sourceId);
    const current=fighters[turn];
    pending=null;
    if(!combatStarted||!source||!current||current.id!==source.id)return;
    setTimeout(()=>window.nextTurn(),40);
  }

  window.queueValidatedMonsterEnd=function(sourceId){
    const source=fighterById(sourceId);
    if(!source||!VALIDATED.has(source.ref))return;
    pending={sourceId};
    setTimeout(()=>{
      if(pending?.sourceId===sourceId&&!modalVisible())advancePending();
    },180);
  };

  window.cancelValidatedMonsterEnd=function(){
    pending=null;
  };

  const originalCloseModal=window.closeModal;
  window.closeModal=function(){
    originalCloseModal();
    if(pending)setTimeout(advancePending,25);
  };

  /* Zombie : son action unique terminée, le tour passe. */
  const originalGenericAction=window.economyGenericActionV11;
  window.economyGenericActionV11=function(i,ai){
    const source=fighters[i];
    const before=source?.auto?.economy?.actionUsed;
    const result=originalGenericAction(i,ai);
    if(source?.ref==='zombie'&&!before&&source.auto?.economy?.actionUsed){
      queueValidatedMonsterEnd(source.id);
    }
    return result;
  };

  /* Strige : attaque ratée, fixation terminée ou drain automatique résolu. */
  const originalResolveStrigeAttack=window.resolveStrigeAttack;
  window.resolveStrigeAttack=function(si,pi){
    const source=fighters[si],target=fighters[pi];
    const raw=Number(document.getElementById('strigeAttackD20')?.value);
    const miss=source&&target&&Number.isInteger(raw)&&raw>=1&&raw<=20&&(raw+5)<Number(target.ca||10);
    if(miss)queueValidatedMonsterEnd(source.id);
    return originalResolveStrigeAttack(si,pi);
  };

  const originalApplyStrigeFix=window.applyStrigeFix;
  window.applyStrigeFix=function(si,pi,d20,total,ca,dmg,detail){
    const source=fighters[si];
    const result=originalApplyStrigeFix(si,pi,d20,total,ca,dmg,detail);
