  function allAbilities(){return Object.entries(PJS).flatMap(([name,p])=>p.abilities.map(a=>({owner:name,...a})));}
  function monsterAction(ref,name){const m=data.monsters.find(x=>x.id===ref),a=m?.actions.find(x=>x.name===name);if(!a)throw Error(`action monstre inconnue ${ref}/${name}`);return a;}
  function monsterActionSpec(ref,name){const a=monsterAction(ref,name),t=a.text;const bm=t.match(/\+(\d+)\s+pour toucher/i);const dc=t.match(/DD\s*(\d+)/i);const diceParts=[...t.matchAll(/\d+\s*\((\d+d\d+(?:\s*[+-]\s*\d+)?)\)\s*dégâts/gi)].map(x=>x[1].replace(/\s/g,''));return {ref,name,text:t,kind:/attaques multiples/i.test(name)?'multiattack':bm?'attack':dc?'save':'effect',bonus:bm?+bm[1]:null,dc:dc?+dc[1]:null,diceParts,half:/moitié/i.test(t)};}
  function resolveMonsterAction(ref,name,opt={}){const s=monsterActionSpec(ref,name),out={...s,hit:null,damage:0,effect:s.text};if(s.kind==='attack'){const natural=Number(opt.d20);if(!Number.isInteger(natural)||natural<1||natural>20)throw Error('d20 monstre requis');out.attackTotal=natural+s.bonus;out.critical=natural===20;out.hit=out.critical||(natural!==1&&out.attackTotal>=Number(opt.ca));if(out.hit)out.damage=s.diceParts.reduce((n,e)=>n+(out.critical?criticalDice(e):dice(e)),0);}else if(s.kind==='save'){if(!Number.isFinite(Number(opt.save)))throw Error('sauvegarde monstre requise');out.saveSuccess=Number(opt.save)>=s.dc;const base=s.diceParts.reduce((n,e)=>n+dice(e),0);out.damage=out.saveSuccess?(s.half?Math.floor(base/2):0):base;}else if(s.kind==='multiattack'){const m=data.monsters.find(x=>x.id===ref);out.components=m.actions.filter(x=>x!==monsterAction(ref,name)&&/pour toucher/i.test(x.text)).map(x=>x.name);}return out;}
  reset();
  window.QA_ENGINE={DAMAGE_TYPES,PJS,state,clone,dice,criticalDice,reset,beginTurn,beginRound,profile,ability,resolveAbility,concentrationSave,breakConcentration,adjustedPJDamage,allAbilities,monsterActionSpec,resolveMonsterAction};

  window.renderPlayerAbilityPanel=function(f){
    const p=PJS[f?.name];if(!p)return '';
    return `<div class="actionPanel"><h3>Actions guidées de ${esc(f.name)}</h3><p class="mini">${p.abilities.length} capacités issues de la fiche. Le bouton affiche coût, portée/règle et consommation avant résolution.</p><div class="row">${p.abilities.map(a=>`<button onclick="showPlayerAbility('${String(f.name).replace(/'/g,"\\'")}','${a.id}')">${esc(a.name)}</button>`).join('')}</div></div>`;
  };
  window.showPlayerAbility=function(name,id){const a=ability(name,id),r=state.resources[name];modal(a.name,`<div class="combat"><b>Économie :</b> ${esc(a.action)}${a.slot?` · emplacement niv. ${a.slot}`:''}${a.resource?` · ressource ${esc(a.resource)}`:''}<br><b>Type :</b> ${esc(a.kind)}${a.save?` · JS ${a.save} DD ${a.dc}`:''}${a.damage?` · ${esc(a.damage)} ${esc(a.type)}`:''}${a.duration?` · durée ${esc(a.duration)}`:''}${a.concentration?' · concentration':''}</div><div class="dm">${esc(a.effect||'Résolution par attaque, sauvegarde ou soin selon la fiche.')}</div><p class="mini">Ressources actuelles : ${esc(JSON.stringify(r))}</p><button class="good" onclick="closeModal()">Compris — utiliser avec les dés physiques</button>`);};

  const baseRender=window.renderFighters;
  window.renderFighters=function(){baseRender();const active=fighters[turn];if(active?.kind==='pj'){const card=document.querySelector('#activeColumn .activeBox')||document.querySelector('.activeBox');if(card&&!card.querySelector('.actionPanel'))card.insertAdjacentHTML('beforeend',renderPlayerAbilityPanel(active));}};
})();

</script>

<script>
/* V17 — résolution réellement fonctionnelle des capacités PJ et des actions de monstres.
   Les dés restent physiques ; l'application contrôle les bornes, calcule, consomme
   les ressources et applique PV/états/concentration au lieu d'afficher un simple rappel. */
(function(){
  'use strict';
  const Q=window.QA_ENGINE;
  if(!Q)return;
  const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const fid=id=>fighters.findIndex(f=>f.id===id);
  const byName=n=>fighters.findIndex(f=>f.name===n);
  const living=(side)=>fighters.filter(f=>f.pv>0&&(side==='enemy'?isHostileTarget(f):f.kind==='pj'||f.faction==='ally'));
  const optionList=(arr)=>arr.map(f=>`<option value="${esc(f.id)}">${esc(f.name)} — CA ${f.ca} — PV ${f.pv}/${f.max}</option>`).join('');
  const intVal=(id,min,max,label)=>{const raw=document.getElementById(id)?.value;if(raw===''||raw==null)throw Error(`${label} requis`);const n=Number(raw);if(!Number.isInteger(n)||n<min||n>max)throw Error(`${label} doit être compris entre ${min} et ${max}`);return n;};
  const numberVal=(id,min,label)=>{const raw=document.getElementById(id)?.value;if(raw===''||raw==null)throw Error(`${label} requis`);const n=Number(raw);if(!Number.isFinite(n)||n<min)throw Error(`${label} invalide`);return n;};
  const diceBonus=expr=>{const m=String(expr||'').replace(/\s/g,'').match(/^\d+d\d+([+-]\d+)?$/);return m?Number(m[1]||0):0;};
  const withFixed=(subtotal,expr)=>Number(subtotal)+diceBonus(expr);
  function addCond(f,c,meta={}){f.conditions=f.conditions||[];if(!f.conditions.includes(c))f.conditions.push(c);f.auto=f.auto||{};f.auto.v17Effects=f.auto.v17Effects||{};f.auto.v17Effects[c]={...meta,round:window.round||0};}
  function delCond(f,c){f.conditions=(f.conditions||[]).filter(x=>x!==c);if(f.auto?.v17Effects)delete f.auto.v17Effects[c];}
  function consume(owner,a){
    const p=Q.profile(owner), r=Q.state.resources[owner]||(Q.reset(),Q.state.resources[owner]);
    const e=Q.state.economy[owner]||(Q.state.economy[owner]={action:false,bonus:false,reaction:false});
    if(['action','bonus','reaction'].includes(a.action)&&e[a.action])throw Error(`${a.action} déjà utilisée pendant ce tour`);
    if(a.slot&&r.slots<a.slot)throw Error('Aucun emplacement de sort disponible');
    if(a.resource&&r[a.resource]!==Infinity&&(!Number.isFinite(r[a.resource])||r[a.resource]<=0))throw Error(`Ressource épuisée : ${a.resource}`);
    if(['action','bonus','reaction'].includes(a.action))e[a.action]=true;
    if(a.slot)r.slots-=a.slot;
    if(a.resource&&r[a.resource]!==Infinity)r[a.resource]--;
    if(a.concentration){const old=Q.state.concentration[owner];if(old){const oldA=p.abilities.find(x=>x.id===old);fighters.forEach(f=>delCond(f,`Concentration : ${oldA?.name||old}`));}Q.state.concentration[owner]=a.id;}
  }
  function canConsume(owner,a){const r=Q.state.resources[owner]||(Q.reset(),Q.state.resources[owner]),e=Q.state.economy[owner]||(Q.state.economy[owner]={action:false,bonus:false,reaction:false});if(['action','bonus','reaction'].includes(a.action)&&e[a.action])throw Error(`${a.action} déjà utilisée pendant ce tour`);if(a.slot&&r.slots<a.slot)throw Error('Aucun emplacement de sort disponible');if(a.resource&&r[a.resource]!==Infinity&&(!Number.isFinite(r[a.resource])||r[a.resource]<=0))throw Error(`Ressource épuisée : ${a.resource}`);}
  function applyHP(target,amount,type,crit,why){const i=fid(target.id);if(i<0)return 0;if(target.kind==='pj'){const actual=Q.adjustedPJDamage(target.name,amount,type);target.pv=Math.max(0,Number(target.pv)-actual);logEvent(`${why} : ${target.name} subit ${actual} dégâts ${type} · PV ${target.pv}/${target.max}`);return actual;}return applyDamage(i,amount,type,crit,why,false).dmg;}
  function healHP(target,n,why){const before=Number(target.pv);target.pv=Math.min(Number(target.max),before+n);logEvent(`${why} : ${target.name} récupère ${target.pv-before} PV · PV ${target.pv}/${target.max}`);return target.pv-before;}
  const EFFECTS={
    'hammering-horns':(t)=>addCond(t,'Repoussé 3 m',{duration:'instantané'}),
    'searing-smite':(t)=>addCond(t,'En feu — Châtiment ardent',{duration:'1 minute',save:'CON 13 fin de tour'}),
    heroism:(t)=>addCond(t,'Héroïsme',{duration:'1 minute',concentration:true,tempHp:3}),
    'goring-rush':()=>{},
    'thorn-whip':(t)=>addCond(t,'Attiré 3 m',{duration:'instantané'}),
    shillelagh:(t)=>addCond(t,'Gourdin magique',{duration:'1 minute'}),
    'daunting-roar':(t)=>addCond(t,'effrayé',{duration:'fin prochain tour Lelio'}),
    entangle:(t)=>addCond(t,'entravé',{duration:'1 minute',escape:'FOR DD 13',concentration:true}),
    'faerie-fire':(t)=>addCond(t,'Lueurs féeriques — attaques avantagées',{duration:'1 minute',concentration:true}),
    'earth-tremor':(t)=>addCond(t,'à terre',{duration:'jusqu’au relèvement'}),
    'ice-knife':()=>{},
    thunderwave:(t)=>addCond(t,'Repoussé 3 m',{duration:'instantané'}),
    'fog-cloud':(t)=>addCond(t,'Zone fortement obscurcie',{duration:'1 heure',concentration:true}),
    'absorb-elements':(t)=>addCond(t,'Absorption des éléments',{duration:'début prochain tour'}),
    guidance:(t)=>addCond(t,'Assistance +1d4',{duration:'1 minute',concentration:true}),
    'shocking-grasp':(t)=>addCond(t,'Réactions interdites',{duration:'début prochain tour Loris'}),
    shield:(t)=>addCond(t,'Bouclier +5 CA',{duration:'début prochain tour Loris'}),
    'innate-sorcery':(t)=>addCond(t,'Sorcellerie innée',{duration:'1 minute'}),
    'detect-magic':(t)=>addCond(t,'Détection de la magie',{duration:'10 minutes',concentration:true}),
    'minor-illusion':(t)=>addCond(t,'Illusion mineure',{duration:'1 minute'}),
    prestidigitation:(t)=>addCond(t,'Prestidigitation',{duration:'1 heure'}),
    light:(t)=>addCond(t,'Lumière',{duration:'1 heure'}),
    'hunters-mark':(t)=>addCond(t,'Marque du chasseur +1d6',{duration:'1 heure',concentration:true}),
    'ensnaring-strike':(t)=>addCond(t,'entravé — Frappe piégeuse',{duration:'1 minute',damageStart:'1d6 perforant',concentration:true}),
    druidcraft:(t)=>addCond(t,'Effet de druidisme',{duration:'selon effet'})
  };
  function fieldsFor(a){
    const enemy=/attack|save/.test(a.kind), friendly=a.kind==='heal'||['heroism','shillelagh','guidance','shield','absorb-elements','detect-magic','light','prestidigitation','minor-illusion','innate-sorcery'].includes(a.id);
    const targets=enemy?living('enemy'):friendly?living('ally'):fighters.filter(f=>f.pv>0);
    let h=targets.length?`<label>Cible</label><select id="v17Target">${optionList(targets)}</select>`:'';
    if(a.kind.includes('attack'))h+=`<label>Résultat brut du d20</label><input id="v17d20" type="number" min="1" max="20" placeholder="1 à 20">`;
    if(a.kind.includes('save'))h+=`<label>Résultat total de la sauvegarde ${esc(a.save)} DD ${a.dc}</label><input id="v17save" type="number" placeholder="total du JS">`;
    if(a.damage)h+=`<label>Total des dés de dégâts (${esc(a.damage)} ${esc(a.type)})</label><input id="v17damage" type="number" min="0" placeholder="sans le modificateur fixe"><p class="mini">Sur un 20 naturel, lance deux fois les dés indiqués et saisis leur total. L’application ajoute ensuite le modificateur fixe une seule fois.</p>`;
    if(a.aoeDamage)h+=`<label>Dégâts de zone (${esc(a.aoeDamage)} ${esc(a.aoeType)})</label><input id="v17aoe" type="number" min="0" placeholder="total des dés de zone">`;
    if(a.kind==='heal')h+=`<label>${a.resource==='layOnHands'?'Points à dépenser':'Total des dés de soins ('+esc(a.heal||'')+', sans modificateur fixe)'}</label><input id="v17heal" type="number" min="1" placeholder="résultat des dés">`;
    return h;
  }
  window.showPlayerAbility=function(owner,id){
    const a=Q.ability(owner,id),r=Q.state.resources[owner];
    modal(`Résoudre — ${a.name}`,`<div class="combat"><b>${esc(owner)}</b> · ${esc(a.action)}${a.slot?` · emplacement niv. ${a.slot}`:''}${a.resource?` · ${esc(a.resource)}`:''}${a.concentration?' · concentration':''}<br>${a.save?`JS ${a.save} DD ${a.dc}`:''} ${a.damage?` · ${esc(a.damage)} ${esc(a.type)}`:''}</div><div class="dm">${esc(a.effect||'Résolution conforme à la fiche.')}</div>${fieldsFor(a)}<div class="warnbox"><b>Confirmation :</b> la ressource n’est consommée qu’au clic suivant. Annuler ne coûte rien.</div><button class="good" onclick="resolvePlayerAbilityV17('${String(owner).replace(/'/g,"\\'")}','${id}')">Confirmer et appliquer</button><button onclick="closeModal()">Annuler sans coût</button><p class="mini">Ressources : ${esc(JSON.stringify(r))}</p>`);
  };
  window.resolvePlayerAbilityV17=function(owner,id){
    try{
      const a=Q.ability(owner,id), target=fighters[fid(document.getElementById('v17Target')?.value)]||fighters[byName(owner)];canConsume(owner,a);
      let hit=true,crit=false,saveSuccess=false,damage=0,healing=0,detail='';
      if(a.kind.includes('attack')){const d=intVal('v17d20',1,20,'d20'),total=d+(a.bonus||0);crit=d===20;hit=crit||(d!==1&&total>=Number(target.ca));detail=`d20 ${d} + ${a.bonus||0} = ${total} contre CA ${target.ca}`;}
      if(a.kind.includes('save')){const sv=numberVal('v17save',-20,'Sauvegarde');saveSuccess=sv>=a.dc;hit=!saveSuccess;detail=`JS ${a.save} ${sv} contre DD ${a.dc}`;}
      if(a.damage){const diceTotal=numberVal('v17damage',0,'Dégâts');damage=hit?withFixed(diceTotal,a.damage):(a.half?Math.floor(withFixed(diceTotal,a.damage)/2):0);}
      let aoe=0;if(a.aoeDamage)aoe=withFixed(numberVal('v17aoe',0,'Dégâts de zone'),a.aoeDamage);
      if(a.kind==='heal'){healing=numberVal('v17heal',1,'Soins');if(a.resource==='layOnHands'&&healing>a.maxSpend)throw Error(`Maximum ${a.maxSpend} points`);if(a.resource!=='layOnHands')healing=withFixed(healing,a.heal);}
      consume(owner,a);
      if(damage&&target)applyHP(target,damage,a.type,crit,`${owner} — ${a.name}`);
      if(aoe&&target)applyHP(target,saveSuccess?0:aoe,a.aoeType,false,`${owner} — explosion de ${a.name}`);
      if(healing&&target)healHP(target,healing,`${owner} — ${a.name}`);
      if(hit&&target&&EFFECTS[id])EFFECTS[id](target,a);
      if(a.concentration&&target)addCond(target,`Concentration : ${a.name}`,{owner,duration:a.duration});
      logEvent(`${owner} utilise ${a.name}${detail?' — '+detail:''}${hit===false?' — sans effet offensif':''}`);saveAll();closeModal();renderFighters();
    }catch(e){alert(e.message);}
  };

  function monsterTargets(){return fighters.filter(f=>f.kind==='pj'&&f.pv>0);}
  window.resolveMonsterActionV17=function(sourceId,ai){
    const s=fighters[fid(sourceId)],m=s&&monster(s.ref),a=m?.actions?.[ai];if(!s||!a)return;
    const spec=Q.monsterActionSpec(s.ref,a.name);
    if(spec.kind==='multiattack'){const names=Q.resolveMonsterAction(s.ref,a.name).components||[],comps=names.map(n=>`<button class="good" onclick="resolveMonsterActionV17('${esc(sourceId)}',${m.actions.findIndex(x=>x.name===n)})">Résoudre ${esc(n)}</button>`).join('');return modal(`${a.name} — séquence complète`,`<div class="combat">Chaque composante doit être résolue séparément sur la cible choisie.</div>${comps}<button onclick="closeModal()">Terminer la séquence</button>`);}
    const targets=monsterTargets();let h=`<div class="combat">${esc(a.text)}</div>${targets.length?`<label>Cible</label><select id="v17mTarget">${optionList(targets)}</select>`:''}`;
    if(spec.kind==='attack')h+=`<label>d20 brut (+${spec.bonus})</label><input id="v17mD20" type="number" min="1" max="20"><label>Total des dés de dégâts</label><input id="v17mDamage" type="number" min="0"><p class="mini">Sur un 20 naturel, lance deux fois tous les dés de dégâts puis saisis leur total. Les modificateurs fixes ne sont jamais doublés.</p>`;
    else if(spec.kind==='save')h+=`<label>Résultat total du JS (DD ${spec.dc})</label><input id="v17mSave" type="number"><label>Dégâts totaux si échec</label><input id="v17mDamage" type="number" min="0" value="0">`;
    h+=`<button class="good" onclick="finishMonsterActionV17('${esc(sourceId)}',${ai})">Calculer et appliquer</button><button onclick="closeModal()">Annuler</button>`;modal(`${s.name} — ${a.name}`,h);
  };
  window.finishMonsterActionV17=function(sourceId,ai){
    try{
      const s=fighters[fid(sourceId)],m=monster(s.ref),a=m.actions[ai],spec=Q.monsterActionSpec(s.ref,a.name),t=fighters[fid(document.getElementById('v17mTarget')?.value)];let success=true,crit=false,detail='';
      if(spec.kind==='attack'){const d=intVal('v17mD20',1,20,'d20'),total=d+spec.bonus;crit=d===20;success=crit||(d!==1&&total>=Number(t.ca));detail=`${d}+${spec.bonus}=${total} contre CA ${t.ca}`;if(success){const fixed=spec.diceParts.reduce((n,e)=>n+diceBonus(e),0),dmg=numberVal('v17mDamage',0,'Dégâts')+fixed;applyHP(t,dmg,'non typé',crit,`${s.name} — ${a.name}`);}}
      else if(spec.kind==='save'){const sv=numberVal('v17mSave',-20,'Sauvegarde');success=sv<spec.dc;detail=`JS ${sv} contre DD ${spec.dc}`;let dmg=numberVal('v17mDamage',0,'Dégâts');if(!success&&spec.half)dmg=Math.floor(dmg/2);else if(!success)dmg=0;if(dmg)applyHP(t,dmg,'non typé',false,`${s.name} — ${a.name}`);}
      else detail='effet confirmé et journalisé';
      applyMonsterEffectV17(s,a,t,success);logEvent(`${s.name} utilise ${a.name} — ${detail}`);saveAll();closeModal();renderFighters();
    }catch(e){alert(e.message);}
  };
  window.applyMonsterEffectV17=function(s,a,t,landed){if(!landed||!t)return;const n=norm(a.name+' '+a.text);if(n.includes('charme'))addCond(t,'charmé',{source:s.id});if(n.includes('paralyse'))addCond(t,'paralysé',{source:s.id,repeatSave:'fin de tour'});if(n.includes('etourdi'))addCond(t,'étourdi',{source:s.id,repeatSave:'fin de tour'});if(n.includes('empoison'))addCond(t,'empoisonné',{source:s.id});if(n.includes('agripp'))addCond(t,'agrippé',{source:s.id});if(n.includes('entrav'))addCond(t,'entravé',{source:s.id});if(n.includes('a terre'))addCond(t,'à terre',{source:s.id});};
  const oldButtons=window.monsterActionButtons;
  window.monsterActionButtons=function(f,i){if(!f?.ref)return oldButtons?oldButtons(f,i):'';if(['strige','pousse-myconide','myconide-adulte','sinensa'].includes(f.ref))return oldButtons?oldButtons(f,i):'';const m=monster(f.ref);return (m?.actions||[]).map((a,ai)=>`<button onclick="resolveMonsterActionV17('${esc(f.id)}',${ai})">${esc(a.name)}</button>`).join('');};
  window.startFireSnakeBurn=function(i){const s=fighters[i];if(!s)return;modal('Serpent de feu — Corps brûlant',`<div class="combat"><b>Déclencheur :</b> une créature touche le serpent, ou le touche avec une attaque de corps à corps à 1,50 m.</div><label>Cible affectée</label><select id="v17BurnTarget">${optionList(monsterTargets())}</select><label>Résultat du d6 feu</label><input id="v17BurnD6" type="number" min="1" max="6"><button class="good" onclick="applyFireSnakeBurnV17(${i})">Appliquer les dégâts</button><button onclick="closeModal()">Annuler</button>`);};
  window.applyFireSnakeBurnV17=function(i){try{const s=fighters[i],t=fighters[fid(document.getElementById('v17BurnTarget')?.value)],d=intVal('v17BurnD6',1,6,'d6');applyHP(t,d,'feu',false,`${s.name} — Corps brûlant`);saveAll();closeModal();renderFighters();}catch(e){alert(e.message);}};
  window.openMonsterTraitV17=function(sourceId,si){const s=fighters[fid(sourceId)],m=s&&monster(s.ref),tr=m?.special?.[si];if(!s||!tr)return;const candidates=monsterTargets();modal(`${s.name} — ${tr.name}`,`<div class="combat">${esc(tr.text)}</div>${candidates.length?`<label>Cible concernée (si applicable)</label><select id="v17TraitTarget"><option value="">— aucune cible directe —</option>${optionList(candidates)}</select>`:''}<label>Conséquence chiffrée éventuelle</label><input id="v17TraitDamage" type="number" min="0" value="0"><select id="v17TraitType">${Q.DAMAGE_TYPES.map(x=>`<option>${esc(x)}</option>`).join('')}</select><button class="good" onclick="applyMonsterTraitV17('${esc(sourceId)}',${si})">Confirmer le déclenchement</button><button onclick="closeModal()">Annuler</button>`);};
  window.applyMonsterTraitV17=function(sourceId,si){try{const s=fighters[fid(sourceId)],m=monster(s.ref),tr=m.special[si],t=fighters[fid(document.getElementById('v17TraitTarget')?.value)],d=numberVal('v17TraitDamage',0,'Conséquence'),type=document.getElementById('v17TraitType')?.value||'non typé';if(d&&t)applyHP(t,d,type,false,`${s.name} — ${tr.name}`);if(t)applyMonsterEffectV17(s,tr,t,true);logEvent(`${s.name} : trait déclenché — ${tr.name}${t?' sur '+t.name:''}`);saveAll();closeModal();renderFighters();}catch(e){alert(e.message);}};
  const oldAuto=window.monsterAutomationButtons;
  window.monsterAutomationButtons=function(f,i){let h=oldAuto?oldAuto(f,i):'';const m=f?.ref?monster(f.ref):null;if(m?.special?.length)h+=m.special.map((s,si)=>`<button class="blue" onclick="openMonsterTraitV17('${esc(f.id)}',${si})">Trait : ${esc(s.name)}</button>`).join('');return h;};
  window.resolveDragonSpirit=function(){
    try{const die=intVal('dragonSpiritD10',1,10,'d10'),blue=fighters.find(f=>f.ref==='dragonnet-bleu'),pjs=fighters.filter(f=>f.kind==='pj'),allies=fighters.filter(f=>f.kind==='pj'||f.ref==='dragonnet-bronze');fighters.forEach(f=>delCond(f,'Avantage des esprits'));
      if(die<=2){logEvent(`Esprits draconiques d10=${die} — Astalagan : résolution en cours`);return modal('Astalagan — bénédiction',`<div class="combat">Tous les PJ et Aïdron récupèrent <b>1d4+4 PV</b>.</div><label>Résultat du d4</label><input id="v17SpiritD4" type="number" min="1" max="4"><button class="good" onclick="finishDragonHealV17(${die})">Soigner tout le groupe</button>`);}
      if(die<=4){logEvent(`Esprits draconiques d10=${die} — Clyssavar : résolution en cours`);return modal('Clyssavar — flammes',`<div class="combat">Vrilléclair : JS Dextérité DD 12, sinon 2d6 feu.</div><label>JS DEX total</label><input id="v17BlueSave" type="number"><label>Total des 2d6</label><input id="v17SpiritDamage" type="number" min="2" max="12"><button class="good" onclick="finishDragonBlueFireV17(${die})">Résoudre</button>`);}
      if(die<=6){if(blue){blue.auto=blue.auto||{};blue.auto.rechargeReady=true;blue.auto.breathReady=true;}logEvent(`Esprits draconiques d10=${die} — Eldenemir : souffle rechargé`);saveAll();closeModal();renderFighters();return;}
      if(die<=8){logEvent(`Esprits draconiques d10=${die} — Sharruth : résolution en cours`);return modal('Sharruth — fureur',`<div class="combat">Chaque PJ effectue un JS Dextérité DD 12. Échec : 1d6 feu.</div><label>Résultat commun du d6 feu</label><input id="v17SpiritD6" type="number" min="1" max="6">${pjs.map(f=>`<label>${esc(f.name)} — JS DEX</label><input id="v17SpiritSave_${esc(f.id)}" type="number">`).join('')}<button class="good" onclick="finishDragonPartyFireV17(${die})">Appliquer à chaque PJ</button>`);}
      allies.forEach(f=>addCond(f,'Avantage des esprits',{duration:'prochaine initiative 0'}));logEvent(`Esprits draconiques d10=${die} — Turadaer : avantage appliqué`);saveAll();closeModal();renderFighters();
    }catch(e){alert(e.message);}
  };
  window.finishDragonHealV17=function(die){try{const n=intVal('v17SpiritD4',1,4,'d4')+4;fighters.filter(f=>f.kind==='pj'||f.ref==='dragonnet-bronze').forEach(f=>healHP(f,n,'Astalagan'));logEvent(`Esprits draconiques d10=${die} — Astalagan : ${n} PV rendus`);saveAll();closeModal();renderFighters();}catch(e){alert(e.message);}};
  window.finishDragonBlueFireV17=function(die){try{const blue=fighters.find(f=>f.ref==='dragonnet-bleu'),sv=numberVal('v17BlueSave',-20,'JS DEX'),d=numberVal('v17SpiritDamage',2,'2d6');if(sv<12&&blue)applyHP(blue,d,'feu',false,'Clyssavar');logEvent(`Esprits draconiques d10=${die} — Clyssavar : JS ${sv} ${sv<12?'raté':'réussi'}`);saveAll();closeModal();renderFighters();}catch(e){alert(e.message);}};
  window.finishDragonPartyFireV17=function(die){try{const d=intVal('v17SpiritD6',1,6,'d6');fighters.filter(f=>f.kind==='pj').forEach(f=>{const sv=numberVal(`v17SpiritSave_${f.id}`,-20,`JS de ${f.name}`);if(sv<12)applyHP(f,d,'feu',false,'Sharruth');});logEvent(`Esprits draconiques d10=${die} — Sharruth : dégâts individuels appliqués`);saveAll();closeModal();renderFighters();}catch(e){alert(e.message);}};
  window.V17_ENGINE={consume,applyHP,healHP,addCond,delCond,EFFECTS};
})();
</script>

<style>
.xpPanel{border:2px solid #7559e8;background:linear-gradient(135deg,#17152a,#201a3d);box-shadow:0 10px 28px #0005}
.xpTop{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.xpLevel{font-size:1.05rem;font-weight:1000}.xpNumbers{font-weight:900;color:#ddd5ff}.xpBar{height:16px;border:1px solid #7068a0;border-radius:999px;background:#0d0c17;overflow:hidden;margin:9px 0}.xpFill{height:100%;background:linear-gradient(90deg,#6c4ee8,#28c7a5);transition:width .25s}.xpMeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem}.xpStatus{font-weight:900}.xp-normal{color:#8de59d}.xp-avance{color:#ffd166}.xp-retard{color:#8cc8ff}.xp-forte{color:#ff8b83}.xpActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.xpHistoryRow{border-bottom:1px solid var(--line);padding:8px 0}.xpHistoryRow:last-child{border-bottom:0}.xpBadge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:.7rem;margin-right:4px}.xpWin{border:2px solid var(--green);padding:12px;border-radius:12px;background:#102218}.xpWarn{border:1px solid #b97a26;padding:9px;border-radius:9px;background:#2b2112}
</style>
<script>
/* V18 — XP fantôme dynamique pilotée par milestones.
   Les XP de référence servent uniquement de poids relatif. La fin de zone reste une décision du MJ. */
(()=>{
 'use strict';
 const KEY='mj_xp_ghost_v18';
 const CR_XP={'0':10,'1/8':25,'1/4':50,'1/2':100,'1':200,'2':450,'3':700,'4':1100,'5':1800,'13':10000};
 const ZONE={
  prologue:'Prologue personnalisé',prelude:'Avant la première grande zone',
  poussemers:'Grottes de Poussemer',epave:'Épave maudite / Rose des Vents',observatoire:'Observatoire de la falaise'
 };
 const ENCOUNTER_ZONE={
  prologue:'prologue',marins:'prelude','sources-chaudes':'prelude',hibours:'prelude','kobolds-renegats':'prelude',
  'b1-pieuvre':'poussemers','b2-thallophytes':'poussemers','b3-striges':'poussemers','b4-myconides':'poussemers','b5-sanctuaire':'poussemers','b6-arrivee':'poussemers','b6-cristal':'poussemers',
  'c4-zombis':'epave','c8-morts':'epave','harpies-retour':'epave',
  'd2-rotonde':'observatoire','d3-camp':'observatoire','d5-vrilleclair':'observatoire',rituel:'observatoire'
 };
 const OFFICIAL_BY_ZONE={
  poussemers:['b1-pieuvre','b2-thallophytes','b3-striges','b4-myconides','b5-sanctuaire','b6-arrivee','b6-cristal'],
  epave:['c4-zombis','c8-morts','harpies-retour'],
  observatoire:['d2-rotonde','d3-camp','d5-vrilleclair','rituel']
 };
 const now=()=>new Date().toISOString();
 const fresh=()=>({version:18,xp:0,level:1,threshold:300,closedZones:[],activeZone:null,history:[],encounters:{},combat:null,lastUndo:null,warning:'NORMALE',order:0});
 function read(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.version===18?Object.assign(fresh(),x):fresh();}catch(e){return fresh();}}
 let X=read();
 function persist(){localStorage.setItem(KEY,JSON.stringify(X));}
 function currentThreshold(){return X.closedZones.length===0?300:X.closedZones.length===1?900:null;}
 function syncLevel(){X.threshold=currentThreshold();X.level=Math.min(3,1+X.closedZones.length);}
 function refXP(id){const m=monster(id);return CR_XP[String(m?.fp??'0')]??10;}
 function compositionFromFighters(){const counts={};fighters.filter(f=>f.kind!=='pj'&&(f.faction||'hostile')==='hostile'&&f.ref).forEach(f=>counts[f.ref]=(counts[f.ref]||0)+1);return Object.entries(counts).map(([id,qty])=>({id,qty}));}
 function weight(comp){return (comp||[]).reduce((n,x)=>n+refXP(x.id)*Math.max(0,Number(x.qty)||0),0);}
 function encounterById(id){return data.encounters.find(e=>e.id===id);}
 function variantComposition(e,key){return e?.variants?.[key]||e?.monsters||[];}
 function defaultVariant(e){if(!e)return[];if(!e.variants)return e.monsters||[];const key=Object.keys(e.variants).find(k=>String(k).startsWith(String(X.level)))||Object.keys(e.variants)[0];return e.variants[key]||[];}
 function remainingOfficialWeight(zone,currentId){if(!zone||!OFFICIAL_BY_ZONE[zone])return 0;return OFFICIAL_BY_ZONE[zone].filter(id=>id!==currentId&&!['played','avoided'].includes(X.encounters[id]?.status)).reduce((n,id)=>n+weight(defaultVariant(encounterById(id))),0);}
 function plannedWeight(currentId,currentWeight){let zone=X.activeZone||ENCOUNTER_ZONE[currentId];if(zone==='prologue'||zone==='prelude'||!zone){const pre=(X.encounters.marins?.status?'':weight(defaultVariant(encounterById('marins'))));const zoneAverage=(remainingOfficialWeight('poussemers')+remainingOfficialWeight('epave'))/2;return Math.max(0,pre+zoneAverage);}return Math.max(0,remainingOfficialWeight(zone,currentId));}
 function trajectory(){const t=currentThreshold();if(t===null)return{label:'CAMPAGNE NIVEAU 3',cls:'normal'};const remaining=t-X.xp;const pressure=X.history.filter(h=>h.kind==='combat'&&h.after>=t*.78).length;let label='NORMALE',cls='normal';if(remaining<=Math.max(8,Math.round(t*.03)))label='FORTEMENT EN AVANCE',cls='forte';else if(pressure>2)label='EN AVANCE',cls='avance';else if(X.activeZone&&X.xp<(t===300?45:390))label='EN RETARD',cls='retard';X.warning=label;return{label,cls};}
 function naturalFactor(id){let h=0;for(const c of String(id||'improvisee'))h=(h*31+c.charCodeAt(0))>>>0;return .96+(h%9)/100;}
 function awardFor(comp,id){const t=currentThreshold();if(t===null)return 0;const budget=Math.max(0,t-X.xp),reserve=t===300?20:45;if(budget<=reserve)return 0;const w=Math.max(1,weight(comp)),future=plannedWeight(id,w),distributable=Math.max(0,budget-reserve);let raw=distributable*(w/(w+future))*naturalFactor(id);let min=Math.min(distributable,Math.max(1,Math.round(Math.sqrt(w)/3)));let val=Math.round(Math.max(min,Math.min(distributable,raw)));return Math.max(0,Math.min(budget-1,val));}
 function compositionText(comp){return(comp||[]).map(x=>`${monster(x.id)?.name||x.id} ×${x.qty}`).join(', ')||'Composition non référencée';}
 function zoneFor(id){return ENCOUNTER_ZONE[id]||X.activeZone||'prelude';}
 function beginCombat(id=null,variant=null,name=null,official=false){const comp=compositionFromFighters();const zone=zoneFor(id);if((zone==='poussemers'||zone==='epave')&&!X.closedZones.includes(zone))X.activeZone=zone;X.combat={uid:`xp_${Date.now()}_${Math.random().toString(16).slice(2)}`,encounterId:id,variant,name:name||'Rencontre improvisée',official:!!official,zone,composition:comp,weight:weight(comp),awarded:false,abandoned:false,startedAt:now()};persist();renderXP();}
 function snapshot(){return JSON.parse(JSON.stringify(X));}
 function recordCombat(){if(!X.combat||X.combat.awarded||X.combat.abandoned)return null;const comp=compositionFromFighters();if(comp.length)X.combat.composition=comp;X.combat.weight=weight(X.combat.composition);const gain=awardFor(X.combat.composition,X.combat.encounterId);const before=X.xp,after=before+gain;X.lastUndo=snapshot();X.xp=after;X.combat.awarded=true;X.order++;const h={id:`h_${Date.now()}`,kind:'combat',order:X.order,date:now(),zone:ZONE[X.combat.zone]||X.combat.zone,zoneId:X.combat.zone,encounter:X.combat.name,encounterId:X.combat.encounterId,official:X.combat.official,composition:X.combat.composition,compositionText:compositionText(X.combat.composition),referenceWeight:X.combat.weight,dynamicXp:gain,before,after};X.history.push(h);if(X.combat.encounterId)X.encounters[X.combat.encounterId]={status:'played',at:now(),weight:X.combat.weight};syncLevel();persist();renderXP();return h;}
 function victory(){if(!X.combat)return info('XP de combat','Aucun combat suivi. Charge une rencontre ou lance un combat improvisé.');if(X.combat.awarded)return info('XP déjà attribuée','Cette rencontre a déjà été comptée. Aucune double attribution possible.');const h=recordCombat();if(!h)return;const t=currentThreshold();modal('VICTOIRE — XP automatique',`<div class="xpWin"><h2>XP gagnée par personnage : +${h.dynamicXp}</h2><p>Avant : <b>${h.before}${t?' / '+t:''}</b></p><p>Après : <b>${h.after}${t?' / '+t:''}</b></p><p>${t?Math.max(0,t-h.after)+' XP avant le niveau suivant':'Niveau 3 de campagne atteint'}</p></div><button class="good" onclick="closeModal();renderXP()">CONTINUER</button>`);}
 function abandon(){if(!X.combat||X.combat.awarded)return info('Abandon','Aucun combat actif non attribué.');if(!confirm('Abandonner ce combat ? Aucune XP ne sera attribuée.'))return;X.combat.abandoned=true;X.order++;X.history.push({id:`h_${Date.now()}`,kind:'abandon',order:X.order,date:now(),zone:ZONE[X.combat.zone]||X.combat.zone,encounter:X.combat.name,dynamicXp:0,before:X.xp,after:X.xp});persist();renderXP();}
 function markAvoided(id){const e=encounterById(id);if(!e)return;if(!confirm(`Marquer « ${e.name} » comme évitée/supprimée ?`))return;X.encounters[id]={status:'avoided',at:now()};X.order++;X.history.push({id:`h_${Date.now()}`,kind:'evitee',order:X.order,date:now(),zone:ZONE[ENCOUNTER_ZONE[id]]||'Campagne',encounter:e.name,dynamicXp:0,before:X.xp,after:X.xp});persist();renderXP();renderEncounters();}
 function finishZoneAsk(){const zone=X.activeZone;if(!['poussemers','epave'].includes(zone))return info('Terminer la zone','Charge d’abord une rencontre de Poussemer ou de l’Épave.');if(X.closedZones.includes(zone))return info('Zone déjà terminée',`${ZONE[zone]} est déjà clôturée.`);const t=currentThreshold();if(t===null)return info('Progression terminée','Les deux milestones officiels sont déjà validés.');const ratio=X.xp/t;const diagnostic=ratio>=.82?'TRAJECTOIRE NORMALE':ratio>=.55?'FIN ANTICIPÉE':'FIN TRÈS ANTICIPÉE';modal(`TERMINER ${ZONE[zone].toUpperCase()}`,`<div class="${ratio<.82?'xpWarn':'xpWin'}"><b>${diagnostic}</b><p>XP actuelle : <b>${X.xp} / ${t}</b></p><p>Complément de conclusion : <b>+${t-X.xp} XP/PJ</b></p><p>Le logiciel n’empêche jamais le MJ de clôturer.</p></div><button class="good" onclick="confirmFinishZoneV18()">CONFIRMER LA FIN DE ZONE</button><button onclick="closeModal()">Annuler</button>`);}
 function confirmFinishZone(){const zone=X.activeZone,t=currentThreshold();if(!zone||t===null||X.closedZones.includes(zone))return;const before=X.xp,gain=t-before;X.lastUndo=snapshot();X.xp=t;X.closedZones.push(zone);X.order++;X.history.push({id:`h_${Date.now()}`,kind:'milestone',order:X.order,date:now(),zone:ZONE[zone],zoneId:zone,encounter:`Conclusion de ${ZONE[zone]}`,official:true,composition:[],compositionText:'Milestone validé manuellement',referenceWeight:0,dynamicXp:gain,before,after:t});X.activeZone=X.closedZones.length===1?(zone==='poussemers'?'epave':'poussemers'):null;syncLevel();persist();closeModal();renderXP();modal(`NIVEAU ${X.level}`,`<div class="xpWin"><h2>${t} XP/PJ atteints exactement</h2><p>${gain?`+${gain} XP de conclusion.`:'Aucun reliquat nécessaire.'}</p><p>${X.level<3?'La progression suivante est ouverte.':'Les deux milestones officiels sont validés. Aucun palier supplémentaire n’est inventé.'}</p></div><button class="good" onclick="closeModal()">CONTINUER</button>`);}
 function undo(){if(!X.lastUndo)return info('Annulation XP','Aucune attribution récente à annuler.');if(!confirm('Annuler exactement la dernière attribution XP ou clôture de zone ?'))return;const previous=X.lastUndo;X=Object.assign(fresh(),previous);X.lastUndo=null;persist();renderXP();}
 function history(){const rows=X.history.slice().reverse().map(h=>`<div class="xpHistoryRow"><span class="xpBadge">${esc(h.kind)}</span><b>${esc(h.zone||'Campagne')}</b><br>${esc(h.encounter||'Opération')}<br><span class="mini">${esc(h.compositionText||'')} ${h.referenceWeight?`· poids officiel ${h.referenceWeight}`:''}</span><br><b>${h.dynamicXp>0?'+':''}${h.dynamicXp} XP/PJ</b> · ${h.before} → ${h.after}</div>`).join('');modal('Historique XP persistant',rows||'<p>Aucune opération XP.</p>');}
 function renderXP(){syncLevel();const t=currentThreshold(),traj=trajectory(),pct=t?Math.min(100,Math.round(X.xp/t*100)):100,remaining=t?Math.max(0,t-X.xp):0;const html=`<div class="card xpPanel" id="xpPanel"><div class="xpTop"><span class="xpLevel">NIVEAU ${X.level}</span><span class="xpNumbers">${X.xp}${t?' / '+t+' XP':' XP — campagne'}</span></div><div class="xpBar"><div class="xpFill" style="width:${pct}%"></div></div><div class="xpMeta"><span>${t?remaining+' XP avant niveau '+(X.level+1):'Milestones officiels terminés'}</span><span>TRAJECTOIRE XP : <b class="xpStatus xp-${traj.cls}">${traj.label}</b></span></div><div class="xpActions"><button onclick="xpHistoryV18()">Historique XP</button><button onclick="undoXPV18()">Annuler dernière attribution</button><button class="good" onclick="finishZoneV18()">TERMINER LA ZONE</button></div></div>`;['home','combat'].forEach(id=>{const s=document.getElementById(id);if(!s)return;let old=s.querySelector(':scope > #xpPanel');if(old)old.outerHTML=html;else s.insertAdjacentHTML('afterbegin',html);});let ctl=document.getElementById('xpCombatControls');const active=X.combat&&!X.combat.awarded&&!X.combat.abandoned;if(!ctl){const col=document.getElementById('activeColumn');if(col){col.insertAdjacentHTML('afterbegin','<div class="card" id="xpCombatControls"></div>');ctl=document.getElementById('xpCombatControls');}}if(ctl)ctl.innerHTML=active?`<b>XP suivie : ${esc(X.combat.name)}</b><div class="xpActions"><button class="good" onclick="finishCombatXPV18()">🏆 Terminer en victoire</button><button class="danger" onclick="abandonCombatXPV18()">Abandonner sans XP</button></div>`:'<span class="mini">L’XP sera suivie automatiquement au prochain combat.</span>';}
 function addAvoidButtons(){document.querySelectorAll('#encounterList .card').forEach(card=>{const btn=card.querySelector('button[onclick^="loadEncounter"]');if(!btn||card.querySelector('.xpAvoid'))return;const m=btn.getAttribute('onclick').match(/loadEncounter\('([^']+)'/);if(!m)return;const id=m[1],status=X.encounters[id]?.status;btn.insertAdjacentHTML('afterend',`<button class="xpAvoid" onclick="markEncounterAvoidedV18('${id}')">${status==='avoided'?'✓ Évitée':'Éviter / supprimer'}</button>`);});}
 const oldLoad=window.loadEncounter;window.loadEncounter=function(id,variant){oldLoad(id,variant);const e=encounterById(id);beginCombat(id,variant,e?.name,true);};
 const oldStart=window.startCombat;window.startCombat=function(){oldStart();if(!X.combat||X.combat.awarded||X.combat.abandoned)beginCombat(null,null,'Rencontre improvisée',false);else{X.combat.composition=compositionFromFighters();X.combat.weight=weight(X.combat.composition);persist();renderXP();}};
 const oldRenderEnc=window.renderEncounters;window.renderEncounters=function(){oldRenderEnc();addAvoidButtons();};
 const oldRenderAll=window.renderAll;window.renderAll=function(){oldRenderAll();renderXP();};
 const oldRenderFightersXP=window.renderFighters;window.renderFighters=function(){oldRenderFightersXP();if(X.combat&&!X.combat.awarded&&!X.combat.abandoned){X.combat.composition=compositionFromFighters();X.combat.weight=weight(X.combat.composition);persist();renderXP();const hostile=fighters.filter(f=>f.kind!=='pj'&&(f.faction||'hostile')==='hostile'&&f.ref);const pending=hostile.some(f=>f.pending?.type==='undeadFortitude');if(combatStarted&&hostile.length&&!pending&&hostile.every(f=>Number(f.pv)<=0)&&!X.combat.victoryPrompted){X.combat.victoryPrompted=true;persist();setTimeout(()=>{if(X.combat&&!X.combat.awarded&&!X.combat.abandoned)victory();},0);}}};
 window.finishCombatXPV18=victory;window.abandonCombatXPV18=abandon;window.finishZoneV18=finishZoneAsk;window.confirmFinishZoneV18=confirmFinishZone;window.undoXPV18=undo;window.xpHistoryV18=history;window.markEncounterAvoidedV18=markAvoided;
 window.XP_GHOST_V18={getState:()=>JSON.parse(JSON.stringify(X)),reset:()=>{X=fresh();persist();renderXP();},refXP,weight,awardFor,beginCombat,recordCombat,markAvoided:(id)=>{X.encounters[id]={status:'avoided',at:now()};persist();},finishZone:confirmFinishZone,undo,compositionFromFighters,remainingOfficialWeight,currentThreshold};
 if(!data.encounters.some(e=>e.id==='prologue'))data.encounters.unshift({id:'prologue',name:'Prologue personnalisé — Attaque du cratère',where:'La Cicatrice du Ciel — prologue',page:'Carnet MJ',desc:'Rencontre personnalisée du cratère. Ajuste les zombis réellement engagés avant de lancer : le poids XP suivra automatiquement la composition jouée.',monsters:[{id:'zombie',qty:3,name:'Zombi du cratère'}],tips:'Trois zombis sont préchargés comme base prudente ; ajoute ou retire les renforts réellement utilisés avant le lancement.'});
 persist();renderEncounters();renderXP();
})();
</script>
