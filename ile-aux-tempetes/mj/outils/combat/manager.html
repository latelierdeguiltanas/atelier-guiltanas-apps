<style>
:root{--bg:#0f141b;--panel:#182331;--panel2:#223348;--panel3:#101820;--ink:#f5ead8;--muted:#bac5cf;--gold:#d6ad57;--red:#d96a62;--green:#78c887;--blue:#72b7dd;--line:#33465a;--violet:#b693e6;--orange:#e69b48}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.36}
header{position:sticky;top:0;z-index:30;background:#0f141bf7;border-bottom:1px solid var(--line);padding:10px;backdrop-filter:blur(8px)}.title{font-weight:900;font-size:1rem}.sub{font-size:.78rem;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;margin-top:8px}
button,.btn{border:1px solid var(--line);background:#213044;color:var(--ink);border-radius:9px;padding:8px 10px;font-weight:800;min-height:38px}button.on,.btn.on{background:var(--gold);color:#111}button.danger{background:#5a2424}button.good{background:#214b2b}button.blue{background:#17334d}button.ghost{background:#111b23}button.small{font-size:.76rem;padding:4px 7px;min-height:28px}
main{padding:10px;max-width:1120px;margin:auto}.page{display:none}.page.on{display:block}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:9px 0}.subcard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;margin:7px 0}
h2,h3,h4{margin:0 0 8px;color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:8px}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:.75rem;margin:2px;color:#fff;background:#111b23}.mini{font-size:.8rem;color:var(--muted)}.tiny{font-size:.72rem;color:var(--muted)}
select,input,textarea{width:100%;background:#111b23;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px;margin:4px 0}textarea{min-height:70px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:end}.row>*{flex:1}.row.tight>*{flex:0 0 auto}.layout{display:grid;grid-template-columns:330px 1fr;gap:10px}@media(max-width:850px){.layout{grid-template-columns:1fr}}
.fighter{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px;margin:8px 0;position:relative}.fighter.active{outline:3px solid var(--gold);box-shadow:0 0 18px rgba(214,173,87,.25)}.fighter.dead{opacity:.68;border-color:#733}.fighter.pj{border-left:5px solid var(--blue)}.fighter.monster{border-left:5px solid var(--red)}.hp{font-weight:900}.bar{height:8px;border-radius:999px;background:#0b1117;border:1px solid var(--line);overflow:hidden;margin:6px 0}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#78c887,#d6ad57,#d96a62);width:100%}
.read{background:#efe9cc;color:#101820;border-left:5px solid var(--gold);padding:10px;border-radius:8px;margin:8px 0}.dm{background:#25213a;border-left:5px solid var(--violet);padding:10px;border-radius:8px;margin:8px 0}.combat{background:#351d1d;border-left:5px solid var(--red);padding:10px;border-radius:8px;margin:8px 0}.goodbox{background:#1e3325;border-left:5px solid var(--green);padding:10px;border-radius:8px;margin:8px 0}.warnbox{background:#392515;border-left:5px solid var(--orange);padding:10px;border-radius:8px;margin:8px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:99}.modal.on{display:flex}.modalbox{width:96%;max-width:920px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:10px;position:sticky;top:0;background:var(--panel);z-index:2}.modalbody{padding:10px}.listbtn{display:block;width:100%;text-align:left;margin:6px 0;background:#202c38}.smallStats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.smallStats div{background:#111b23;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center}
.token{width:64px;height:64px;border-radius:16px;background:linear-gradient(145deg,#26394f,#101820);display:flex;align-items:center;justify-content:center;font-size:2rem;border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden;flex:0 0 auto}.token img{width:100%;height:100%;object-fit:cover}.token.big{width:160px;height:160px;font-size:4rem;border-radius:22px}.headrow{display:flex;gap:10px;align-items:center}.cond{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.cond button{font-size:.73rem;padding:4px 6px;min-height:0}.cond button.set{background:var(--gold);color:#111}.condHelp{background:#111b23;border:1px dashed var(--line);border-radius:8px;padding:7px;margin-top:6px}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:5px}.target{border:1px solid var(--line);background:#111b23;border-radius:9px;padding:7px}.target.selected{outline:2px solid var(--gold)}.log{max-height:260px;overflow:auto;background:#0b1117;border:1px solid var(--line);border-radius:9px;padding:8px}.log div{border-bottom:1px solid rgba(255,255,255,.07);padding:4px 0}.pending{border:2px solid var(--orange);background:#2d2115}details{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;margin:8px 0;padding:8px}summary{cursor:pointer;font-weight:900;color:#fff}
.combatLive #prepColumn,.combatLive #bulkActionCard{display:none}.combatLive #combatLayout{grid-template-columns:1fr}.toolbar{position:sticky;top:82px;z-index:20;background:#101820e8;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;backdrop-filter:blur(8px)}.hit{color:var(--green);font-weight:900}.miss{color:var(--red);font-weight:900}.fieldmini{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.fieldmini input,.fieldmini select{font-size:.82rem;padding:6px}.playerSetup{display:grid;grid-template-columns:1.6fr .7fr .7fr .7fr;gap:5px;align-items:center}.actionPanel{background:#101820;border:1px solid var(--line);border-radius:10px;padding:8px;margin-top:8px}.abilityBtn{display:block;width:100%;text-align:left;margin:4px 0;background:#2c2336}

/* V4.1 — ergonomie combat live */
.combatLive .card:has(#fighters){padding:8px}.combatLive .card:has(#combatLog){display:none}
.liveBoard{display:grid;grid-template-columns:1.05fr 1.4fr;gap:10px;align-items:start;min-width:0}.liveBoard>*{min-width:0}.liveTop{position:sticky;top:146px;z-index:18;background:#101820f2;border:1px solid var(--line);border-radius:14px;padding:8px;margin-bottom:8px;box-shadow:0 8px 18px rgba(0,0,0,.25);max-width:100%;overflow:hidden}
.liveTurn{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}.liveTurn>div:first-child{min-width:0}.liveTurnName,.liveTurnMeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.liveTurnName{font-size:1.05rem;font-weight:950;color:var(--gold)}.liveTurnMeta{font-size:.78rem;color:var(--muted)}
.initStrip{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 1px 2px;margin-top:6px;width:100%;max-width:100%;min-width:0;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x}.initChip{flex:0 0 auto;min-width:84px;border:1px solid var(--line);border-radius:999px;background:#111b23;padding:5px 8px;font-size:.78rem;color:var(--ink);text-align:left}.initChip.active{background:var(--gold);color:#111;border-color:var(--gold)}.initChip.dead{opacity:.45;text-decoration:line-through}.initChip.pj{border-left:5px solid var(--blue)}.initChip.monster{border-left:5px solid var(--red)}
.activeBox{background:linear-gradient(180deg,#223348,#182331);border:2px solid var(--gold);border-radius:14px;padding:10px;box-shadow:0 0 22px rgba(214,173,87,.18)}.activeBox h2{font-size:1rem}.activeControls{display:grid;grid-template-columns:1fr 1fr;gap:6px}.activeControls input,.activeControls select{margin:0}.activeControls .wide{grid-column:1/-1}.quickTargets{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:5px;margin:6px 0}.quickTargets button{min-height:32px;padding:5px;font-size:.78rem}.quickTargets button.on{background:var(--gold);color:#111}.quickResult{min-height:22px;font-size:.82rem;margin-top:4px}
.liveSide{display:flex;flex-direction:column;gap:8px}.pjBar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.pjMini{background:#132235;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:6px;min-height:58px}.pjMini.active{outline:2px solid var(--gold)}.pjMiniName{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pjMini input{padding:3px;margin:2px 0;font-size:.78rem}.pjState{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mobGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px;min-width:0}.mobCard{background:#1d2b3b;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:12px;padding:7px}.mobCard.active{outline:2px solid var(--gold)}.mobCard.dead{opacity:.55}.mobHead{display:flex;gap:7px;align-items:center}.mobHead .token{width:42px;height:42px;font-size:1.4rem;border-radius:12px}.mobTitle{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mobStats{display:flex;gap:4px;flex-wrap:wrap}.mobStats span{font-size:.7rem;border:1px solid var(--line);background:#0f141b;border-radius:999px;padding:1px 5px}.mobApply{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}.mobApply input,.mobApply select{padding:5px;margin:0;font-size:.78rem}.mobApply button{grid-column:1/-1;min-height:30px;padding:5px}.miniCond{display:flex;gap:3px;overflow:auto;margin-top:5px}.miniCond button{flex:0 0 auto;font-size:.66rem;padding:3px 5px;min-height:22px}.mobActions details{padding:5px;margin:5px 0}.mobActions summary{font-size:.78rem}.mobActions button{width:100%;text-align:left;font-size:.74rem;padding:5px;margin:3px 0;min-height:28px}.compactCondHelp{font-size:.72rem;background:#101820;border:1px dashed var(--line);border-radius:8px;padding:5px;margin-top:4px}.liveLog{max-height:135px;overflow:auto;background:#0b1117;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:.76rem}.liveLog div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.06)}
@media(max-width:900px){.liveBoard{grid-template-columns:1fr}.liveTop{top:132px}.pjBar{grid-template-columns:repeat(2,1fr)}.mobGrid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.liveTop{top:126px}.liveTurn{display:grid;grid-template-columns:1fr auto auto}.mobGrid{grid-template-columns:1fr}.activeControls{grid-template-columns:1fr 1fr}.pjBar{grid-template-columns:repeat(2,1fr)}.toolbar .row{grid-template-columns:1fr 1fr}.initChip{min-width:74px;font-size:.72rem}}

@media(max-width:600px){main{padding:8px}.row{display:grid;grid-template-columns:repeat(2,1fr)}.row.one{display:block}.smallStats{grid-template-columns:repeat(2,1fr)}.token{width:52px;height:52px;font-size:1.7rem}.token.big{width:130px;height:130px}.tabs button{padding:7px 8px}}

/* V4.3 — correctif mobile/carrousel : aucun débordement horizontal, bandeau initiative réellement scrollable */
html,body{width:100%;max-width:100vw;overflow-x:hidden!important}
main,#combat,#combatLayout,#activeColumn,#fighters,.card,.liveTop,.liveBoard,.liveSide,.activeBox{max-width:100%;min-width:0!important;overflow-wrap:anywhere}
.combatLive main{width:100%;max-width:100vw;padding-left:6px;padding-right:6px}
.combatLive #combatLayout{display:block!important;width:100%;max-width:100%;min-width:0!important}
.combatLive #activeColumn{width:100%;max-width:100%;min-width:0!important}
.combatLive #activeColumn>.card{padding:6px;margin:6px 0;overflow:hidden}
.stripShell{display:grid;grid-template-columns:34px minmax(0,1fr) 34px;gap:5px;align-items:center;width:100%;max-width:100%;min-width:0;margin-top:6px}
.stripBtn{min-width:0!important;min-height:34px!important;padding:4px 6px!important;border-radius:10px!important}
.initStrip{display:flex!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;width:100%!important;max-width:100%!important;min-width:0!important;padding:6px 2px 8px!important;scroll-snap-type:x proximity;scrollbar-width:thin;contain:inline-size;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x!important}
.initChip{flex:0 0 82px!important;min-width:82px!important;max-width:82px!important;scroll-snap-align:start;white-space:normal!important;overflow:hidden!important;text-overflow:ellipsis!important;padding:5px 6px!important;line-height:1.08!important}
.initChip b,.initChip span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.liveTop{position:sticky;top:112px;z-index:22;overflow:hidden!important;width:100%;max-width:100%;padding:7px;margin:0 0 8px}
.liveTurn{grid-template-columns:minmax(0,1fr) auto auto!important;max-width:100%}.liveTurn button{min-width:40px;padding:5px 7px}
.liveTurnName{font-size:.98rem}.liveTurnMeta{font-size:.72rem}
.liveBoard{display:block!important;width:100%;max-width:100%;min-width:0!important}.liveBoard>div{min-width:0!important;max-width:100%}
.liveSide{width:100%;max-width:100%;min-width:0!important}.pjBar{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.pjMini{padding:5px;min-width:0}.pjMini .pill{max-width:100%}.pjMini input{width:46px!important;max-width:46px!important}
.mobGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:6px;min-width:0!important;width:100%;max-width:100%}.mobCard{min-width:0!important;padding:6px;overflow:hidden}.mobHead{min-width:0}.mobTitle{font-size:.86rem}.mobStats span{font-size:.66rem}.mobApply{grid-template-columns:1fr 1fr;gap:4px}.mobApply input,.mobApply select{min-width:0;width:100%;font-size:.74rem;padding:5px}.mobApply .target{font-size:.7rem;padding:4px}.mobApply button{font-size:.75rem;padding:5px;min-height:28px}
.quickTargets{grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:4px}.quickTargets button{min-width:0!important;max-width:100%;overflow:hidden;font-size:.72rem;line-height:1.1}.activeControls{grid-template-columns:1fr 1fr!important;gap:5px}.activeControls input,.activeControls select{min-width:0;font-size:.78rem;padding:6px}.activeBox{padding:8px;overflow:hidden}.activeBox h2{font-size:.95rem}.mobStats{gap:3px}.mobStats span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.liveLog{max-height:92px}.toolbar{top:73px;z-index:25;padding:6px;overflow:hidden}.toolbar .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.toolbar button{font-size:.75rem;padding:6px 5px;min-width:0}
@media(max-width:700px){header{padding:8px}.tabs{gap:4px}.tabs button{font-size:.74rem;padding:6px 7px;min-width:auto}.sub{display:none}.liveTop{top:104px}.pjBar{grid-template-columns:repeat(2,minmax(0,1fr))}.mobGrid{grid-template-columns:repeat(2,minmax(0,1fr))}.initChip{flex-basis:76px!important;min-width:76px!important;max-width:76px!important;font-size:.68rem}.activeControls{grid-template-columns:1fr 1fr!important}.activeControls .wide{grid-column:1/-1}.mobApply{grid-template-columns:1fr 1fr}.mobCard .token{width:34px!important;height:34px!important;font-size:1.15rem!important;border-radius:10px}.mobTitle{font-size:.8rem}.stripShell{grid-template-columns:30px minmax(0,1fr) 30px}.stripBtn{min-height:30px!important;padding:3px!important}.liveTurnName{font-size:.9rem}.liveTurnMeta{display:none}}
@media(max-width:420px){.mobGrid{grid-template-columns:1fr}.quickTargets{grid-template-columns:repeat(2,minmax(0,1fr))}.initChip{flex-basis:72px!important;min-width:72px!important;max-width:72px!important}.toolbar .row{grid-template-columns:1fr 1fr}.pjBar{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* V4.4 — retour calcul visible et persistant */
.resultBanner{border:1px solid var(--line);border-radius:12px;padding:8px;margin:0 0 8px;background:#101820;font-size:.86rem;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.resultBanner.hitBox{border-left:5px solid var(--green);background:#12261a}.resultBanner.missBox{border-left:5px solid var(--red);background:#2a1515}.resultBanner.infoBox{border-left:5px solid var(--gold)}
.calcLine{font-weight:900}.calcSub{font-size:.75rem;color:var(--muted);margin-top:2px}.mobCard.flash,.activeBox.flash{animation:flashCalc 1.2s ease-out 1}@keyframes flashCalc{0%{box-shadow:0 0 0 3px var(--gold)}100%{box-shadow:none}}
@media(max-width:700px){.resultBanner{font-size:.78rem;padding:7px}.calcSub{font-size:.7rem}}


/* V4.5 — attaque en deux temps : cible verrouillée */
.lockedTarget{border:2px solid var(--gold);border-radius:12px;background:#151f2a;padding:10px;margin:8px 0;font-size:.95rem}
.activeControls button.wide{grid-column:1/-1}
.quickTargets button.on{background:var(--gold)!important;color:#111!important;border-color:var(--gold)!important;box-shadow:0 0 0 2px rgba(214,173,87,.28)}


/* V4.6 — ciblage fiable + remise à zéro rencontre */
.quickTargets button{cursor:pointer}
.quickTargets button.on::before{content:"🎯 ";font-weight:900}


/* V4.7 — ciblage renforcé : bouton + menu déroulant fiable */
.targetSelectRow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin:8px 0}
.targetSelectRow select{margin:0;min-width:0}
.targetSelectRow button{min-height:38px;white-space:nowrap}
.targetHint{border:1px dashed var(--gold);background:#1a2230;border-radius:10px;padding:7px;margin:6px 0;font-size:.78rem;color:var(--ink)}
.quickTargets button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.quickTargets button.on{transform:translateY(-1px)}
@media(max-width:520px){.targetSelectRow{grid-template-columns:1fr}.targetSelectRow button{width:100%}}



/* V5.3 — combat compact réel : pas de doublons lourds, PJ éditables en modal, monstres allégés */
.combatLive #activeColumn > .card:nth-of-type(2){display:none!important}
.combatLive #activeColumn > .card:first-child > h2,
.combatLive #activeColumn > .card:first-child > p.mini{display:none!important}
.editHint{font-size:.66rem;color:var(--gold);margin-top:2px}
.pjMini{cursor:pointer}
.mobActions details .longText{display:none!important}
.activeBox .goodbox,.activeBox .warnbox{display:none!important}
.powerRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:5px;margin-top:6px}
.powerRow button{min-height:32px;font-size:.76rem;padding:5px}
.monsterTurnActions{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:5px;margin:8px 0}
.monsterTurnActions button{font-size:.76rem;padding:6px;min-height:34px}
.targetPick{display:grid;grid-template-columns:1fr;gap:6px}
.targetPick button{width:100%;text-align:left}
.combatLive .editHint{display:none!important}
.combatLive .pjMini{min-height:42px;padding:5px}
.combatLive .pjMiniName{font-size:.82rem}
.combatLive .pjState{font-size:.68rem}


/* V5.5 — en combat les PJ ne sont plus éditables au clic, seulement sélection de tour */
.combatLive .pjMini{cursor:pointer}
.combatLive .initChip.pj{cursor:pointer}
.combatLive .editHint{display:none!important}


/* V6.2 — hiérarchie combat : tour actif > monstres > PJ, suppression des doublons */
.combatLive .liveBoard{display:flex!important;flex-direction:column!important;gap:8px!important}
.combatLive .turnPriority{order:1;width:100%}
.combatLive .monsterPriority{order:2;width:100%}
.combatLive .playerPriority{order:3;width:100%}
.combatLive .journalPriority{order:4;width:100%}
.combatLive .activeBox{border-width:3px;box-shadow:0 0 26px rgba(214,173,87,.25)}
.combatLive .activeBox>h2{font-size:1.15rem;margin-bottom:8px}
.combatLive .mobGrid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.combatLive .mobCard{padding:8px}
.combatLive .mobManage{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:5px;margin-top:7px}
.combatLive .mobManage button{min-height:32px;font-size:.74rem;padding:5px}
.combatLive .mobApply,.combatLive .mobCard .quickResult{display:none!important}
.combatLive .mobCard .miniCond{margin-top:7px}
.combatLive .pjBar{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:700px){.combatLive .pjBar{grid-template-columns:repeat(2,minmax(0,1fr))}.combatLive .mobGrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.combatLive .mobGrid{grid-template-columns:1fr}}

/* V7.0 — reconstruction complète du mode combat, sans superposition ni doublons */
.combatLive #fighters{overflow:visible!important}
.combatLive .liveTop,.combatLive .liveBoard{display:none!important}
.v7TurnZone,.v7InitZone,.v7MonsterZone,.v7PlayerZone,.v7JournalZone{position:relative!important;inset:auto!important;z-index:auto!important;transform:none!important;float:none!important;clear:both!important;width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important;margin:0 0 10px!important}
.v7TurnZone{background:linear-gradient(180deg,#1e2c3d,#15202c);border:3px solid var(--gold);border-radius:16px;padding:10px;box-shadow:0 0 24px rgba(214,173,87,.22)}

<header>
  <div class="title">Compagnon MJ Table Assistant — VERSION FINALE</div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
<section id="home" class="page on">
  <div class="card"><h2>Accueil</h2></div>
  <div class="grid">
    <button class="listbtn" onclick="showPage('combat')">⚔️ Combat assisté</button>
    <button class="listbtn" onclick="showPage('rencontres')">📌 Rencontres prêtes</button>
    <button class="listbtn" onclick="showPage('monstres')">👹 Bestiaire détaillé</button>
    <button class="listbtn" onclick="showPage('pnj')">👥 PNJ / visuels</button>
    <button class="listbtn" onclick="showPage('objets')">🎒 Objets</button>
    <button class="listbtn" onclick="showPage('regles')">🎲 Règles rapides</button>
  </div>
</section>

<section id="combat" class="page">
  <div class="toolbar"><div class="row"><button class="good" onclick="startCombat()">▶ LANCER COMBAT</button><button onclick="prepCombat()">⚙️ Préparation</button><button onclick="combatStarted=false;ensureDefaultPJs();renderCombatMode();renderPJSetup();renderFighters()">👥 Recréer/compléter 4 PJ</button><button class="danger" onclick="clearFight()">Vider</button></div><p class="mini" id="combatModeLabel"></p></div>
  <div class="layout" id="combatLayout">
    <div id="prepColumn">
      <div class="card">
        <h2>1. Préparer</h2>
        <details open><summary>4 PJ permanents</summary>
          <div id="pjSetup"></div>
        </details>
        <details open><summary>Ajouter monstre depuis le bestiaire</summary>
          <select id="monsterSelect"></select>
          <div class="row">
            <input id="qty" type="number" min="1" value="1" title="Quantité">
            <input id="labelPrefix" placeholder="Nom affiché, ex : Zombie">
          </div>
          <button class="good" onclick="addSelectedMonster()">Ajouter monstre(s)</button>
        </details>
        <details><summary>Ajouter combattant manuel</summary>
          <div class="row">
            <input id="name" placeholder="Nom">
            <input id="pv" type="number" placeholder="PV">
            <input id="ca" type="number" placeholder="CA">
            <input id="init" type="number" placeholder="Init">
          </div>
          <button onclick="addCustom()">Ajouter manuel</button>
        </details>
        <div class="row">
          <button onclick="sortInit()">Trier initiative</button>
          <button onclick="nextTurn()">Tour suivant</button>
          <button class="danger" onclick="clearFight()">Vider</button>
        </div>
      </div>
    </div>

    <div id="activeColumn">

        <div id="fighters"></div>
      </div>
    </div>
  </div>
</section>

<section id="rencontres" class="page"><div class="card"><h2>Rencontres prêtes</h2><input id="searchEncounter" placeholder="Chercher une rencontre" oninput="renderEncounters()"><div id="encounterList"></div></div></section>

<section id="regles" class="page"><div class="card"><h2>Règles rapides</h2><div id="rulesList"></div></div></section>
</main>

e 1,50 m. Touché : 3 (1d4 + 1) dégâts contondants plus 3 (1d6) dégâts de feu."}],"special":[{"name":"Corps brûlant","text":"Une créature qui touche le serpent ou le touche avec une attaque au corps à corps alors qu’elle se trouve à 1,50 m subit 3 (1d6) dégâts de feu."},{"name":"Vulnérabilité","text":"Vulnérable aux dégâts de froid."}],"run":"Punir le corps à corps imprudent. Décris la chaleur et le danger de contact."},{"id":"strige","name":"Strige","icon":"🩸","type":"Bête de taille TP, non alignée","page":"Annexe B p.46","ca":14,"pv":2,"init":3,"speed":"3 m, vol 12 m","stats":{"FOR":"4 (-3)","DEX":"16 (+3)","CON":"11 (+0)","INT":"2 (-4)","SAG":"8 (-1)","CHA":"6 (-2)"},"senses":"Vision dans le noir 18 m, Perception passive 9","languages":"—","fp":"1/8","prof":"+2","skills":"—","immunities":"—","actions":[{"name":"Drain de sang","text":"Attaque d’arme au corps à corps : +5 pour toucher, allonge 1,50 m, une créature. Touché : 5 (1d4 + 3) dégâts perforants et la strige se fixe à la cible. Tant qu’elle est fixée, elle ne peut attaquer et inflige 5 (1d4 + 3) dégâts au début de chacun de ses tours. Elle se détache après avoir bu 10 PV de sang, si elle meurt, ou si la cible/allié utilise une action pour la retirer."}],"special":[],"run":"Nuée de petites horreurs. Faible individuellement, dangereuse si plusieurs se fixent. À retirer vite."},{"id":"thallophyte-violette","name":"Thallophyte violette","icon":"☠️","type":"Plante de taille M, non alignée","page":"Annexe B p.47","ca":18,"pv":18,"init":-4,"speed":"1,50 m","stats":{"FOR":"3 (-4)","DEX":"1 (-5)","CON":"10 (+0)","INT":"1 (-5)","SAG":"3 (-4)","CHA":"1 (-5)"},"senses":"Perception passive 6","languages":"—","fp":"1/4","prof":"+2","skills":"—","immunities":"états assourdi, aveuglé, effrayé","actions":[{"name":"Attaques multiples","text":"Le thallophyte effectue 1d4 attaques de Contact putréfiant."},{"name":"Contact putréfiant","text":"Attaque d’arme au corps à corps : +2 pour toucher, allonge 3 m, une créature. Touché : 4 (1d8) dégâts nécrotiques."}],"special":[{"name":"Faux-semblant","text":"Tant que le thallophyte reste immobile au début du combat, il est avantagé à son jet d’initiative. De plus, une créature qui n’a pas vu le thallophyte bouger ou agir doit réussir un test d’Intelligence (Nature) DD 18 pour l’identifier comme créature plutôt que simple champignon."}],"run":"Piège vivant. Ne poursuit pas vraiment ; rend une zone dangereuse si on s’approche."},{"id":"goule","name":"Goule","icon":"🧟","type":"Mort-vivant de taille M, généralement Chaotique Mauvais","page":"Annexe B p.41","ca":12,"pv":22,"init":2,"speed":"9 m","stats":{"FOR":"13 (+1)","DEX":"15 (+2)","CON":"10 (+0)","INT":"7 (-2)","SAG":"10 (+0)","CHA":"6 (-2)"},"senses":"Vision dans le noir 18 m, Perception passive 10","languages":"commun","fp":"1","prof":"+2","skills":"—","immunities":"poison ; état charmé, épuisement, empoisonné","actions":[{"name":"Griffes","text":"Attaque d’arme au corps à corps : +4 pour toucher, allonge 1,50 m, une cible. Touché : 7 (2d4 + 2) dégâts tranchants. Si la cible est une créature autre qu’elfe ou mort-vivant, elle doit réussir un JS Constitution DD 10 ou être paralysée 1 minute. Elle répète le JS à la fin de chacun de ses tours."},{"name":"Morsure","text":"Attaque d’arme au corps à corps : +2 pour toucher, allonge 1,50 m, une créature. Touché : 9 (2d6 + 2) dégâts perforants."}],"special":[],"run":"Plus dangereux que zombie à cause de la paralysie. Cherche les cibles isolées ou déjà blessées."},{"id":"dragonnet-bronze","name":"Dragonnet de bronze","icon":"🐉","type":"Dragon de taille M, généralement Loyal Bon","page":"Annexe B p.40","ca":17,"pv":32,"init":0,"speed":"9 m, vol 18 m, nage 9 m","stats":{"FOR":"17 (+3)","DEX":"10 (+0)","CON":"15 (+2)","INT":"12 (+1)","SAG":"11 (+0)","CHA":"15 (+2)"},"senses":"Vision dans le noir 18 m, perception passive 14","languages":"commun, draconique","fp":"2","prof":"+2","skills":"Perception +4, Discrétion +2, Sauvegarde Dex/Con/Sag/Cha selon profil", +5","skills":"Discrétion +5, Intuition +7, Perception +12, Sauvegardes Dex/Con/Sag/Cha élevées","immunities":"foudre","actions":[{"name":"Attaques multiples","text":"Présence terrifiante, puis une Morsure et deux Griffes."},{"name":"Morsure","text":"+12 pour toucher, allonge 3 m. Touché : 18 (2d10 + 7) dégâts perforants."},{"name":"Griffe","text":"+12 pour toucher, allonge 1,50 m. Touché : 14 (2d6 + 7) dégâts tranchants."},{"name":"Queue","text":"+12 pour toucher, allonge 4,50 m. Touché : 16 (2d8 + 7) dégâts contondants."},{"name":"Souffle","text":"Runara possède souffle de foudre et souffle répulsif puissants. À garder comme filet narratif, pas pour voler la scène aux PJ."}],"special":[{"name":"Amphibie","text":"Respire sous l’eau et dans l’air."},{"name":"Résistance légendaire","text":"3/jour, si elle rate un JS, elle peut choisir de réussir."},{"name":"Métamorphose","text":"Peut prendre forme humanoïde ou animale, en conservant certains éléments selon le profil."}],"run":"Ne doit pas résoudre l’aventure à la place des joueurs. Sert de guide, refuge et révélation."},{"id":"tarak-stat","name":"Tarak","icon":"🧪","type":"Humanoïde humain de taille M, Loyal Neutre","page":"Annexe B p.47","ca":13,"pv":27,"init":3,"speed":"9 m","stats":{"FOR":"10 (+0)","DEX":"16 (+3)","CON":"10 (+0)","INT":"12 (+1)","SAG":"14 (+2)","CHA":"16 (+3)"},"senses":"Perception passive 14","languages":"commun, draconique, argot des voleurs","fp":"2","prof":"+2","skills":"Perception +4, Nature +3, Tromperie +5 ?","immunities":"—","actions":[{"name":"Attaques multiples","text":"Tarak effectue trois attaques de dague."},{"name":"Dague","text":"+5 pour toucher, allonge 1,50 m ou portée 6/18 m. Touché : 5 (1d4 + 3) dégâts perforants plus 7 (2d6) dégâts de poison."}],"special":[{"name":"Ruse","text":"Tarak peut entreprendre l’action Foncer, Se cacher ou Se désengager par une action bonus."}],"run":"PNJ de soutien, pas adversaire sauf dérive de table. Ancien criminel, expert poison/plantes."},{"id":"varnoth-stat","name":"Varnoth","icon":"⚔️","type":"Humanoïde humain de taille M, Neutre Bon","page":"Annexe B p.48","ca":11,"pv":60,"init":1,"speed":"9 m","stats":{"FOR":"16 (+3)","DEX":"13 (+1)","CON":"14 (+2)","INT":"10 (+0)","SAG":"11 (+0)","CHA":"10 (+0)"},"senses":"Perception passive 12","languages":"commun","fp":"2","prof":"+2","skills":"Athlétisme +5, Histoire +2, Perception +2, Religion +2","immunities":"—","actions":[{"name":"Attaques multiples","text":"Varnoth effectue trois attaques d’épée courte."},{"name":"Épée courte","text":"+5 pour toucher, allonge 1,50 m, une cible. Touché : 6 (1d6 + 3) dégâts perforants."}],"special":[],"run":"Ancienne commandante. Si elle agit, elle est efficace, mais elle ne doit pas prendre le contrôle de la partie."}],"pnj":[{"id":"runara","name":"Runara l’Ancienne","role":"Doyenne du Repos du dragon","page":"p.8, p.40","apparence":"Femme âgée à la peau brune, cheveux blancs nattés, robe blanche simple, regard bienveillant. En vérité dragonne de bronze adulte.","personnalite":"Calme, patiente, profondément attachée à la paix et à la seconde chance.","secret":"Dragonne de bronze adulte sous forme humaine. Les résidents connaissent sa vraie nature mais gardent le secret.","sait":"Histoire draconique de l’île, Sharruth, conflit des dragons, problèmes des lieux explorables, philosophie du Repos du dragon.","utilite":"Accueil, refuge, soins, recadrage, réponses progressives. Ne vide pas tout le lore d’un coup.","voix":"Posée, lente, jamais paniquée. Elle répond souvent par une question."},{"id":"tarak","name":"Tarak","role":"Botaniste du cloître","page":"p.9, p.47","apparence":"Humain âgé, pâle, taches de rousseur, cheveux auburn, barbe grisonnante, yeux bleus, tatouage partiellement visible au cou.","personnalite":"Doux, serviable, passionné de botanique, mais se ferme si on insiste sur son passé.","secret":"Ancien empoisonneur lié au Gibet doré. Il cherche à expier ses crimes.","sait":"Herboristerie, grottes marines, champignons utiles, vie du cloître.","utilite":"Déclencher/justifier l’exploration des grottes et fournir une aide pratique.","voix":"Concret, humble, chaleureux sauf si son passé est exposé."},{"id":"varnoth","name":"Varnoth","role":"Ancienne générale mercenaire","page":"p.9-10, p.48","apparence":"Humaine âgée, très musclée autrefois, cheveux courts, nombreuses cicatrices, œil gauche aveugle, jambe gauche prothétique.","personnalite":"Sèche, observatrice, militaire, mais capable d’empathie.","secret":"Ancienne chef des Loups Azur, venue finir sa vie dans la méditation.","sait":"Combat, dangers de l’île, lecture tactique des situations.","utilite":"Conseil militaire, contraste avec la voie pacifique de Runara.","voix":"Courte, directe, analyse les PJ comme une escouade."},{"id":"myla","name":"Myla","role":"Kobolde inventrice / curieuse","page":"p.9","apparence":"Kobolde locale du Repos du dragon.","personnalite":"Vive, curieuse, enthousiaste, aime bricoler et comprendre.","secret":"Pas un secret majeur ; sert surtout à rendre les kobolds mémorables.","sait":"Vie du cloître, rumeurs, détails pratiques.","utilite":"Donner un indice léger, détendre la table, représenter les kobolds.","voix":"Rapide, excitée, questions en rafale."},{"id":"aidron","name":"Aidron","role":"Dragonnet de bronze","page":"chapitre final / annexe B p.40","apparence":"Jeune dragon de bronze.","personnalite":"Noble, blessé, orgueilleux, pas toujours aligné avec la patience de Runara.","secret":"Lié aux enjeux de l’observatoire et de Vrléclair.","sait":"Vrléclair, observatoire, danger du rituel.","utilite":"Enjeu final, allié potentiel, révélation draconique.","voix":"Digne, fier, reconnaissant si sauvé."}],"objects":[{"id":"boots","name":"Bottes elfiques","page":"Annexe A p.36","type":"Objet merveilleux, peu courant","text":"Tant que vous portez ces bottes, vos pas restent silencieux quelle que soit la surface. Avantage aux tests de Dextérité (Discrétion) qui passent par un déplacement silencieux."},{"id":"elixir","name":"Élixir de santé","page":"Annexe A p.36","type":"Potion, rare","text":"Boire la potion soigne toute maladie et met fin aux états assourdi, aveuglé, empoisonné et paralysé. Le liquide rouge limpide contient de petites bulles de lumière."},{"id":"scroll","name":"Parchemin de sort","page":"Annexe A p.36","type":"Parchemin, variable","text":"Contient la formule d’un sort. Si le sort figure dans la liste de votre classe, vous pouvez lire le parchemin pour lancer le sort sans composantes matérielles. Sinon, test d’Intelligence (Arcanes) DD 10 + niveau du sort. Après lecture, le parchemin tombe en poussière."},{"id":"heal","name":"Potion de guérison","page":"Annexe A p.36","type":"Potion, courante","text":"Récupérez 2d4 + 2 points de vie en buvant cette potion. Liquide rouge qui luit quand on l’agite."},{"id":"resist","name":"Potion de résistance","page":"Annexe A p.36","type":"Potion, peu courante","text":"Donne résistance à un type de dégâts pendant 1 heure. Le MD choisit ou lance 1d10 : acide, feu, force, foudre, froid, nécrotique, poison, psychique, radiant, tonnerre."}],"encounters":[{"id":"marins","name":"Marins noyés","where":"Chapitre 1 — arrivée au Repos du dragon","page":"p.7","desc":"Première rencontre de combat : 3 zombies sortent de l’eau après le débarquement.","monsters":[{"id":"zombie","qty":3,"name":"Marin noyé"}],"tips":"Combat pédagogique. Les zombies avancent et attaquent au corps à corps. Montre Robustesse de la non-vie sans chercher le TPK."},{"id":"hibours","name":"Hibours en exploration","where":"Chapitre 1 — rencontres supplémentaires","page":"p.14-15, annexe p.42","desc":"Hibours hostile rencontré dans l’île si utilisé selon les rencontres supplémentaires.","monsters":[{"id":"hibours","qty":1,"name":"Hibours"}],"tips":"Gros prédateur brutal. Utilise le terrain et les bruits avant l’impact."},{"id":"koboldscout","name":"Groupe de kobolds","where":"Observatoire / kobolds de Vrléclair","page":"p.29-31, annexe p.43","desc":"Kobolds hostiles  document.getElementById('monsterSelect').innerHTML=data.monsters.map(m=>`<option value="${m.id}">${esc(m.name)} — CA ${m.ca}, PV ${m.pv}</option>`).join('');
 const damageTypeSelect=document.getElementById('damageType');
 if(damageTypeSelect)damageTypeSelect.innerHTML=damageTypes.map(t=>`<option value="${t}">${t}</option>`).join('');
 ensureDefaultPJs(); renderAll(); renderCombatMode();
}
function showPage(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));if(btn)btn.classList.add('on');window.scrollTo(0,0)}
function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])).replace(/\n/g,'<br>')}
function monster(id){return data.monsters.find(m=>m.id===id)}
function pnj(id){return data.pnj.find(p=>p.id===id)}
function imgKey(kind,id){return 'mj_v4_img_'+kind+'_'+id}
function getImg(kind,id){return localStorage.getItem(imgKey(kind,id))}
function setImg(kind,id,input){const f=input.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{localStorage.setItem(imgKey(kind,id),r.result)}catch(e){alert('Image trop lourde pour le stockage local. Essaie une image plus légère.');return} renderAll();}; r.readAsDataURL(f)}
function token(kind,id,icon,cls=''){let im=getImg(kind,id);return `<div class="token ${cls}">${im?`<img src="${im}" alt="">`:esc(icon||'👤')}</div>`}
function fullscreenImage(kind,id,title,icon){let im=getImg(kind,id);modal(title, im?`<div style="text-align:center"><img src="${im}" style="max-width:100%;border-radius:12px;border:1px solid var(--line)"></div>`:`<div style="text-align:center">${token(kind,id,icon,'big')}<p>Aucune image importée.</p></div>`)}
function renderAll(){renderEncounters();renderPNJ();renderMonsters();renderObjects();renderRules();renderPJSetup();renderFighters();renderTargets();renderLog();renderCombatMode();}

function ensureDefaultPJs(){
 const defaults=[
  {name:'Hammerz',ca:18,pv:12,init:0,initMod:0,notes:'Minotaure paladin 1'},
  {name:'Lelio',ca:14,pv:10,init:1,initMod:1,notes:'Léonin druide 1'},
  {name:'Loris',ca:12,pv:8,init:2,initMod:2,notes:'Génasi de feu ensorceleur 1'},
  {name:"Vax’Ildan",ca:15,pv:11,init:3,initMod:3,notes:'Elfe rôdeur 1'}
 ];
 const pjs=fighters.filter(f=>f.kind==='pj');
 pjs.slice(0,defaults.length).forEach((f,n)=>{
  const d=defaults[n];
  if(/^PJ [1-4]$/.test(String(f.name||''))){
   f.name=d.name;f.ca=d.ca;f.pv=d.pv;f.max=d.pv;f.init=d.init;f.initMod=d.initMod;f.notes=d.notes;
  }
 });
 for(let n=pjs.length;n<defaults.length;n++){
  const d=defaults[n];
  fighters.push({kind:'pj',name:d.name,init:d.init,initMod:d.initMod,ca:d.ca,pv:d.pv,max:d.pv,conditions:[],notes:d.notes,id:'pj_'+(n+1)});
 }
 saveAll();
}
function renderPJSetup(){
 const box=document.getElementById('pjSetup'); if(!box)return;
 const pjs=fighters.filter(f=>f.kind==='pj').slice(0,4);
 const header=`<div class="playerSetupHeader"><span>Nom du PJ</span><span>CA</span><span>PV max</span><span>Initiative</span></div>`;
 const rows=pjs.map((f,idx)=>{let i=fighters.indexOf(f);return `<div class="playerSetup"><input value="${esc(f.name)}" onchange="updateF(${i},'name',this.value)" aria-label="Nom du PJ ${idx+1}" placeholder="PJ ${idx+1}"><input type="number" value="${f.ca||10}" onchange="updateF(${i},'ca',this.value)" aria-label="Classe d’armure"><input type="number" value="${f.max||10}" onchange="updateF(${i},'max',this.value);updateF(${i},'pv',this.value)" aria-label="Points de vie maximum"><input type="number" value="${f.init||0}" onchange="setInit(${i},this.value)" aria-label="Initiative"></div>`}).join('');
 box.innerHTML=header+rows;
}
function updateF(i,k,v){if(!fighters[i])return; if(['ca','pv','max','init'].includes(k))v=+v||0; fighters[i][k]=v; if(k==='max' && fighters[i].pv>v)fighters[i].pv=v; saveAll(); renderPJSetup(); renderFighters();}
function startCombat(){ensureDefaultPJs(); if(resolveQuickTargetIndex()<0)quickTarget=null; if(pendingPlayerAttack&&findFighterIndexById(pendingPlayerAttack.targetId)<0)pendingPlayerAttack=null; sortInit(false); combatStarted=true; saveAll(); renderCombatMode(); renderFighters(); setTimeout(()=>{document.querySelector('.initChip.active')?.scrollIntoView({block:'nearest',inline:'center'});},0);}
function prepCombat(){
 combatStarted=false;
 ensureDefaultPJs();
 saveAll();
 renderCombatMode();
 renderPJSetup();
 renderFighters();
}
function renderCombatMode(){document.body.classList.toggle('combatLive',!!combatStarted); const l=document.getElementById('combatModeLabel'); if(l)l.textContent=combatStarted?'COMBAT':'PRÉPARATION';}
function addPJ(){let name=document.getElementById('pjName').value.trim()||'PJ';let init=+document.getElementById('pjInit').value||0;fighters.push({kind:'pj',name,init,ca:10,pv:1,max:1,conditions:[],notes:'',id:'pj_'+Date.now()+Math.random().toString(16).slice(2)});sortInit(false);logEvent(`PJ ajouté : ${name} (init ${init})`);renderFighters();}
function addSelectedMonster(){let id=document.getElementById('monsterSelect').value;let q=Math.max(1,+document.getElementById('qty').value||1);let prefix=document.getElementById('labelPrefix').value.trim();if(!fighters.some(f=>f.kind!=='pj'))resetCombatHistory();for(let i=1;i<=q;i++){let m=monster(id);fighters.push({kind:'monster',name:(prefix||m.name)+(q>1?' '+i:''),pv:m.pv,max:m.pv,ca:m.ca,init:m.init,ref:id,conditions:[],pending:null,id:'m_'+Date.now()+Math.random().toString(16).slice(2)})}sortInit(false);logEvent(`${q} × ${monster(id).name} ajouté(s)`);renderFighters();}
function addMonster(label,id){if(!fighters.some(f=>f.kind!=='pj'))resetCombatHistory();let m=monster(id);fighters.push({kind:'monster',name:label,pv:m.pv,max:m.pv,ca:m.ca,init:m.init,ref:id,conditions:[],pending:null,id:'m_'+Date.now()+Math.random().toString(16).slice(2)});sortInit(false);logEvent(`${label} ajouté au combat`);showPage('combat');renderFighters();}
function addCustom(){let n=document.getElementById('name').value||'Combattant';let pv=+document.getElementById('pv').value||1;let ca=+document.getElementById('ca').value||10;let init=+document.getElementById('init').value||0;fighters.push({kind:'custom',name:n,pv,max:pv,ca,init,conditions:[],id:'c_'+Date.now()+Math.random().toString(16).slice(2)});sortInit(false);renderFighters()}
function sortInit(doRender=true){fighters.sort((a,b)=>a.ritualSpirit?1:(b.ritualSpirit?-1:(b.init||0)-(a.init||0))); if(turn>=fighters.length)turn=0; saveAll(); if(doRender)renderFighters();}
function nextTurn(){
 if(!fighters.length)return;
 turn=(turn+1)%fighters.length;
 saveAll();
 renderFighters();
 setTimeout(()=>{document.querySelector('.initChip.active')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});},0);
 logEvent(`Tour : ${fighters[turn].name}`);
 handleStartOfTurnEffects(turn);
}

function getStrigeAttachedTarget(f){
 let id=f?.attachedTo || f?.auto?.attachedTo;
 if(!id)return {id:null,index:-1,target:null};
 let index=findFighterIndexById(id);
 return {id,index,target:index>=0?fighters[index]:null};
}
function handleStartOfTurnEffects(i){
 const f=fighters[i];
 if(!f || f.ref!=='strige')return;
 const linked=getStrigeAttachedTarget(f);
 if(!linked.target)return;
 openStrigeDrainPopup(i, linked.index, false);
}
function openStrigeDrainPopup(i,pi,manual){
 const s=fighters[i], p=fighters[pi];
 if(!s||!p)return;

 const drained=Number(
   s.drained !== undefined ? s.drained :
   (s.auto?.drained !== undefined ? s.auto.drained : 0)
 ) || 0;

 if(drained>=10){
   detachStrigeFromTarget(i,false,true);
   modal('🩸 Strige repue — détachement automatique',`
     <div class="goodbox"><b>${esc(s.name)}</b> avait déjà drainé <b>${drained}/10 PV</b>. Elle se détache automatiquement.</div>
     <button type="button" class="good" onclick="closeModal()">OK</button>
   `);
   return;
 }

 setLastResult('info','🩸 Drain de sang',`${s.name} est fixée sur ${p.name}. Début de tour : lancer 1d4, l’application ajoute +3.`);
 logEvent(`🩸 ${s.name} fixée sur ${p.name} : début de tour, lancer 1d4+3 dégâts perforants.`);
 saveAll();

 modal('🩸 Strige — drain de début de tour',`
   <div class="combat">
     <b>${esc(s.name)}</b> est fixée sur <b>${esc(p.name)}</b>.<br>
     Au début de son tour, elle inflige automatiquement <b>1d4+3 dégâts perforants</b>.
   </div>
   <div class="goodbox">
     Total déjà drainé : <b>${drained}/10</b><br>
     Le prochain drain est appliqué en entier, même s’il dépasse 10.
   </div>
   <label>Résultat du d4</label>
   <input id="strigeDrainRoll" type="number" inputmode="numeric" min="1" max="4" placeholder="1 à 4" autofocus>
   <div class="row">
     <button type="button" class="good" id="strigeDrainApply">Calculer les dégâts</button>
     <button type="button" class="danger" id="strigeDrainDetach">Détacher</button>
   </div>
 `);

 const applyBtn=document.getElementById('strigeDrainApply');
 const detachBtn=document.getElementById('strigeDrainDetach');
 const input=document.getElementById('strigeDrainRoll');
 const strigeId=s.id;
 const targetId=p.id;

 if(applyBtn){
   applyBtn.addEventListener('click',()=>{
     resolveStrigeTurnDrainById(strigeId,targetId);
   });
 }

 if(detachBtn){
   detachBtn.addEventListener('click',()=>{
     detachStrigeFromId(strigeId);
   });
 }

 if(input){
   input.addEventListener('keydown',e=>{
     if(e.key==='Enter')applyBtn?.click();
   });
   setTimeout(()=>input.focus(),50);
 }
}
function resolveStrigeTurnDrainById(strigeId,targetId){
 try{
   const i=findFighterIndexById(strigeId);
   const pi=findFighterIndexById(targetId);

   if(i<0 || pi<0){
     alert('La Strige ou sa cible n’est plus présente dans le combat.');
     return;
   }

   const s=fighters[i], p=fighters[pi];
   const input=document.getElementById('strigeDrainRoll');
   const die=Number(input?.value);

   if(!Number.isInteger(die) || die<1 || die>4){
     alert('Entre 1, 2, 3 ou 4 pour le d4.');
     input?.focus();
     return;
   }

   const dmg=die+3;
   const previous=Number(
     s.drained !== undefined ? s.drained :
     (s.auto?.drained !== undefined ? s.auto.drained : 0)
   ) || 0;
   const totalDrained=previous+dmg;
   const repue=totalDrained>=10;

   s.auto=s.auto||{};
   s.drained=totalDrained;
   s.auto.drained=totalDrained;
   s.attachedTo=s.attachedTo || s.auto.attachedTo || p.id;
   s.auto.attachedTo=s.attachedTo;

   const msg=`${s.name} draine ${dmg} PV à ${p.name} (${die}+3). Total drainé : ${totalDrained}/10.` +
     (repue?' La Strige se détache après avoir infligé tous les dégâts.':'');

   logEvent(`🩸 ${msg}`);
   setLastResult('hit','🩸 Drain de sang',msg);

   if(repue){
     detachStrigeFromTarget(i,false,true);
   }else{
     saveAll();
     renderFighters();
   }

   saveAll();

   modal('🩸 Drain de sang — dégâts',`
     <div class="combat"><b>${esc(p.name)} perd ${dmg} PV</b>.</div>
     <div class="goodbox">
       Calcul : <b>${die} + 3 = ${dmg}</b> dégâts perforants.<br>
       Total drainé : <b>${totalDrained}/10</b><br>
       ${repue?'<b>La Strige est repue et se détache.</b>':'La Strige reste fixée.'}
     </div>
     <button type="button" class="good" onclick="closeModal()">OK</button>
   `);
 }catch(error){
   console.error('Erreur drain Strige',error);
   alert('Erreur pendant le calcul du drain : '+error.message);
 }
}
// Compatibilité avec les anciens boutons éventuels.
function resolveStrigeTurnDrain(i,pi){
 const s=fighters[i], p=fighters[pi];
 if(!s||!p)return;
 resolveStrigeTurnDrainById(s.id,p.id);
}
function detachStrigeFromId(strigeId){
 const i=findFighterIndexById(strigeId);
 if(i>=0)detachStrigeFromTarget(i,true,false);
}
function detachStrigeFromTarget(i,close=true,preserveDrain=false){
 const s=fighters[i]; if(!s)return;
 const linked=getStrigeAttachedTarget(s);
 if(linked.target){remCondById(linked.target.id,'saigne');}
 s.attachedTo=null;
 s.auto=s.auto||{};
 s.auto.attachedTo=null;
 if(!preserveDrain){
   s.drained=0;
   s.auto.drained=0;
 }
 s.conditions=(s.conditions||[]).filter(c=>c!=='fixée');
 saveAll();
 logEvent(`✋ ${s.name} se détache.`);
 setLastResult('info','✋ Strige détachée',`${s.name} n’est plus fixée.`);
 if(close)closeModal();
 renderFighters();
}

function resetCombatHistory(){
 log=[];
 lastCombatResult=null;
 quickTarget=null;
 pendingPlayerAttack=null;
 localStorage.removeItem('mj_v4_log');
 localStorage.removeItem('mj_v4_last_result');
 localStorage.removeItem('mj_v4_quick_target');
 localStorage.removeItem('mj_v4_pending_player_attack');
}

function clearFight(){
 if(!confirm('Vider le combat ?'))return;
 fighters=[];
 turn=0;
 combatStarted=false;
 resetCombatHistory();
 ensureDefaultPJs();
 saveAll();
 renderPJSetup();
 renderFighters();
 renderTargets();
 renderLog();
 renderCombatMode();
}
function removeF(i){let n=fighters[i].name;fighters.splice(i,1);if(turn>=fighters.length)turn=0;saveAll();logEvent(`${n} retiré du combat`);renderFighters();}
function setInit(i,val){fighters[i].init=+val||0;sortInit();renderPJSetup();}
function hp(i,d,why='ajustement'){let f=fighters[i];let before=f.pv;f.pv=Math.max(0,Math.min(f.max,f.pv+d));saveAll();logEvent(`${f.name} PV ${before} → ${f.pv} (${why})`);renderPJSetup();renderFighters();}

 ['à terre','Attaques au corps à corps contre la cible avantagées ; attaques à distance désavantagées si proche selon situation. Se relever coûte la moitié du mouvement.'],
 ['agrippé','Vitesse 0. Se termine si l’agrippeur est neutralisé ou si la cible se libère.'],
 ['entravé','Vitesse 0 ; attaques contre la cible avantagées ; attaques de la cible désavantagées ; désavantage aux JS DEX.'],
 ['charmé','Ne peut pas attaquer le charmeur ; le charmeur a avantage aux interactions sociales.'],
 ['étourdi','Neutralisé, ne bouge pas, parle à peine ; rate JS FOR/DEX ; attaques contre lui avantagées.'],
 ['paralysé','Neutralisé ; rate JS FOR/DEX ; attaques contre lui avantagées ; attaque au contact qui touche = critique.'],
 ['empoisonné','Désavantage aux jets d’attaque et tests de caractéristique.'],
 ['brûlé','Rappel maison/effet de sort : vérifier dégâts au début du tour si une source le prévoit.'],
 ['saigne','Rappel : vérifier dégâts continus si la scène ou capacité le prévoit.'],
 ['concentration','Rappel : si dégâts subis, test de CON DD 10 ou moitié des dégâts.']

function toggleCond(i,c){fighters[i].conditions=fighters[i].conditions||[];let a=fighters[i].conditions;let n=a.indexOf(c);if(n>=0)a.splice(n,1);else a.push(c);saveAll();renderFighters();}
function conditionHelp(f){let active=f.conditions||[]; if(!active.length)return ''; return `<div class="condHelp">${active.map(c=>`<div><b>${esc(c)}</b> — ${esc((conds.find(x=>x[0]===c)||[])[1]||'Rappel état à gérer.')}</div>`).join('')}</div>`}

function setLastResult(kind,title,detail){lastCombatResult={kind,title,detail,time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};saveAll();}
function resultBannerHTML(){if(!lastCombatResult)return '';let cls=lastCombatResult.kind==='hit'?'hitBox':(lastCombatResult.kind==='miss'?'missBox':'infoBox');return `<div class="resultBanner ${cls}"><div class="calcLine">${esc(lastCombatResult.title)}</div><div class="calcSub">${esc(lastCombatResult.detail||'')} · ${esc(lastCombatResult.time||'')}</div></div>`}
function clearLastResult(){lastCombatResult=null;saveAll();renderFighters();}
function renderFighters(){
 const box=document.getElementById('fighters');
 if(!box)return;
 if(!fighters.length){
  box.innerHTML='<p class="mini">Aucun combattant.</p>';
  if(!combatStarted)renderPJSetup();
  renderTargets();
  return;
 }
 if(combatStarted){
  box.innerHTML=liveCombatHTML();
  renderTargets();
  saveAll();
  return;
 }
 renderPJSetup();
 box.innerHTML=fighters.map((f,i)=>fighterHTML(f,i)).join('');
 renderTargets();
 saveAll();
}

function setTurn(i){
 if(i<0||i>=fighters.length)return;
 turn=i;
 saveAll();
 renderFighters();
 setTimeout(()=>{document.querySelector('.initChip.active')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});},0);
 logEvent(`Tour : ${fighters[turn].name}`);
 handleStartOfTurnEffects(turn);
}
function prevTurn(){if(!fighters.length)return;turn=(turn-1+fighters.length)%fighters.length;saveAll();renderFighters();setTimeout(()=>{document.querySelector('.initChip.active')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});},0);logEvent(`Tour précédent : ${fighters[turn].name}`)}
function compactConditions(f){let active=f.conditions||[];return active.length?active.join(', '):'aucun état';}
function liveCombatHTML(){
 if(turn<0||turn>=fighters.length)turn=0;
 const active=fighters[turn]||fighters[0]; const ai=fighters.indexOf(active);

 <section class="card v7PlayerZone"><h3>PJ — états rapides</h3><div class="pjBar">${fighters.map((f,i)=>f.kind==='pj'?pjMiniHTML(f,i):'').join('')}</div></section>

function pjMiniHTML(f,i){const hint=combatStarted?'':'<div class="editHint">✏️ modifier nom / initiative / états</div>';return `<div class="pjMini ${i===turn?'active':''}" onclick="${combatStarted?`setTurn(${i})`:`editPJModal(${i})`}"><div class="pjMiniName">${esc(f.name)}</div><div class="pjState">Init ${f.init??0} · ${esc(compactConditions(f))}</div>${hint}</div>`}

function activePanelHTML(f,i){if(!f)return '';
 const m=f.ref?monster(f.ref):null;
 const typeOptions=damageTypes.map(t=>`<option value="${t}">${t}</option>`).join('');
 const base=`<h2>${f.kind==='pj'?'Tour PJ':'Tour monstre'} : ${esc(f.name)}</h2><div class="mobStats"><span>Init ${f.init??0}</span><span>CA ${f.ca??'-'}</span>${f.kind!=='pj'?`<span>PV ${f.pv}/${f.max}</span>`:''}<span>États : ${esc(compactConditions(f))}</span></div>`;

 logEvent(`${source.name} inflige ${applied.dmg} dégâts ${type} à ${targetName} · PV ${before} → ${after}`);

 pendingPower=null;
 modal('🩸 Strige fixée — résultat',`

 `);
 saveAll(); renderFighters();

function applyIncoming(i){
 let f=fighters[i]; if(!f)return;
 let atk=Number(document.getElementById('atk_'+i)?.value);
 let dmg=Number(document.getElementById('dmg_'+i)?.value)||0;
 let type=document.getElementById('dtype_'+i)?.value||'tranchant';
 let crit=!!document.getElementById('crit_'+i)?.checked;
 if(!atk){alert('Entre le jet d’attaque total.');return;}
 const ca=Number(f.ca||0); const before=Number(f.pv||0);
 if(atk>=ca){
   let detail=`${f.name} : ${atk} ≥ CA ${ca}`;
   if(dmg>0){
     const applied=applyDamage(i,dmg,type,crit,`attaque reçue ${atk} vs CA ${ca}`, false);

     detail+=' · touche, aucun dégât appliqué';

 }else{

 }

}

 });

function traitsFor(f){let m=f.ref?monster(f.ref):null; let text=((m?.immunities||'')+' '+(m?.special||[]).map(s=>s.text+' '+s.name).join(' ')).toLowerCase(); return text;}
function adjustedDamage(f,dmg,type){
 let text=traitsFor(f); let t=type.toLowerCase(); let note='';
 const profile=f.ref?monster(f.ref)?.damageProfile:null;
 if(profile){
  if(profile.immunities.includes(t))return {dmg:0,note:`immunité ${type}`};
  if(profile.resistances.includes(t))return {dmg:Math.floor(dmg/2),note:`résistance ${type}`};
  if(profile.vulnerabilities.includes(t))return {dmg:dmg*2,note:`vulnérabilité ${type}`};
  return {dmg,note};
 }
 if(text.includes('immun') && text.includes(t)){return {dmg:0,note:`immunité ${type}`};}
 if((text.includes('résistance')||text.includes('resistance')) && text.includes(t)){return {dmg:Math.floor(dmg/2),note:`résistance ${type}`};}
 if((text.includes('vulnérable')||text.includes('vulnérabilité')||text.includes('vulnerable')) && text.includes(t)){return {dmg:dmg*2,note:`vulnérabilité ${type}`};}
 return {dmg,note};
}
function applyDamage(i,dmg,type,crit,why,autoRender=true){
 let f=fighters[i];
 if(!f)return {dmg:0,note:'cible introuvable'};
 let adj=adjustedDamage(f,Number(dmg)||0,type||'tranchant'); let before=Number(f.pv||0); let after=Math.max(0,before-adj.dmg); f.pv=after;
 logEvent(`${f.name} subit ${adj.dmg} ${type}${adj.note?' ('+adj.note+')':''} — ${why} — PV ${before} → ${after}`);
 const isZombie=f.ref==='zombie';
 if(isZombie && before>0 && after<=0){
   if(type==='radiant' || crit){logEvent(`${f.name} : Robustesse ignorée (${type==='radiant'?'dégâts radiants':'coup critique'})`);}
   else{f.pending={type:'undeadFortitude',dc:5+adj.dmg}; logEvent(`${f.name} déclenche Robustesse de la non-vie : JS CON DD ${5+adj.dmg}`);}
 }
 saveAll();
 if(autoRender)renderFighters();
 return {dmg:adj.dmg,note:adj.note,before,after:f.pv};
}
