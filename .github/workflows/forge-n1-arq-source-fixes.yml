name: Forge N1 - corrections source et recette Arquebusier
on:
  workflow_dispatch:
  push:
    paths:
      - 'forge-of-heroes/ENGINE/arquebusier_context_n1.js'
      - 'forge-of-heroes/ENGINE/arquebusier_context_ui_n1.js'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_summaries.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_armor.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_equipment_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_powderless_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_doigts_agiles_knives_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_weapons.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_granted_pdf_annex_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_granted_pdf_annex.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_category_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_preferences_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_weapon_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_two_preferences_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_derived_source_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_archer_thrower_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_thrower_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_thrower_click.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_rank_bonus_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_history_rank_bonus.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_history_rank_click.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_very_young_choice_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_very_young_choice_renderer.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_choices_click.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_choices_merge.cjs'
permissions:
  contents: write
concurrency:
  group: forge-n1-arq-source-fixes
  cancel-in-progress: true
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les outils de recette tactile
        run: |
          npm install --prefix "$RUNNER_TEMP/foh-source" playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/foh-source/node_modules" >> "$GITHUB_ENV"
      - name: Construire les deux produits et vérifier les règles corrigées
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_powderless_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_doigts_agiles_knives_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_granted_pdf_annex_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_summaries.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_category_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_preferences_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_archer_thrower_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_rank_bonus_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_very_young_choice_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_publish.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_very_young_choice_renderer.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_history_rank_bonus.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_thrower_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_weapon_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_two_preferences_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_derived_source_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_equipment_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_arbaletrier_audit.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pure_age_ranks.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_all_pairs_current.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_armor.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_weapons.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_granted_pdf_annex.cjs
      - name: Démarrer le serveur de recette mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/foh-source-http.log 2>&1 &
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Vingt créations et reprises des paires au clic
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_twenty_real_mobile_clicks.cjs
      - name: Quatre scénarios contextuels au clic
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_live_click.cjs
      - name: Cinq voies vénérables au clic
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_venerable_context_click.cjs
      - name: Deux créations avec variante lanceur
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_thrower_click.cjs
      - name: Quatre créations Courtisan et Expert
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_history_rank_click.cjs
      - name: Actualiser le suivi sans déclarer de clôture non prouvée
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_15_mechanics_snapshot.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_pure_rule_ledger.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_r2_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_gear_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_derived_gate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-arquebusier-correctifs-source
          path: |
            forge-of-heroes/QA/N1/arquebusier-history-rank-*.json
            forge-of-heroes/QA/N1/arquebusier-granted-thrower*.json
            forge-of-heroes/QA/N1/arquebusier-derived-source.json
            forge-of-heroes/QA/N1/arquebusier-powder-weapon-boundary.json
            forge-of-heroes/QA/N1/arquebusier-two-preferences.json
            forge-of-heroes/QA/N1/arquebusier-context-*.json
            forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json
            forge-of-heroes/QA/N1/arquebusier-all-pairs-current.json
            forge-of-heroes/QA/N1/arquebusier-20-real-mobile-pairs.json
            forge-of-heroes/QA/N1/arquebusier-venerable-context-click.json
            forge-of-heroes/QA/N1/arquebusier-grants-armor.json
            forge-of-heroes/QA/N1/arquebusier-grants-weapons.json
            forge-of-heroes/QA/N1/arquebusier-granted-pdf-annex.json
            forge-of-heroes/QA/N1/arquebusier-equipment-source.json
            forge-of-heroes/QA/N1/arquebusier-arbaletrier-source-audit.json
      - name: Publier uniquement après réussite des calculs et clics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge-of-heroes/QA/N1/very-young-resource-renderer.json forge-of-heroes/QA/N1/arquebusier-history-rank-bonus.json forge-of-heroes/QA/N1/arquebusier-history-rank-click.json forge-of-heroes/QA/N1/arquebusier-granted-thrower.json forge-of-heroes/QA/N1/arquebusier-granted-thrower-click.json forge-of-heroes/QA/N1/arquebusier-derived-source.json forge-of-heroes/QA/N1/arquebusier-powder-weapon-boundary.json forge-of-heroes/QA/N1/arquebusier-two-preferences.json forge-of-heroes/QA/N1/arquebusier-granted-pdf-annex.json forge-of-heroes/progression/pdf-labels.json forge-of-heroes/QA/N1/arquebusier-grants-weapons.json forge-of-heroes/QA/N1/arquebusier-equipment-source.json forge-of-heroes/QA/N1/arquebusier-arbaletrier-source-audit.json forge-of-heroes/progression/official-pdf-engine.js forge-of-heroes/QA/N1/arquebusier-grants-armor.json forge-of-heroes/index.html forge-of-heroes/FORGE_OF_HEROES_ATELIER_GUILTANAS_PRODUCT_MASTER.html forge-of-heroes/QA/N1/arquebusier-context-canonical.json forge-of-heroes/QA/N1/arquebusier-context-publish.json forge-of-heroes/QA/N1/arquebusier-context-real-click.json forge-of-heroes/QA/N1/arquebusier-all-mechanics-probe.json forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json forge-of-heroes/QA/N1/arquebusier-all-pairs-current.json forge-of-heroes/QA/N1/arquebusier-20-real-mobile-pairs.json forge-of-heroes/QA/N1/arquebusier-venerable-context-click.json centre-synchronisation/forge-n1/focus.json centre-synchronisation/forge-n1/purs.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(forge): dons et bonus historiques calculés et conservés au clic [skip ci]'
            git restore --worktree .
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                # Only timestamp/evidence conflicts may use this run's tested reports.
                # Never resolve a product or source conflict automatically.
                mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
                for file in "${conflicts[@]}"; do
                  case "$file" in
                    forge-of-heroes/QA/N1/*.json|centre-synchronisation/forge-n1/*.json)
                      git checkout --theirs -- "$file"
                      git add -- "$file"
                      ;;
                    *) git rebase --abort; exit 1 ;;
                  esac
                done
                GIT_EDITOR=true git rebase --continue
              fi
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi

  choices-mobile:
    needs: verify-publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/foh-choices" playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/foh-choices/node_modules" >> "$GITHUB_ENV"
      - name: Créer et rouvrir vingt personnages sur téléphone
        env:
          CHOICES_SHARD: ${{ matrix.shard }}
          CHOICES_SHARDS: '4'
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/foh-choice-http.log 2>&1 &
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_choices_click.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-arq-mobile-choice-${{ matrix.shard }}
          overwrite: true
          path: forge-of-heroes/QA/N1/arquebusier-choices-shard-${{ matrix.shard }}.json
  consolidate-choices:
    needs: choices-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-arq-mobile-choice-*
          path: ${{ runner.temp }}/foh-choice-proofs
      - name: Publier les preuves uniquement si les produits restent identiques
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_choices_merge.cjs "$RUNNER_TEMP/foh-choice-proofs"
            if test -f forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_click_gate.cjs; then
              node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
              node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_click_gate.cjs
              git add centre-synchronisation/forge-n1/focus.json
            fi
            git add forge-of-heroes/QA/N1/arquebusier-80-real-mobile-choices.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'test(forge): 80 créations mobiles peuples âges et choix vérifiés [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
