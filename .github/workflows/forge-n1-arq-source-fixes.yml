name: Forge N1 - corrections source et recette Arquebusier
on:
  workflow_dispatch:
  push:
    paths:
      - 'forge-of-heroes/ENGINE/arquebusier_context_n1.js'
      - 'forge-of-heroes/ENGINE/arquebusier_context_ui_n1.js'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_summaries.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_armor.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_equipment_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_powderless_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_doigts_agiles_knives_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_weapons.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_granted_pdf_annex_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_granted_pdf_annex.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_category_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_preferences_fix.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_weapon_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_two_preferences_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_derived_source_oracle.cjs'
permissions:
  contents: write
concurrency:
  group: forge-n1-arq-source-fixes
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les outils de recette tactile
        run: |
          npm install --prefix "$RUNNER_TEMP/foh-source" playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/foh-source/node_modules" >> "$GITHUB_ENV"
      - name: Construire les deux produits et vérifier les règles corrigées
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_powderless_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_doigts_agiles_knives_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_granted_pdf_annex_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_summaries.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_category_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_preferences_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_publish.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_powder_weapon_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_two_preferences_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_derived_source_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_equipment_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_arbaletrier_audit.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pure_age_ranks.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_all_pairs_current.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_armor.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_weapons.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_granted_pdf_annex.cjs
      - name: Vérifier les créations et capacités dans Chrome mobile
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/foh-source-http.log 2>&1 &
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_twenty_real_mobile_clicks.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_live_click.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_venerable_context_click.cjs
      - name: Actualiser le suivi sans déclarer de clôture non prouvée
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_15_mechanics_snapshot.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_pure_rule_ledger.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_r2_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_gear_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_derived_gate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-arquebusier-correctifs-source
          path: |
            forge-of-heroes/QA/N1/arquebusier-derived-source.json
            forge-of-heroes/QA/N1/arquebusier-powder-weapon-boundary.json
            forge-of-heroes/QA/N1/arquebusier-two-preferences.json
            forge-of-heroes/QA/N1/arquebusier-context-*.json
            forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json
            forge-of-heroes/QA/N1/arquebusier-all-pairs-current.json
            forge-of-heroes/QA/N1/arquebusier-20-real-mobile-pairs.json
            forge-of-heroes/QA/N1/arquebusier-venerable-context-click.json
            forge-of-heroes/QA/N1/arquebusier-grants-armor.json
            forge-of-heroes/QA/N1/arquebusier-grants-weapons.json
            forge-of-heroes/QA/N1/arquebusier-granted-pdf-annex.json
            forge-of-heroes/QA/N1/arquebusier-equipment-source.json
            forge-of-heroes/QA/N1/arquebusier-arbaletrier-source-audit.json
      - name: Publier uniquement après réussite des calculs et clics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge-of-heroes/QA/N1/arquebusier-derived-source.json forge-of-heroes/QA/N1/arquebusier-powder-weapon-boundary.json forge-of-heroes/QA/N1/arquebusier-two-preferences.json forge-of-heroes/QA/N1/arquebusier-granted-pdf-annex.json forge-of-heroes/progression/pdf-labels.json forge-of-heroes/QA/N1/arquebusier-grants-weapons.json forge-of-heroes/QA/N1/arquebusier-equipment-source.json forge-of-heroes/QA/N1/arquebusier-arbaletrier-source-audit.json forge-of-heroes/progression/official-pdf-engine.js forge-of-heroes/QA/N1/arquebusier-grants-armor.json forge-of-heroes/index.html forge-of-heroes/FORGE_OF_HEROES_ATELIER_GUILTANAS_PRODUCT_MASTER.html forge-of-heroes/QA/N1/arquebusier-context-canonical.json forge-of-heroes/QA/N1/arquebusier-context-publish.json forge-of-heroes/QA/N1/arquebusier-context-real-click.json forge-of-heroes/QA/N1/arquebusier-all-mechanics-probe.json forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json forge-of-heroes/QA/N1/arquebusier-all-pairs-current.json forge-of-heroes/QA/N1/arquebusier-20-real-mobile-pairs.json forge-of-heroes/QA/N1/arquebusier-venerable-context-click.json centre-synchronisation/forge-n1/focus.json centre-synchronisation/forge-n1/purs.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(forge): poudre et doubles prédilections vérifiées au clic [skip ci]'
            git restore --worktree .
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                # Only timestamp/evidence conflicts may use this run's tested reports.
                # Never resolve a product or source conflict automatically.
                mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
                for file in "${conflicts[@]}"; do
                  case "$file" in
                    forge-of-heroes/QA/N1/*.json|centre-synchronisation/forge-n1/*.json)
                      git checkout --theirs -- "$file"
                      git add -- "$file"
                      ;;
                    *) git rebase --abort; exit 1 ;;
                  esac
                done
                GIT_EDITOR=true git rebase --continue
              fi
              if git push origin HEAD:main; then exit 0; fi
            done
            exit 1
          fi
