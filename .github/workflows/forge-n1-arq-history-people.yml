name: Forge N1 - historiques Arquebusier tous peuples
# Recette de requalification sur version N1 Mercenaire hybride corrigée le 03 novembre 2026.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-arq-history-people.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_history_people_cross.cjs'
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier les historiques des huit peuples et leurs rangs de niveau 1
        id: run
        continue-on-error: true
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_history_people_cross.cjs
      - name: Actualiser les critères historiques sans les déclarer entièrement certifiés
        if: steps.run.outcome == 'success'
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          node - <<'NODE'
          const p=require('./forge-of-heroes/QA/N1/arquebusier-history-people-cross.json');
          const f=require('./centre-synchronisation/forge-n1/focus.json');
          if(p.counts.cases!==1152 || p.counts.passed!==1120 || p.counts.legallyRejected!==32 || p.counts.failed || p.inputs[0].sha256!==f.canonicalIndexSha256 || f.profile.checks.find(x=>x.id==='history')?.status==='ACQUIS')process.exit(1);
          console.log('Historique sur index officiel : 1120 PASS, 32 rejets légaux, zéro échec. Critère historique complet reste ouvert.');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-arquebusier-historiques-races
          path: forge-of-heroes/QA/N1/arquebusier-history-people-cross.json
      - name: Publier les constats même en cas d'erreur
        if: always()
        run: |
          if test -f forge-of-heroes/QA/N1/arquebusier-history-people-cross.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forge-of-heroes/QA/N1/arquebusier-history-people-cross.json centre-synchronisation/forge-n1/focus.json
            if ! git diff --cached --quiet; then
              git commit -m "audit(forge-n1): historiques Arquebusier par peuple [skip ci]"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Statut des règles
        if: steps.run.outcome == 'failure'
        run: exit 1
