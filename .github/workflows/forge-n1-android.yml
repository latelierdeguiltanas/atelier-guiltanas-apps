name: Forge N1 Android
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-android.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/android_creation_click.cjs'
permissions:
  contents: read
jobs:
  android-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android emulator and test client
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          npm install --prefix "$RUNNER_TEMP/forge-click" playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/forge-click/node_modules" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run Android creation journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell pm path com.android.chrome
            python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/http.log 2>&1 &
            adb reverse tcp:4173 tcp:4173
            node forge-of-heroes/FINAL_FREEZE_TESTS/android_creation_click.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-android-evidence
          path: |
            android-state.json
            android-sheet.png
