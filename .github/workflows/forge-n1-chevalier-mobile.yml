name: Forge N1 - parcours mobiles Chevalier
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-chevalier-mobile.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_chevalier_choices_click.cjs'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Créer et rouvrir un Chevalier sur les huit peuples
        run: |
          npm install --prefix /tmp/forge-test --no-package-lock playwright
          python3 -m http.server 4173 &
          export NODE_PATH=/tmp/forge-test/node_modules
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_chevalier_choices_click.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chevalier-choices-chrome
          path: forge-of-heroes/QA/N1/chevalier-choices-chrome.json
