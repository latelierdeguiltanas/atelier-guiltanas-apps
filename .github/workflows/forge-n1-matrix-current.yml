name: Forge N1 - matrice exhaustive empreinte actuelle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-matrix-current.yml'
permissions:
  contents: write
concurrency:
  group: forge-n1-current-matrix
  cancel-in-progress: false
jobs:
  recompute-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rejouer la matrice N1 entière sur moteur et DB actuels (8 processus)
        id: matrix
        continue-on-error: true
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_matrix_batch.cjs
      - name: Recalculer la parité cryptographique après la campagne
        if: always()
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_version_parity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-current-matrix-evidence
          if-no-files-found: error
          path: |
            forge-of-heroes/QA/N1/matrix.json
            forge-of-heroes/QA/N1/version-parity.json
      - name: Conserver résultats exacts sans modifier les scores de certification
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/QA/N1/matrix.json forge-of-heroes/QA/N1/version-parity.json
          if ! git diff --cached --quiet; then
            git commit -m "test(forge-n1): matrice complète moteur/DB actuels, statut réel [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Échouer si une seule assertion de la matrice a échoué
        if: steps.matrix.outcome == 'failure'
        run: exit 1
