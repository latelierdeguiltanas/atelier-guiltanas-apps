name: Forge N1 - matrice exhaustive empreinte actuelle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-matrix-current.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: forge-n1-current-matrix
  cancel-in-progress: false
jobs:
  recompute-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reprendre la preuve réelle des huit shards terminés le 02 novembre
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/forge-n1-current-matrix-evidence
          gh run download 41502015748 --repo "$GITHUB_REPOSITORY" --name forge-n1-current-matrix-evidence --dir /tmp/forge-n1-current-matrix-evidence
          cp /tmp/forge-n1-current-matrix-evidence/matrix.json forge-of-heroes/QA/N1/matrix.json
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const root='forge-of-heroes/';
          const matrix=JSON.parse(fs.readFileSync(root+'QA/N1/matrix.json','utf8'));
          const read=n=>fs.readFileSync(root+n,'utf8');
          const index=read('index.html');
          const engine=JSON.parse(index.match(/<script id="FOH_DB_JSON"[^>]*>([\s\S]*?)<\/script>/)?.[1]||'{}');
          const sum=Object.values(matrix.results).reduce((n,v)=>n+v.attempted,0);
          if(!matrix.workerExitCodes||matrix.workerExitCodes.length!==8||matrix.workerExitCodes.some(n=>n!==0)||matrix.assertionFailures.length||sum!==200625){throw Error('Matrices non conformes au batch exécuté : '+sum);}
          console.log('Matrice réelle : '+sum+' cas, 8 processus exit 0, aucune assertion en échec');
          NODE
      - name: Contrôler les preuves et refuser les empreintes moteur périmées
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_version_parity.cjs
          node - <<'NODE'
          const p=require('./forge-of-heroes/QA/N1/version-parity.json');
          if(!p.matrixMechanicsReusable||!p.checks.matrixNoAssertionFailure||!p.checks.productMasterEngineIdentical||!p.checks.productMasterDbIdentical)throw Error('La matrice ne correspond pas au moteur et à la DB courants');
          console.log('Parité de la matrice au moteur courant : VALIDÉE');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: forge-n1-current-matrix-evidence
          if-no-files-found: error
          path: |
            forge-of-heroes/QA/N1/matrix.json
            forge-of-heroes/QA/N1/version-parity.json
      - name: Conserver résultats exacts sans modifier les scores de certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/QA/N1/matrix.json forge-of-heroes/QA/N1/version-parity.json
          if ! git diff --cached --quiet; then
            git commit -m "test(forge-n1): publier 200625 preuves courantes validées sans faux 100 pct [skip ci]"
            git restore --worktree .
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 3
            done
          fi
