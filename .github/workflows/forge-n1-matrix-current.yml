name: Forge N1 - matrice exhaustive empreinte actuelle
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-matrix-current.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: forge-n1-current-matrix
  cancel-in-progress: false
jobs:
  recompute-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Calculer de nouveau toute la matrice N1 (huit travailleurs sur moteurs corrigés)
        id: matrix
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_matrix_batch.cjs
          node - <<'NODE'
          const fs=require('fs'),m=require('./forge-of-heroes/QA/N1/matrix.json');
          const sum=Object.values(m.results).reduce((n,x)=>n+(x.attempted||0),0);
          if(m.workerExitCodes?.length!==8||m.workerExitCodes.some(x=>x!==0)||m.assertionFailures?.length||sum!==200625)throw Error('Matrice non conforme : '+sum+' essais / '+m.assertionFailures?.length+' erreurs');
          console.log('Version courante : '+sum+' essais N1, 8 shards terminés, zéro assertion en échec');
          NODE
      - name: Contrôler les preuves et refuser les empreintes moteur périmées
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_version_parity.cjs
          node - <<'NODE'
          const p=require('./forge-of-heroes/QA/N1/version-parity.json');
          if(!p.matrixMechanicsReusable||!p.checks.matrixNoAssertionFailure||!p.checks.productMasterEngineIdentical||!p.checks.productMasterDbIdentical)throw Error('La matrice ne correspond pas au moteur et à la DB courants');
          console.log('Parité de la matrice au moteur courant : VALIDÉE');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: forge-n1-current-matrix-evidence
          if-no-files-found: error
          path: |
            forge-of-heroes/QA/N1/matrix.json
            forge-of-heroes/QA/N1/version-parity.json
      - name: Conserver résultats exacts sans modifier les scores de certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/QA/N1/matrix.json forge-of-heroes/QA/N1/version-parity.json
          if ! git diff --cached --quiet; then
            git commit -m "test(forge-n1): publier 200625 preuves courantes validées sans faux 100 pct [skip ci]"
            git restore --worktree .
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 3
            done
          fi
