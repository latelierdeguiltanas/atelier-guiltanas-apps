name: Forge N1 - official methods cross
# Requalification courante de la base COF2 après correction Mercenaire hybride, p.65.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-official-methods-cross.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_official_methods_cross.cjs'
permissions:
  contents: write
jobs:
  methods:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run official peoples and profiles methods cross
        id: run
        continue-on-error: true
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_official_methods_cross.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-official-methods-cross
          if-no-files-found: error
          path: forge-of-heroes/QA/N1/official-methods-cross.json
      - name: Commit raw results even when cross is not certified
        if: always()
        run: |
          if test -f forge-of-heroes/QA/N1/official-methods-cross.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forge-of-heroes/QA/N1/official-methods-cross.json
            if ! git diff --cached --quiet; then
              git commit -m "test(forge-n1): statut méthodes x peuples/profils [skip ci]"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Require all source checks to pass
        if: steps.run.outcome == 'failure'
        run: exit 1
