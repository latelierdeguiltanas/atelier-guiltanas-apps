name: Forge N1 - audit source de la variante Arbaletrier
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-arbaletrier-audit.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_arbaletrier_audit.cjs'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparer la variante intégrée avec le Livre de base
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_powderless_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_arbaletrier_audit.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_equipment_oracle.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-variant-arbaletrier-source
          path: |
            forge-of-heroes/QA/N1/arquebusier-arbaletrier-source-audit.json
            forge-of-heroes/QA/N1/arquebusier-equipment-source.json
# The historical virtual prototype is retained in git history. Production source
# and real UI are now checked by the source-fixes workflow, which owns publication.
