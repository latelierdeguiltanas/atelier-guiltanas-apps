name: Forge N1 - audit source de la variante Arbaletrier
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-arbaletrier-audit.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_arbaletrier_audit.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_blueprint.cjs'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparer la variante du Livre de base avec Forge
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_arbaletrier_audit.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_blueprint.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: audit-variant-arbaletrier-source
          path: |
            forge-of-heroes/QA/N1/arquebusier-arbaletrier-source-audit.json
            forge-of-heroes/QA/N1/arbaletrier-blueprint.json
      - name: Conserver le constat, même si la variante manque
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/QA/N1/arquebusier-arbaletrier-source-audit.json forge-of-heroes/QA/N1/arbaletrier-blueprint.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(forge-n1): variante Arbaletrier exacte selon COF2 p62 [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
