name: Publish Forge N1 correction

on:
  push:
    paths:
      - '.github/workflows/publish-forge-n1-fix.yml'

permissions:
  contents: write

jobs:
  publish-forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified Forge-only patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/forge-n1.patch
          git apply --check /tmp/forge-n1.patch
          git apply /tmp/forge-n1.patch
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Ev '^forge-of-heroes/(index\.html|FORGE_OF_HEROES_ATELIER_GUILTANAS_PRODUCT_MASTER\.html)$'; then
            echo "Unexpected path outside Forge production HTML"
            exit 1
          fi
      - name: Commit Forge publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/index.html forge-of-heroes/FORGE_OF_HEROES_ATELIER_GUILTANAS_PRODUCT_MASTER.html
          git commit -m "Forge N1: ajouter rapport de test et échanges de caractéristiques"
          git push
