name: Forge N1 - official progress ledger
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-official-progress.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_official_progress_ledger.cjs'
      - 'forge-of-heroes/QA/N1/native-items.json'
      - 'forge-of-heroes/QA/N1/matrix.json'
      - 'forge-of-heroes/QA/N1/regressions.json'
      - 'forge-of-heroes/QA/N1/version-parity.json'
      - 'forge-of-heroes/QA/N1/lot10/people-source.json'
permissions:
  contents: write
concurrency:
  group: forge-n1-official-progress-current
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier que les trois campagnes utilisent les empreintes actuelles
        id: readiness
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const root='forge-of-heroes/QA/N1/';
          const read=n=>JSON.parse(fs.readFileSync(root+n+'.json','utf8'));
          const [p,n,r]=['version-parity','native-items','regressions'].map(read);
          const ready=!!(p.matrixMechanicsReusable&&p.current.index===n.indexSha256&&p.current.index===r.indexSha256&&r.status==='PASS'&&r.passed===37&&n.summary.failed===0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'ready='+ready+'\n');
          console.log(ready?'PREUVES COURANTES : calcul des pourcentages autorisé':'EN ATTENTE : preuves anciennes, scores conservés sans faux renouvellement');
          NODE
      - name: Classify official refusals and compute source-backed per-item percentages
        if: steps.readiness.outputs.ready == 'true'
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_official_progress_ledger.cjs
      - name: Verify ledger schema and impossible false green
        if: steps.readiness.outputs.ready == 'true'
        run: |
          node - <<'NODE'
          const d=require('./centre-synchronisation/forge-n1/progress.json');
          if(d.peoples.length!==8||d.profiles.length!==14)process.exit(1);
          if(d.summary.unclassifiedRejected!==0||d.summary.failed!==0)process.exit(1);
          if(d.peoples.some(x=>x.percent===100)||d.profiles.some(x=>x.percent===100))process.exit(1);
          console.log('22 official items; scores from explicit evidence gates');
          NODE
      - uses: actions/upload-artifact@v4
        if: steps.readiness.outputs.ready == 'true'
        with:
          name: forge-n1-official-audit-percentages
          path: |
            centre-synchronisation/forge-n1/progress.json
            forge-of-heroes/QA/N1/native-rejection-legality.json
      - name: Recalculer les pourcentages certifiables sur main au moment de publier
        if: steps.readiness.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_version_parity.cjs
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_official_progress_ledger.cjs
            git add forge-of-heroes/QA/N1/version-parity.json centre-synchronisation/forge-n1/progress.json forge-of-heroes/QA/N1/native-rejection-legality.json
            if git diff --cached --quiet; then
              echo "La progression officielle est déjà publiée"
              exit 0
            fi
            git commit -m "docs(cockpit): audit actuel des 14 profils et 8 peuples, 520 refus Mercenaire qualifiés [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 3
          done
