name: Forge N1 parcours au clic
on:
  push:
    paths:
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_creation_browser_pack.cjs'
      - 'forge-of-heroes/index.html'
      - '.github/workflows/forge-n1-clics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recette:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.55.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_creation_browser_pack.cjs
        env:
          DEBUG: ''
      - run: cat n1-click-results.json
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-clics
          path: n1-click-results.json
