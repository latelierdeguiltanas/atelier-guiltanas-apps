name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rebuild comic source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          src_dir = Path('ile-aux-tempetes/journal/bd/01p')
          parts = [p.read_text(encoding='utf-8').strip() for p in sorted(src_dir.glob('c*.txt'))]
          if not parts:
              raise SystemExit('No comic source chunks found')
          raw = base64.b64decode(''.join(parts))
          target = Path('/tmp/planche1_source.webp')
          target.write_bytes(raw)
          print('Source rebuilt:', target, len(raw), 'bytes')
          PY

      - name: Restore artwork with Real-ESRGAN
        continue-on-error: true
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2' pillow opencv-python-headless
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          python -m pip install -r /tmp/Real-ESRGAN/requirements.txt
          python -m pip install -e /tmp/Real-ESRGAN
          mkdir -p /tmp/Real-ESRGAN/weights /tmp/realesrgan
          curl -L --fail --retry 3 -o /tmp/Real-ESRGAN/weights/RealESRGAN_x4plus_anime_6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py \
            -n RealESRGAN_x4plus_anime_6B \
            -i /tmp/planche1_source.webp \
            -o /tmp/realesrgan \
            --fp32 \
            -t 128 \
            --ext png

      - name: Build mobile comic panels
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          restored = Path('/tmp/realesrgan/planche1_source_out.png')
          original = Path('/tmp/planche1_source.webp')
          if restored.exists():
              im = Image.open(restored).convert('RGB')
              print('Using Real-ESRGAN restoration:', im.size)
          else:
              im = Image.open(original).convert('RGB')
              # Safe fallback only: the mobile crops still avoid pinch-zoom.
              im = im.resize((im.width * 4, im.height * 4), Image.Resampling.LANCZOS)
              im = im.filter(ImageFilter.UnsharpMask(radius=1.0, percent=110, threshold=2))
              print('Real-ESRGAN unavailable; using mobile-reader fallback:', im.size)

          reference_w, reference_h = 1055, 1491
          boxes = [
              (0,0,365,378),
              (345,0,695,378),
              (675,0,1055,378),
              (0,368,325,633),
              (305,368,665,633),
              (645,368,1055,633),
              (0,623,560,782),
              (495,623,1055,782),
              (0,770,370,954),
              (350,770,690,954),
              (670,770,1055,954),
              (0,944,560,1182),
              (495,944,1055,1182),
              (0,1173,580,1491),
              (475,1173,1055,1491),
          ]
          sx, sy = im.width / reference_w, im.height / reference_h
          outdir = Path('ile-aux-tempetes/journal/bd/mobile')
          outdir.mkdir(parents=True, exist_ok=True)

          for i, (x1,y1,x2,y2) in enumerate(boxes, 1):
              box = (round(x1*sx), round(y1*sy), round(x2*sx), round(y2*sy))
              crop = im.crop(box)
              crop.save(outdir / f'p01-{i:02d}.webp', 'WEBP', quality=92, method=6)
              print(f'panel {i:02d}', crop.size)

          full = im
          if full.width > 1920:
              nh = round(full.height * 1920 / full.width)
              full = full.resize((1920, nh), Image.Resampling.LANCZOS)
          full.save(outdir / 'p01-full.webp', 'WEBP', quality=86, method=6)
          print('Mobile reader built:', len(boxes), 'panels')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
