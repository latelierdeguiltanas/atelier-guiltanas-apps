name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rebuild comic sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          # Planche 1 : source historique en segments texte.
          src_dir = Path('ile-aux-tempetes/journal/bd/01p')
          parts = [p.read_text(encoding='utf-8').strip() for p in sorted(src_dir.glob('c*.txt'))]
          if not parts:
              raise SystemExit('No comic source chunks found for page 1')
          raw = base64.b64decode(''.join(parts))
          target = Path('/tmp/planche1_source.webp')
          target.write_bytes(raw)
          print('Page 1 source rebuilt:', target, len(raw), 'bytes')

          # Planches 2 à 4 : sources JPEG encodées en base64 dans le dépôt.
          for page in (2, 3, 4):
              source = Path(f'ile-aux-tempetes/journal/bd/sources/p{page:02d}.b64')
              if not source.exists():
                  raise SystemExit(f'Missing source file for page {page}: {source}')
              raw = base64.b64decode(source.read_text(encoding='utf-8').strip())
              target = Path(f'/tmp/planche{page}_source.jpg')
              target.write_bytes(raw)
              print(f'Page {page} source rebuilt:', target, len(raw), 'bytes')
          PY

      - name: Restore page 1 artwork with Real-ESRGAN
        continue-on-error: true
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip install 'numpy<2' pillow opencv-python-headless
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          git clone --depth 1 https://github.com/xinntao/Real-ESRGAN.git /tmp/Real-ESRGAN
          python -m pip install -r /tmp/Real-ESRGAN/requirements.txt
          python -m pip install -e /tmp/Real-ESRGAN
          mkdir -p /tmp/Real-ESRGAN/weights /tmp/realesrgan
          curl -L --fail --retry 3 -o /tmp/Real-ESRGAN/weights/RealESRGAN_x4plus_anime_6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
          cd /tmp/Real-ESRGAN
          python inference_realesrgan.py \
            -n RealESRGAN_x4plus_anime_6B \
            -i /tmp/planche1_source.webp \
            -o /tmp/realesrgan \
            --fp32 \
            -t 128 \
            --ext png

      - name: Build mobile comic panels
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          reference_w, reference_h = 1055, 1491
          outdir = Path('ile-aux-tempetes/journal/bd/mobile')
          outdir.mkdir(parents=True, exist_ok=True)

          boxes = {
              1: [
                  (0,0,365,378),(345,0,695,378),(675,0,1055,378),
                  (0,368,325,633),(305,368,665,633),(645,368,1055,633),
                  (0,623,560,782),(495,623,1055,782),
                  (0,770,370,954),(350,770,690,954),(670,770,1055,954),
                  (0,944,560,1182),(495,944,1055,1182),
                  (0,1173,580,1491),(475,1173,1055,1491),
              ],
              2: [
                  (0,0,540,195),(515,0,1055,195),
                  (0,190,525,390),(515,190,1055,390),
                  (0,385,1055,570),(0,565,1055,800),
                  (0,795,580,990),(565,795,1055,990),
                  (0,985,505,1182),(490,985,1055,1182),
                  (0,1175,1055,1491),
              ],
              3: [
                  (0,0,520,300),(500,0,1055,300),
                  (0,295,520,550),(500,295,1055,550),
                  (0,545,530,800),(510,545,1055,800),
                  (0,795,510,1078),(490,795,1055,1078),
                  (0,1072,535,1390),(515,1072,1055,1390),
              ],
              4: [
                  (0,0,585,305),(575,0,1055,305),
                  (0,300,565,575),(555,300,1055,575),
                  (0,570,645,980),(635,570,1055,980),
                  (0,970,430,1390),(360,970,750,1390),(700,970,1055,1390),
              ],
          }

          def load_page(page):
              if page == 1:
                  restored = Path('/tmp/realesrgan/planche1_source_out.png')
                  original = Path('/tmp/planche1_source.webp')
                  if restored.exists():
                      im = Image.open(restored).convert('RGB')
                      print('Page 1: using Real-ESRGAN restoration', im.size)
                      return im
                  im = Image.open(original).convert('RGB')
                  im = im.resize((im.width * 4, im.height * 4), Image.Resampling.LANCZOS)
                  im = im.filter(ImageFilter.UnsharpMask(radius=1.0, percent=110, threshold=2))
                  print('Page 1: using safe fallback', im.size)
                  return im

              im = Image.open(f'/tmp/planche{page}_source.jpg').convert('RGB')
              # Le lecteur repose surtout sur le recadrage. On agrandit seulement la
              # source de travail pour obtenir un rendu plus doux à l'écran mobile.
              target_w = max(1600, im.width)
              if im.width < target_w:
                  target_h = round(im.height * target_w / im.width)
                  im = im.resize((target_w, target_h), Image.Resampling.LANCZOS)
                  im = im.filter(ImageFilter.UnsharpMask(radius=1.0, percent=105, threshold=2))
              print(f'Page {page}: mobile source', im.size)
              return im

          for page in (1, 2, 3, 4):
              im = load_page(page)
              sx, sy = im.width / reference_w, im.height / reference_h

              for i, (x1,y1,x2,y2) in enumerate(boxes[page], 1):
                  box = (round(x1*sx), round(y1*sy), round(x2*sx), round(y2*sy))
                  crop = im.crop(box)
                  crop.save(outdir / f'p{page:02d}-{i:02d}.webp', 'WEBP', quality=92, method=6)
                  print(f'page {page} panel {i:02d}', crop.size)

              full = im
              if full.width > 1920:
                  nh = round(full.height * 1920 / full.width)
                  full = full.resize((1920, nh), Image.Resampling.LANCZOS)
              full.save(outdir / f'p{page:02d}-full.webp', 'WEBP', quality=88, method=6)
              print(f'Page {page} mobile reader built:', len(boxes[page]), 'panels')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
