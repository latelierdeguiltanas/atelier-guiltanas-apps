name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed HD comic page
        shell: python
        run: |
          from pathlib import Path
          import base64

          html_path = Path('ile-aux-tempetes/journal/bd.html')
          image_path = Path('ile-aux-tempetes/journal/bd/planche1_hd.jpg')
          placeholder = '__BD_PLANCHE1_DATA__'

          html = html_path.read_text(encoding='utf-8')
          if placeholder not in html:
              raise SystemExit('BD placeholder missing from bd.html')
          if not image_path.exists():
              raise SystemExit('HD comic image missing')

          encoded = base64.b64encode(image_path.read_bytes()).decode('ascii')
          data_url = 'data:image/jpeg;base64,' + encoded
          html_path.write_text(html.replace(placeholder, data_url), encoding='utf-8')

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
