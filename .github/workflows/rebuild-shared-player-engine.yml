name: Rebuild rich shared player engine

on:
  push:
    paths:
      - '.github/workflows/rebuild-shared-player-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild generic rich engine
        shell: python
        run: |
          import base64, gzip, pathlib, re
          root=pathlib.Path('.')
          d=root/'ile-aux-tempetes/personnages/hammerz'
          parts=[]
          for i in (1,2):
              t=(d/f'p{i}.js').read_text()
              m=re.search(r"='([^']*)'",t,re.S)
              if not m: raise RuntimeError(f'Hammerz p{i} illisible')
              parts.append(m.group(1))
          html=gzip.decompress(base64.b64decode(''.join(parts))).decode()
          html=re.sub(r'<title>.*?</title>','<title>Interface personnage — Île aux Tempêtes</title>',html,count=1)
          hero='<div class="hero"><div class="heroid"><img id="heroAvatar" class="avatar" alt=""><div><div class="name" id="heroName"></div><div class="sub" id="heroSub"></div></div></div><div class="pill" id="heroLevel"></div></div>'
          html=re.sub(r'<div class="hero">.*?</div><input id="search"',hero+'<input id="search"',html,count=1,flags=re.S)
          start=html.index('const DATA=')
          end=html.index(';\nconst KEY=',start)
          repl="const DATA=window.__IAT_PLAYER_DATA;if(!DATA)throw new Error('Données personnage absentes');document.getElementById('heroName').textContent=DATA.name;document.getElementById('heroSub').textContent=DATA.species+' • '+DATA.class+' niveau '+DATA.level+' • '+DATA.background;document.getElementById('heroLevel').textContent='Niveau '+DATA.level;const av=document.getElementById('heroAvatar');av.src=DATA.portrait||('../../assets/personnages/'+DATA.id+'.jpg');av.alt='Figurine de '+DATA.name"
          html=html[:start]+repl+html[end:]
          marker='<script>\nconst DATA=window.__IAT_PLAYER_DATA'
          if marker not in html: raise RuntimeError('Point insertion data.js introuvable')
          html=html.replace(marker,'<script src="data.js"></script><script>\nconst DATA=window.__IAT_PLAYER_DATA',1)
          out=root/'ile-aux-tempetes/personnages/shared/engine.html'
          out.write_text(html)
      - name: Commit engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ile-aux-tempetes/personnages/shared/engine.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "IAT: restore rich novice-friendly shared player engine"
          git push
