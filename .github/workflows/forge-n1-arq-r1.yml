name: Forge N1 - audit des rangs 1 Arquebusier
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-arq-r1.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_r1_probe.cjs'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Examiner les effets des rangs 1 dans les deux moteurs
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_r1_probe.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: arq-r1-audit-engine
          path: forge-of-heroes/QA/N1/arquebusier-r1-probe.json
      - name: Conserver le rapport d'audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/QA/N1/arquebusier-r1-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "audit(forge-n1): points de règle Arquebusier R1 [skip ci]"
            for attempt in 1 2 3 4; do
              git fetch origin main && git rebase origin/main && git push origin HEAD:main && break
              if [ "$attempt" = 4 ]; then exit 1; fi
              sleep 2
            done
          fi
