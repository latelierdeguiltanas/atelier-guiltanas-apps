name: Forge - produit unique de production et de test
on:
  push:
    paths:
      - '.github/workflows/forge-one-product.yml'
      - 'forge-of-heroes/scripts/consolidate-single-forge.cjs'
      - 'forge-of-heroes/index.html'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/**'
      - 'forge-of-heroes/ENGINE/**'
      - 'forge-of-heroes/rules/**'
      - 'forge-of-heroes/scripts/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-one-product-guard
  cancel-in-progress: true
jobs:
  verify-single-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier que seul index.html reste une Forge exécutable
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum forge-of-heroes/index.html | cut -d' ' -f1)"
          test ! -e forge-of-heroes/FORGE_OF_HEROES_ATELIER_GUILTANAS_PRODUCT_MASTER.html
          test "$(find forge-of-heroes -maxdepth 1 -name '*.html' | wc -l)" -eq 1
          legacy='FORGE_OF_HEROES_ATELIER_GUILTANAS_PRODUCT_MASTER'
          if grep -R -F "${legacy}.html" .github/workflows --exclude=forge-one-product.yml; then
            echo 'Un workflow utilise encore la seconde Forge' >&2
            exit 1
          fi
          test "$before" = "$(sha256sum forge-of-heroes/index.html | cut -d' ' -f1)"
          git diff --exit-code -- forge-of-heroes/index.html
      - name: Check syntax and load the real N1 engine
        shell: bash
        run: |
          set -euo pipefail
          find forge-of-heroes/FINAL_FREEZE_TESTS forge-of-heroes/ENGINE forge-of-heroes/rules forge-of-heroes/progression forge-of-heroes/scripts -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0 | xargs -0 -n 1 node --check
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const path=require('node:path');
          const product=require('./forge-of-heroes/FINAL_FREEZE_TESTS/forge_product_runner.js');
          const p=path.resolve('forge-of-heroes/index.html');
          assert.equal(product.PRODUCT,p);
          const {html,db,engine}=product.load(p);
          assert(html.includes('FOH_ENGINE_BUNDLE'));
          assert(db.tables.classes.length>=14);
          assert.equal(typeof engine.computeCharacterN1,'function');
          console.log('Single canonical Forge loaded:',db.tables.classes.length,'profiles');
          NODE
