name: Forge N1 - artilleur quinze capacites contexte
# Recette de requalification sur version N1 Mercenaire hybride corrigée le 03 novembre 2026.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-arq-context.yml'
      - 'forge-of-heroes/ENGINE/arquebusier_context_n1.js'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs'
      - 'forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_hybrid_powder_safety.cjs'
permissions:
  contents: write
concurrency:
  group: forge-n1-arq-context-proof
  cancel-in-progress: false
jobs:
  contextual:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier syntaxe et toutes les situations de rang 1 à 3
        id: tests
        continue-on-error: true
        run: |
          node --check forge-of-heroes/ENGINE/arquebusier_context_n1.js
          node --check forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pure_age_ranks.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_hybrid_powder_safety.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-arq-context-scenario-evidence
          path: |
            forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json
            forge-of-heroes/QA/N1/arquebusier-context-canonical.json
            forge-of-heroes/QA/N1/arquebusier-hybrid-powder-safety.json
      - name: Recalculer et publier les preuves sur la dernière version du dépôt
        if: steps.tests.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pure_age_ranks.cjs
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_oracle.cjs
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_hybrid_powder_safety.cjs
            git add forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json forge-of-heroes/QA/N1/arquebusier-context-canonical.json forge-of-heroes/QA/N1/arquebusier-hybrid-powder-safety.json
            if git diff --cached --quiet; then
              echo "Preuves identiques déjà archivées"
              exit 0
            fi
            git commit -m "test(forge-n1): R1 R2 R3 conditionnels vérifiés sur dernière release [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 5 ]; then exit 1; fi
            sleep 3
          done
      - name: Échouer pour toute divergence avec les règles
        if: steps.tests.outcome == 'failure'
        run: exit 1
