name: Forge N1 - demi-elfe source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-demi-elfe.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_demi_elfe_source_runner.cjs'
permissions:
  contents: write
jobs:
  inherited-r1-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare ancestry choices and stats R1 R2 to COF2
        id: tests
        continue-on-error: true
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_demi_elfe_source_runner.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-demi-elfe-source-r1-r2
          path: forge-of-heroes/QA/N1/demi-elfe-source-r1-r2.json
      - name: Save report for itemized Cockpit ledger
        if: always()
        run: |
          if test -f forge-of-heroes/QA/N1/demi-elfe-source-r1-r2.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forge-of-heroes/QA/N1/demi-elfe-source-r1-r2.json
            if ! git diff --cached --quiet; then
              git commit -m "test(forge-n1): demi-elfe statut des rangs d'héritage [skip ci]"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
      - name: Require test pass
        if: steps.tests.outcome == 'failure'
        run: exit 1
