name: Cockpit - ouverture automatique profils purs N1
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cockpit-n1-purs-click.yml'
      - 'centre-synchronisation/forge-quality-panel.js'
      - 'centre-synchronisation/index.html'
      - 'centre-synchronisation/pilotage.js'
      - 'centre-synchronisation/forge-n1/purs.html'
      - 'centre-synchronisation/forge-n1/qa_purs_click.cjs'
      - 'centre-synchronisation/forge-n1/purs.json'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chrome test driver
        run: |
          npm install --prefix "$RUNNER_TEMP/foh-click" playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/foh-click/node_modules" >> "$GITHUB_ENV"
      - name: Test mobile and automatic project drawer display
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/foh-purs-server.log 2>&1 &
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node centre-synchronisation/forge-n1/qa_purs_click.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cockpit-n1-purs-real-click
          if-no-files-found: warn
          path: forge-n1-pure-click-result.json
