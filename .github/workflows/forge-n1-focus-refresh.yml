name: Forge N1 - actualiser certificat du profil prioritaire
# Regénération après preuves de clic et correctif N1 du 4 novembre.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-focus-refresh.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs'
      - 'forge-of-heroes/QA/N1/arquebusier-pure-age-ranks.json'
      - 'forge-of-heroes/QA/N1/arquebusier-pdf-real-click.json'
      - 'forge-of-heroes/QA/N1/arquebusier-all-mechanics-probe.json'
      - 'forge-of-heroes/QA/N1/arquebusier-all-pairs-current.json'
permissions:
  contents: write
jobs:
  focus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regénérer les 14 places et huit peuples sans faux 100 pour cent
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_r2_gate.cjs
      - name: Exiger l’ordre des profils et la réalité des preuves
        run: |
          node - <<'NODE'
          const f=require('./centre-synchronisation/forge-n1/focus.json');
          if(f.profile.name!=='Arquebusier'||f.profile.percent!==Math.round(100*f.profile.passed/f.profile.total)||f.profile.percent===100||f.summary.profilesCertified!==0||f.summary.peoplesCertified!==0)throw Error('Le taux ne doit pas augmenter sans contrôle intégral');
          if(f.certificationPlan.queue.length!==14||f.peoples.length!==8)throw Error('Couverture incorrecte');
          console.log('Priorité stricte : Arquebusier '+f.profile.passed+'/'+f.profile.total+' critères, huit peuples et certificat non artificiel');
          NODE
      - name: Publier uniquement la progression étayée
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            # Isolated CI checkout: recompute against the latest product and proofs.
            git reset --hard origin/main
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_r2_gate.cjs
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_gear_gate.cjs
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_gate.cjs
            node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_derived_gate.cjs
            node - <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),file='centre-synchronisation/forge-n1/focus.json';
          const before=cp.execFileSync('git',['show','HEAD:'+file],{encoding:'utf8'}),a=JSON.parse(before),b=JSON.parse(fs.readFileSync(file,'utf8'));
          delete a.generatedAt;delete b.generatedAt;
          if(JSON.stringify(a)===JSON.stringify(b))fs.writeFileSync(file,before);
          NODE
            git add centre-synchronisation/forge-n1/focus.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "docs(cockpit): preuves actuelles Arquebusier sans faux 100 % [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
