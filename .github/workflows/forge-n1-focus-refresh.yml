name: Forge N1 - verifier le registre courant
on:
  workflow_dispatch:
  push:
    paths:
      - 'forge-of-heroes/index.html'
      - 'forge-of-heroes/rules/*.js'
      - 'fiches-personnages/fiche/fiche.js'
      - 'fiches-personnages/fiche/index.html'
      - '.github/workflows/forge-n1-focus-refresh.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_certification_register.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_batch_rank_persistence.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_high_rank_access.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_finite_choices.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_dynamic_choices.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_multi_choices.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_origins_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_conditions_oracle.cjs'
      - 'forge-of-heroes/QA/N1/arquebusier-history-professions.json'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_base_spell_costs.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_register_contract.cjs'
      - 'forge-of-heroes/QA/N1/lot-2026-11-19/**'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_pair_numeric_oracle.cjs'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_ancestry_stat_gate.cjs'
      - 'forge-of-heroes/QA/N1/lot2/characteristic-methods.json'
      - 'fiches-personnages/tests/matrix-transfer.cjs'
      - 'fiches-personnages/library.js'
      - 'forge-of-heroes/native-progression.js'
permissions:
  contents: read
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate from dependency-matched proofs and reject false certificates
        run: |
          FOH_BATCH_RANK_REPORT="$RUNNER_TEMP/rank-persistence-batch.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_batch_rank_persistence.cjs
          cmp "$RUNNER_TEMP/rank-persistence-batch.json" forge-of-heroes/QA/N1/lot-2026-11-19/rank-persistence-batch.json
          FOH_N1_HIGH_RANK_REPORT="$RUNNER_TEMP/high-rank-access.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_high_rank_access.cjs
          cmp "$RUNNER_TEMP/high-rank-access.json" forge-of-heroes/QA/N1/lot-2026-11-19/high-rank-access.json
          FOH_N1_CHOICE_REPORT="$RUNNER_TEMP/finite-choices.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_finite_choices.cjs
          cmp "$RUNNER_TEMP/finite-choices.json" forge-of-heroes/QA/N1/lot-2026-11-19/finite-choices.json
          FOH_N1_MANA_REPORT="$RUNNER_TEMP/standard-spell-costs.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_base_spell_costs.cjs
          cmp "$RUNNER_TEMP/standard-spell-costs.json" forge-of-heroes/QA/N1/lot-2026-11-19/standard-spell-costs.json
          FOH_N1_DYNAMIC_CHOICE_REPORT="$RUNNER_TEMP/dynamic-choices.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_dynamic_choices.cjs
          cmp "$RUNNER_TEMP/dynamic-choices.json" forge-of-heroes/QA/N1/lot-2026-11-19/dynamic-choices.json
          FOH_N1_MULTI_CHOICE_REPORT="$RUNNER_TEMP/multi-choices.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_multi_choices.cjs
          cmp "$RUNNER_TEMP/multi-choices.json" forge-of-heroes/QA/N1/lot-2026-11-19/multi-choices.json
          FOH_N1_HISTORY_ORIGINS_REPORT="$RUNNER_TEMP/history-origins.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_origins_oracle.cjs
          cmp "$RUNNER_TEMP/history-origins.json" forge-of-heroes/QA/N1/arquebusier-history-origins.json
          FOH_PRO_CONDITIONS_REPORT="$RUNNER_TEMP/history-conditions.json" FOH_PROFESSIONS_REPORT="$RUNNER_TEMP/history-professions.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_conditions_oracle.cjs
          cmp "$RUNNER_TEMP/history-professions.json" forge-of-heroes/QA/N1/arquebusier-history-professions.json
          FOH_N1_TRANSFER_REPORT="$RUNNER_TEMP/pair-transfer.json" node fiches-personnages/tests/matrix-transfer.cjs
          cmp "$RUNNER_TEMP/pair-transfer.json" forge-of-heroes/QA/N1/lot-2026-11-19/pair-transfer.json
          FOH_ORACLE_REPORT="$RUNNER_TEMP/pair-numerics.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_pair_numeric_oracle.cjs
          cmp "$RUNNER_TEMP/pair-numerics.json" forge-of-heroes/QA/N1/lot-2026-11-19/pair-numerics.json
          FOH_N1_ANCESTRY_STAT_REPORT="$RUNNER_TEMP/ancestry-stats.json" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_ancestry_stat_gate.cjs
          cmp "$RUNNER_TEMP/ancestry-stats.json" forge-of-heroes/QA/N1/lot-2026-11-19/ancestry-stats.json
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_register_contract.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: forge-n1-current-register
          path: |
            forge-of-heroes/QA/N1/lot-2026-11-19/coverage-register.json
            centre-synchronisation/forge-n1/focus.json
