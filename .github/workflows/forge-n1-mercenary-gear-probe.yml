name: Forge N1 - Mercenaire hybride bouclier et poudre
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-mercenary-gear-probe.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_mercenary_hybrid_gear_probe.cjs'
      - 'forge-of-heroes/index.html'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Quatre opérations source et 16 créations de Guerrier/Mercenaire
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_mercenary_hybrid_gear_probe.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: foh-n1-mercenary-hybrid-gear-observations
          path: forge-of-heroes/QA/N1/arquebusier-mercenary-hybrid-gear-probe.json
      - name: Archiver le diagnostic sans déclaration de certification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/QA/N1/arquebusier-mercenary-hybrid-gear-probe.json
          if ! git diff --cached --quiet; then
            git commit -m "test(forge-n1): état des contraintes hybride Mercenaire [skip ci]"
            git restore --worktree .
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              if [ "$attempt" = 5 ]; then exit 1; fi
              sleep 2
            done
          fi
