name: Forge N1 targeted certification
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-targeted-certification.yml'
      - 'fiches-personnages/tests/bone-armor-certification*.cjs'
      - 'fiches-personnages/fiche/fiche.js'
permissions:
  contents: read
jobs:
  bone-armor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix /tmp/forge-qa-deps jsdom@26 playwright@1.58.2 --no-audit --no-fund
      - name: Select the preinstalled Chrome used by the existing UI recipes
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
      - name: Numerical and DOM regression
        env:
          NODE_PATH: /tmp/forge-qa-deps/node_modules
        run: node fiches-personnages/tests/bone-armor-certification.cjs
      - name: Real browser transitions on isolated sheets
        env:
          NODE_PATH: /tmp/forge-qa-deps/node_modules
        run: |
          python3 -m http.server 4173 --directory .. >/tmp/forge-http.log 2>&1 &
          node fiches-personnages/tests/bone-armor-certification-browser.cjs
          FOH_QA_PREFIX=/atelier-guiltanas-apps node centre-synchronisation/forge-n1/qa_reconciliation_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-bone-armor-evidence
          path: |
            forge-of-heroes/QA/N1/lot-2026-11-19/bone*.json
            centre-synchronisation/forge-n1/qa-reconciliation-browser.json
