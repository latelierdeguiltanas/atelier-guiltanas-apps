name: Forge N1 - diagnostic export PDF officiel
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-pdf-handler-probe.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_pdf_handler_probe.cjs'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identifier le bouton PDF officiel et sa logique
        run: node forge-of-heroes/FINAL_FREEZE_TESTS/n1_pdf_handler_probe.cjs
      - name: Enregistrer le diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forge-of-heroes/QA/N1/arquebusier-pdf-handler-probe.json
          git commit -m "audit(forge-pdf): verifier le parcours export officiel [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
