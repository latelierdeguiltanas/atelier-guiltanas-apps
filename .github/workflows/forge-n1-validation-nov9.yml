name: Forge N1 - consolider les preuves
on:
  push:
    branches: [forge-n1-validation-nov9]
permissions:
  contents: write
  actions: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 42670590120
          pattern: preuves-*
          merge-multiple: true
          path: .
      - name: Consolider les preuves vérifiées
        run: |
          git apply .github/forge-n1-validation.patch
          git apply .github/forge-n1-pdf-test.patch
          mv .github/forge-n1-pdf-proof.json forge-of-heroes/QA/N1/arquebusier-official-template.json
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_choices_merge.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge-of-heroes centre-synchronisation/forge-n1/focus.json
          git rm .github/forge-n1-validation.patch .github/forge-n1-pdf-test.patch
          git add -u .github/forge-n1-pdf-proof.json
          git commit -m 'Valider Forge N1 sur la version actuelle [skip ci]'
          git push origin HEAD:forge-n1-validation-nov9
