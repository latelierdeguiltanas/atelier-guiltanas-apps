name: Forge N1 - controle affichage Copilote sequentiel
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-copilote-verify.yml'
      - 'centre-synchronisation/forge-n1/index.html'
      - 'centre-synchronisation/forge-n1/focus.json'
      - 'centre-synchronisation/forge-n1/qa_focus_mobile.cjs'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controle statique script et contrat 14 profils 8 peuples
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const root='centre-synchronisation/forge-n1/';
          const html=fs.readFileSync(root+'index.html','utf8');
          const start=html.lastIndexOf('<script>'),end=html.indexOf('</script>',start);
          assert(start>=0&&end>start,'Script utilisateur absent');
          const scripts=[html.slice(start+8,end)];
          assert(scripts.length>=1,'Script de l’interface absent');
          for(const script of scripts)new vm.Script(script,{filename:'copilote-inline.js'});
          for(const id of ['focus-priority','focus-stats','focus-profile','focus-peoples','focus-open','focus-queue','focus-date'])assert(html.includes('id="'+id+'"'),id+' manque');
          assert(html.includes('readJson("./focus.json")'),'La vue ne charge pas les preuves actives');
          const d=JSON.parse(fs.readFileSync(root+'focus.json'));
          assert(d.certificationPlan.policy==='UN_SEUL_PROFIL_A_LA_FOIS_JUSQU_A_100');
          assert(d.certificationPlan.queue.length===14);
          assert(d.peoples.length===8);
          assert(d.certificationPlan.queue.filter(x=>x.status==='EN_COURS').length===1);
          assert(d.certificationPlan.current.name===d.certificationPlan.queue.find(x=>x.status==='EN_COURS').name);
          if(d.profile.completed){
            assert(d.certificationPlan.queue.some(x=>x.name===d.profile.name&&x.certified));
            assert(d.certificationPlan.next.unlocked);
          }
          assert(d.profile.percent===Math.round(d.profile.passed/d.profile.total*100));
          assert(d.peoples.every(x=>x.percent===Math.round(x.passed/x.total*100)));
          console.log('Copilote compilable : 1 profil actif, 13 en attente, 8 peuples, données et DOM cohérents');
          NODE
      - name: Installer le client et tester réellement les clics mobile
        run: |
          npm install --prefix "$RUNNER_TEMP/foh-cockpit" playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/foh-cockpit/node_modules" >> "$GITHUB_ENV"
      - name: Réel affichage mobile, 14 positions, 8 peuples, rafraîchissement
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foh-cockpit-server.log 2>&1 &
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node centre-synchronisation/forge-n1/qa_focus_mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-copilote-real-mobile
          path: centre-synchronisation/forge-n1/qa-focus-mobile-result.json
