name: Forge N1 - consolider la recette du Barbare
on:
  push:
    branches: [forge-n1-barbare-nov11]
permissions:
  contents: write
  actions: read
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43019361927
          pattern: preuves-*
          merge-multiple: true
          path: .
      - name: Consolider les preuves liées à la version
        run: |
          git apply .github/forge-n1-barbare-tests.patch
          python3 .github/forge-n1-barbare-apply.py
          git apply .github/forge-n1-barbare-focus.patch
          mv .github/forge-n1-barbare-template.json forge-of-heroes/QA/N1/arquebusier-official-template.json
          mv .github/forge-n1-barbare-history.json forge-of-heroes/QA/N1/arquebusier-history-choices-pdf.json
          mv .github/forge-n1-barbare-pdf.json forge-of-heroes/QA/N1/barbare-official-pdf.json
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_people_equipment_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_grant_context.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_choices_merge.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_origins_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_history_conditions_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_barbare_tattoo.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          node - <<'JS'
          const assert=require('node:assert/strict');
          const d=require('./centre-synchronisation/forge-n1/focus.json');
          assert.equal(d.profile.passed,16);
          assert.equal(d.profile.completed,true);
          assert.match(d.profile.next,/4 250/);
          assert.equal(d.certificationPlan.current.name,"Barbare");
          assert.equal(d.peoples.length,8);
          assert(d.peoples.every(p=>p.passed===(p.key==='halfelin'?6:7)));
          JS
          node centre-synchronisation/scripts/forge-global-progress.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge-of-heroes centre-synchronisation/forge-n1/index.html centre-synchronisation/forge-n1/focus.json centre-synchronisation/data/forge-global-progress.json
          git rm .github/forge-n1-barbare-tests.patch .github/forge-n1-barbare-apply.py .github/forge-n1-barbare-focus.patch
          git add -u .github/forge-n1-barbare-template.json .github/forge-n1-barbare-history.json .github/forge-n1-barbare-pdf.json
          git commit -m 'Valider Peau de pierre et Tatouages du Barbare N1 [skip ci]'
          git push origin HEAD:forge-n1-barbare-nov11
