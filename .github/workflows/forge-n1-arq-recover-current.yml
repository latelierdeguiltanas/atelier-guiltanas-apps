name: Forge N1 - consolider les preuves actuelles Arquebusier
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-arq-recover-current.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: forge-n1-arq-source-fixes
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruire les mêmes produits depuis les sources
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arbaletrier_powderless_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_doigts_agiles_knives_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_granted_pdf_annex_fix.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_summaries.cjs --write
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_publish.cjs --write
      - uses: actions/download-artifact@v4
        with:
          name: forge-arquebusier-correctifs-source
          run-id: 41808599204
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: forge-of-heroes/QA/N1
      - name: Régénérer la preuve d’équipement après le PDF et lier toutes les empreintes
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_equipment_oracle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_arbaletrier_audit.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_recovered_proofs.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_15_mechanics_snapshot.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_pure_rule_ledger.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_focus_split.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_r2_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_gear_gate.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_pdf_gate.cjs
      - name: Publier les corrections et les seules preuves courantes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add forge-of-heroes/index.html forge-of-heroes/progression/pdf-labels.json forge-of-heroes/progression/official-pdf-engine.js forge-of-heroes/QA/N1/*.json centre-synchronisation/forge-n1/focus.json centre-synchronisation/forge-n1/purs.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(forge): équipements, dons et annexes vérifiés sur les produits courants [skip ci]'
            git restore --worktree .
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
