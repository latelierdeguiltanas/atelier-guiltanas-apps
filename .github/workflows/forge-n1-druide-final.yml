name: Forge N1 - dernier critère Druide
on:
  push:
    branches: [qa-druide-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assembler et tester le moteur
        run: |
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_druide_runtime_bundle.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_druide_runtime.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/ability_runtime_runner.cjs
          node forge-of-heroes/FINAL_FREEZE_TESTS/sacred_mana_runner.cjs
      - name: Rejouer les effets sur Chrome mobile
        run: |
          npm install --prefix /tmp/forge-test --no-package-lock playwright
          python3 -m http.server 4173 &
          export NODE_PATH=/tmp/forge-test/node_modules
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node fiches-personnages/tests/druide-combat.cjs
          node fiches-personnages/tests/chevalier-combat.cjs
          node fiches-personnages/tests/barde-combat.cjs
          node fiches-personnages/tests/barbare-combat.cjs
      - name: Rejouer la création et la réouverture des huit peuples
        run: |
          python3 -m http.server 4178 &
          export NODE_PATH=/tmp/forge-test/node_modules
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node forge-of-heroes/FINAL_FREEZE_TESTS/n1_druide_choices_click.cjs
