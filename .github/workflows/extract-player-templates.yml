name: Extract player templates

on:
  push:
    paths:
      - '.github/workflows/extract-player-templates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Vax and Hammerz source templates
        shell: python
        run: |
          import base64, gzip, pathlib, re
          root = pathlib.Path('.')
          out = pathlib.Path('extracted-player-templates')
          out.mkdir(exist_ok=True)

          # Vax: three raw base64 chunks.
          vdir = root / 'ile-aux-tempetes/personnages/vax'
          b64 = ''.join((vdir / f'payload-{i}.txt').read_text().strip() for i in range(1,4))
          (out / 'vax.html').write_bytes(gzip.decompress(base64.b64decode(b64)))

          # Hammerz: two JS chunks assigning window.__IAT_P1/P2.
          hdir = root / 'ile-aux-tempetes/personnages/hammerz'
          parts = []
          for i in (1,2):
              text = (hdir / f'p{i}.js').read_text()
              m = re.search(r"='([^']*)'", text, re.S)
              if not m:
                  raise RuntimeError(f'Cannot extract Hammerz p{i}')
              parts.append(m.group(1))
          (out / 'hammerz.html').write_bytes(gzip.decompress(base64.b64decode(''.join(parts))))
      - name: Upload extracted templates
        uses: actions/upload-artifact@v4
        with:
          name: player-templates
          path: extracted-player-templates/
