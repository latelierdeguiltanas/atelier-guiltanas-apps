name: Forge N1 - pouvoirs conditionnels au clic
# Recette de requalification sur version N1 Mercenaire hybride corrigée le 03 novembre 2026.
# Relance QA sur la version HTML autonome intégrant le calculateur contextualisé.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/forge-n1-arq-context-click.yml'
      - 'forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_live_click.cjs'
      - 'forge-of-heroes/index.html'
      - 'forge-of-heroes/FORGE_OF_HEROES_ATELIER_GUILTANAS_PRODUCT_MASTER.html'
permissions:
  contents: write
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Client Playwright Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/foh-arq-context" playwright@1.55.0
          echo "NODE_PATH=$RUNNER_TEMP/foh-arq-context/node_modules" >> "$GITHUB_ENV"
      - name: Quatre créations mobiles puis calculs de pouvoirs cliquables
        id: check
        continue-on-error: true
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/foh-arq-context-server.log 2>&1 &
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node forge-of-heroes/FINAL_FREEZE_TESTS/n1_arq_context_live_click.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-n1-arq-context-real-click
          path: forge-of-heroes/QA/N1/arquebusier-context-real-click.json
      - name: Versionner tous les résultats véridiques
        if: always()
        run: |
          if test -f forge-of-heroes/QA/N1/arquebusier-context-real-click.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add forge-of-heroes/QA/N1/arquebusier-context-real-click.json
            if ! git diff --cached --quiet; then
              git commit -m "test(forge-n1): 4 fiches et pouvoirs contextuels au clic [skip ci]"
              git restore --worktree .
              for attempt in 1 2 3 4 5; do
                git fetch origin main
                if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
                if [ "$attempt" = 5 ]; then exit 1; fi
                sleep 3
              done
            fi
          fi
      - name: Impossible de clôturer les effets si un clic échoue
        if: steps.check.outcome == 'failure'
        run: exit 1
