<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10291d"><title>Espace personnel — La Bastide</title><link rel="stylesheet" href="../assets/bastide.css"><style>
.shell{width:min(1040px,100%);margin:auto;padding:14px}.head{margin:18px 0}.head h1{font:700 clamp(2rem,8vw,4rem) Georgia,serif;margin:5px 0}.layout{display:grid;grid-template-columns:.78fr 1.22fr;gap:12px}.entries{display:grid;gap:7px;margin-top:12px}.entry{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#102a1d;color:var(--ink);padding:11px}.entry.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}label,.field{display:grid;gap:5px;color:var(--muted);font-weight:800}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:#0a2015;color:var(--ink);padding:10px}textarea{min-height:220px;resize:vertical}.form{display:grid;gap:11px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{border:0;border-radius:10px;background:var(--gold);color:#142018;padding:10px 13px;font-weight:900}.actions .secondary{background:#173a27;color:var(--ink);border:1px solid var(--line)}.actions .danger{background:#6f302b;color:#fff}.recipients{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.recipient{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;background:#0a2015;padding:9px;color:var(--ink)}.recipient input{width:auto}.muted{color:var(--muted)}.share-note{border-left:4px solid var(--gold);padding:9px 11px;background:#152d20;color:var(--ink)}@media(max-width:720px){.layout,.row{grid-template-columns:1fr}.recipients{grid-template-columns:1fr}}
</style></head><body><main class="shell"><a href="../joueurs/">← Espace joueurs</a><header class="head"><small class="eyebrow" id="eyebrow"></small><h1 id="title"></h1><p id="intro"></p></header><div id="error" class="panel" hidden></div><section id="workspace" class="layout" hidden><article class="panel"><div class="actions"><button id="new">+ Nouveau</button><button class="secondary" id="refresh">Actualiser</button></div><div id="entries" class="entries"></div></article><article class="panel"><form id="form" class="form"><input id="id" type="hidden"><label>Titre<input id="entry-title" maxlength="120" required></label><label id="object-wrap">Objet du contrat<input id="object" maxlength="500" placeholder="Ce que le contrat engage, protège ou accorde"></label><div class="row"><label>Type<select id="type"></select></label><label>État<select id="status"><option value="draft">Brouillon privé</option><option value="active">Validé et visible</option><option value="completed">Terminé et masqué</option></select></label></div><div class="field"><span id="recipient-label">Personnages concernés</span><div id="recipients" class="recipients"></div><small>Plusieurs destinataires sont possibles. Chaque contrat ou souvenir reste indépendant.</small></div><label id="npc-wrap">PNJ concerné, si nécessaire<input id="npc" maxlength="120" placeholder="Nom du PNJ"></label><label id="content-label">Contenu<textarea id="content" maxlength="20000"></textarea></label><p class="share-note" id="share-note"></p><div class="actions"><button type="submit">Sauvegarder</button><button type="button" class="danger" id="delete" hidden>Supprimer</button></div><p id="message" class="muted"></p></form></article></section></main><script src="../assets/inventory-api.js?v=6"></script><script>
(()=>{'use strict';const A=window.BastideInventory,$=s=>document.querySelector(s),kind=new URLSearchParams(location.search).get('kind')==='confidences'?'confidence':'contract';const cfg=kind==='contract'?{eyebrow:'ESPACE DE VIVELAME',title:'La Contrathèque',intro:'Rédige un contrat, définis précisément son objet et attribue-le à un ou plusieurs personnages.',content:'Clauses, engagements et effets du contrat',recipient:'Signataires joueurs',note:'Quand l’état passe à « Validé et visible », chaque joueur sélectionné voit apparaître automatiquement un onglet « Contrats avec Vivelame » sur sa fiche.',types:[['protection','Protection'],['assaut','Assaut'],['entraide','Entraide'],['autre','Autre']]}:{eyebrow:'ESPACE DE WILFRIED',title:'Les Confidences',intro:'Prépare les fragments du passé de Wilfried et choisis exactement qui peut les connaître.',content:'Souvenir ou fragment du passé',recipient:'Personnages auxquels révéler ce fragment',note:'Quand l’état passe à « Validé et visible », chaque destinataire sélectionné voit apparaître automatiquement un onglet « Histoire de Wilfried » sur sa fiche.',types:[['souvenir','Souvenir'],['secret','Secret'],['témoignage','Témoignage'],['avertissement','Avertissement']]};let entries=[],recipients=[],current=null;$('#eyebrow').textContent=cfg.eyebrow;$('#title').textContent=cfg.title;$('#intro').textContent=cfg.intro;$('#content-label').childNodes[0].textContent=cfg.content;$('#recipient-label').textContent=cfg.recipient;$('#share-note').textContent=cfg.note;$('#type').innerHTML=cfg.types.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');$('#object-wrap').hidden=kind!=='contract';$('#npc-wrap').hidden=kind!=='contract';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function message(v){$('#message').textContent=v}function drawRecipients(selected=[]){const set=new Set(selected);$('#recipients').innerHTML=recipients.map(p=>`<label class="recipient"><input type="checkbox" name="audience" value="${esc(p.id)}" ${set.has(p.id)?'checked':''}><span>${esc(p.display_name)}</span></label>`).join('')||'<span class="muted">Aucun autre personnage disponible.</span>'}function edit(x){current=x||null;$('#id').value=x?.id||'';$('#entry-title').value=x?.title||'';$('#object').value=x?.metadata?.object||'';$('#npc').value=x?.metadata?.npcName||'';$('#content').value=x?.content||'';$('#status').value=['shared','active'].includes(x?.status)?'active':x?.status||'draft';$('#type').value=x?.metadata?.type||cfg.types[0][0];$('#delete').hidden=!x;drawRecipients(x?.audience||[]);draw()}function draw(){const names=Object.fromEntries(recipients.map(p=>[p.id,p.display_name]));$('#entries').innerHTML=entries.map(x=>{const audience=(x.audience||[]).map(id=>names[id]||id),npc=x.metadata?.npcName?[x.metadata.npcName]:[],who=[...audience,...npc].join(', ')||'Aucun destinataire';return `<button class="entry ${current?.id===x.id?'active':''}" data-open="${x.id}"><strong>${esc(x.title)}</strong><br><small>${esc(x.status==='active'||x.status==='shared'?'Visible':'Privé/archivé')} · ${esc(who)}</small></button>`}).join('')||'<p class="muted">Aucune entrée pour le moment.</p>'}async function load(){try{const r=await A.call('personal-list&kind='+encodeURIComponent(kind));entries=r.entries||[];recipients=r.recipients||[];$('#workspace').hidden=false;$('#error').hidden=true;if(current)current=entries.find(x=>x.id===current.id)||null;drawRecipients(current?.audience||[]);draw()}catch(e){$('#error').hidden=false;$('#error').textContent=e.message}}$('#entries').onclick=e=>{const b=e.target.closest('[data-open]');if(b)edit(entries.find(x=>x.id===b.dataset.open))};$('#new').onclick=()=>edit(null);$('#refresh').onclick=load;$('#form').onsubmit=async e=>{e.preventDefault();const audience=[...document.querySelectorAll('input[name="audience"]:checked')].map(x=>x.value),status=$('#status').value;if(status==='active'&&!audience.length&&!(kind==='contract'&&$('#npc').value.trim())){message('Choisis au moins un destinataire avant de valider.');return}try{await A.call('personal-save',{method:'POST',body:{id:$('#id').value||undefined,kind,title:$('#entry-title').value,content:$('#content').value,status,audience,metadata:{type:$('#type').value,object:$('#object').value,npcName:kind==='contract'?$('#npc').value:''}}});message(status==='active'?'Contenu validé et partagé avec les destinataires.':'Brouillon sauvegardé sans partage.');current=null;await load();edit(entries[0]||null)}catch(err){message(err.message)}};$('#delete').onclick=async()=>{if(!current||!confirm('Supprimer définitivement cette entrée ? Elle disparaîtra aussi des fiches destinataires.'))return;try{await A.call('personal-delete',{method:'DELETE',body:{id:current.id}});current=null;await load();edit(null);message('Entrée supprimée et accès retiré.')}catch(err){message(err.message)}};if(!A.hasKey()){$('#error').hidden=false;$('#error').textContent='Ouvre d’abord ton lien personnel de personnage sur cet appareil.'}else load()})();
</script></body></html>
