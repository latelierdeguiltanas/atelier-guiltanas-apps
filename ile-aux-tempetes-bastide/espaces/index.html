<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10291d"><title>Espace personnel — La Bastide</title><link rel="stylesheet" href="../assets/bastide.css"><style>
.shell{width:min(980px,100%);margin:auto;padding:14px}.head{margin:18px 0}.head h1{font:700 clamp(2rem,8vw,4rem) Georgia,serif;margin:5px 0}.layout{display:grid;grid-template-columns:.8fr 1.2fr;gap:12px}.entries{display:grid;gap:7px}.entry{width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;background:#102a1d;color:var(--ink);padding:11px}.entry.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}label{display:grid;gap:5px;color:var(--muted);font-weight:800}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:#0a2015;color:var(--ink);padding:10px}textarea{min-height:240px;resize:vertical}.form{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{border:0;border-radius:10px;background:var(--gold);color:#142018;padding:10px 13px;font-weight:900}.actions .secondary{background:#173a27;color:var(--ink);border:1px solid var(--line)}.actions .danger{background:#6f302b;color:#fff}.muted{color:var(--muted)}@media(max-width:720px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
</style></head><body><main class="shell"><a href="../joueurs/">← Espace joueurs</a><header class="head"><small class="eyebrow" id="eyebrow"></small><h1 id="title"></h1><p id="intro"></p></header><div id="error" class="panel" hidden></div><section id="workspace" class="layout" hidden><article class="panel"><div class="actions"><button id="new">+ Nouveau</button><button class="secondary" id="refresh">Actualiser</button></div><div id="entries" class="entries"></div></article><article class="panel"><form id="form" class="form"><input id="id" type="hidden"><label>Titre<input id="entry-title" maxlength="120" required></label><div class="row"><label id="type-wrap">Type<select id="type"></select></label><label>État<select id="status"><option value="draft">Brouillon</option><option value="active">Actif</option><option value="completed">Terminé</option><option value="shared">Partagé</option></select></label></div><label id="people-wrap">Personnes concernées<input id="people" maxlength="300" placeholder="Noms des signataires ou destinataires"></label><label id="content-label">Contenu<textarea id="content" maxlength="20000"></textarea></label><div class="actions"><button type="submit">Sauvegarder</button><button type="button" class="danger" id="delete" hidden>Supprimer</button></div><p id="message" class="muted"></p></form></article></section></main><script src="../assets/inventory-api.js?v=6"></script><script>
(()=>{'use strict';const A=window.BastideInventory,$=s=>document.querySelector(s),kind=new URLSearchParams(location.search).get('kind')==='confidences'?'confidence':'contract',cfg=kind==='contract'?{eyebrow:'ESPACE DE VIVELAME',title:'La Contrathèque',intro:'Rédige, active et archive les contrats conclus avec les membres de la compagnie.',content:'Clauses et effets du contrat',types:[['protection','Protection'],['assaut','Assaut'],['entraide','Entraide'],['autre','Autre']]}:{eyebrow:'ESPACE DE WILFRIED',title:'Les Confidences',intro:'Prépare les fragments de ton histoire et conserve précisément ce que tu as choisi de révéler.',content:'Fragment du passé',types:[['souvenir','Souvenir'],['secret','Secret'],['témoignage','Témoignage'],['avertissement','Avertissement']]};let entries=[],current=null;$('#eyebrow').textContent=cfg.eyebrow;$('#title').textContent=cfg.title;$('#intro').textContent=cfg.intro;$('#content-label').childNodes[0].textContent=cfg.content;$('#type').innerHTML=cfg.types.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function message(v){$('#message').textContent=v}function edit(x){current=x||null;$('#id').value=x?.id||'';$('#entry-title').value=x?.title||'';$('#content').value=x?.content||'';$('#status').value=x?.status||'draft';$('#type').value=x?.metadata?.type||cfg.types[0][0];$('#people').value=x?.metadata?.people||'';$('#delete').hidden=!x;draw()}function draw(){$('#entries').innerHTML=entries.map(x=>`<button class="entry ${current?.id===x.id?'active':''}" data-open="${x.id}"><strong>${esc(x.title)}</strong><br><small>${esc(x.status)} · ${new Date(x.updated_at).toLocaleDateString('fr-FR')}</small></button>`).join('')||'<p class="muted">Aucune entrée pour le moment.</p>'}async function load(){try{const r=await A.call('personal-list&kind='+encodeURIComponent(kind));entries=r.entries||[];$('#workspace').hidden=false;$('#error').hidden=true;if(current)current=entries.find(x=>x.id===current.id)||null;draw()}catch(e){$('#error').hidden=false;$('#error').textContent=e.message}}$('#entries').onclick=e=>{const b=e.target.closest('[data-open]');if(b)edit(entries.find(x=>x.id===b.dataset.open))};$('#new').onclick=()=>edit(null);$('#refresh').onclick=load;$('#form').onsubmit=async e=>{e.preventDefault();try{await A.call('personal-save',{method:'POST',body:{id:$('#id').value||undefined,kind,title:$('#entry-title').value,content:$('#content').value,status:$('#status').value,metadata:{type:$('#type').value,people:$('#people').value}}});message('Sauvegarde effectuée.');await load();edit(entries[0]||null)}catch(err){message(err.message)}};$('#delete').onclick=async()=>{if(!current||!confirm('Supprimer définitivement cette entrée ?'))return;try{await A.call('personal-delete',{method:'DELETE',body:{id:current.id}});message('Entrée supprimée.');current=null;await load();edit(null)}catch(err){message(err.message)}};if(!A.hasKey()){$('#error').hidden=false;$('#error').textContent='Ouvre d’abord ton lien personnel de personnage sur cet appareil.'}else load()})();
</script></body></html>
