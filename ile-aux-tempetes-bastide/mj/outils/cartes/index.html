<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas — MJ Bastide</title><link rel="stylesheet" href="../../../assets/bastide.css"><style>.app{max-width:1000px;margin:auto;padding:14px}.mapRow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.mapRow img{width:110px;height:80px;object-fit:cover;border-radius:10px}.toggle{border:1px solid var(--line);border-radius:999px;padding:10px 13px;background:#173a27;color:var(--ink);font-weight:900}.toggle.on{background:var(--gold);color:#142018}.form{display:grid;gap:9px;margin-top:14px}.form input,.form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#091d13;color:var(--ink)}@media(max-width:620px){.mapRow{grid-template-columns:72px 1fr}.mapRow img{width:72px;height:58px}.mapRow .toggle{grid-column:1/-1}}</style></head><body><main class="app"><a class="back" href="../../">← Table du MJ</a><section class="hero"><div class="eyebrow">Pilotage de l’atlas</div><h1>Cartes et <span>visibilité</span></h1><p>Prépare toutes les cartes à l’avance puis révèle-les au groupe d’un seul toucher.</p></section><p id="status" class="notice">Synchronisation…</p><section class="panel"><div id="list"></div><details><summary>Ajouter une carte</summary><div class="form"><label>Titre<input id="title"></label><label>Description<textarea id="description"></textarea></label><label>Adresse de l’image<input id="url" placeholder="../../../assets/cartes/..."></label><button class="button primary" id="add">Ajouter, cachée aux joueurs</button></div></details></section></main><script src="../../../assets/inventory-api.js?v=6"></script><script>(()=>{const A=window.BastideInventory,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let maps=[];function draw(){$('#list').innerHTML=maps.map(x=>`<div class="mapRow"><img src="${esc(x.image_url)}" alt=""><div><b>${esc(x.title)}</b><br><small>${esc(x.description)}</small></div><button class="toggle ${x.player_visible?'on':''}" data-id="${esc(x.id)}">${x.player_visible?'Visible aux joueurs':'Cachée aux joueurs'}</button></div>`).join('')||'<p>Aucune carte.</p>'}async function load(){try{const d=await A.call('admin');maps=d.maps||[];draw();$('#status').textContent='Atlas synchronisé.'}catch(e){$('#status').textContent=e.message}}document.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.id){const x=maps.find(m=>m.id===b.dataset.id);await A.call('map-item',{method:'PATCH',body:{...x,player_visible:!x.player_visible}});await load()}if(b.id==='add'){await A.call('map-item',{method:'POST',body:{title:$('#title').value,description:$('#description').value,image_url:$('#url').value,player_visible:false}});$('#title').value=$('#description').value=$('#url').value='';await load()}};load()})();</script></body></html>
