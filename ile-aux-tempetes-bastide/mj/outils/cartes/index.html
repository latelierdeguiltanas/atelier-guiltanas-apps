<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas — MJ Bastide</title><link rel="stylesheet" href="../../../assets/bastide.css"><style>.app{max-width:1000px;margin:auto;padding:14px}.mapRow{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.mapRow img{width:110px;height:80px;object-fit:cover;border-radius:10px;background:#173a27}.visibility{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#301d17;color:var(--ink);font-weight:900}.visibility .eye{font-size:1.25rem}.visibility.on{background:#315b3d}.visibility small{display:block;font-weight:600;color:#ddd}.mapActions{display:grid;gap:7px}.deleteMap{border:1px solid #a84c45;border-radius:10px;padding:9px 12px;background:#3a1715;color:#ffd8d3;font-weight:900}.form{display:grid;gap:10px;margin-top:14px}.form input,.form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#091d13;color:var(--ink)}.filePick{display:grid;place-items:center;min-height:54px;border:1px dashed var(--gold);border-radius:12px;background:#173a27;color:var(--ink);font-weight:900}.filePick input{position:absolute;opacity:0;pointer-events:none}.preview{display:none;max-height:220px;max-width:100%;margin:auto;border-radius:12px}.preview.ready{display:block}.help{color:var(--muted);font-size:.85rem}@media(max-width:620px){.mapRow{grid-template-columns:72px 1fr}.mapRow img{width:72px;height:58px}.mapRow .mapActions{grid-column:1/-1}.mapRow .visibility,.mapRow .deleteMap{width:100%;justify-content:center}}</style></head><body><main class="app"><a class="back" href="../../">← Table du MJ</a><section class="hero"><div class="eyebrow">Pilotage de l’atlas</div><h1>Cartes et <span>visibilité</span></h1><p>Prépare toutes les cartes à l’avance puis révèle-les au groupe d’un seul toucher.</p></section><p id="status" class="notice">Synchronisation…</p><section class="panel"><div id="list"></div><details><summary>Ajouter une carte</summary><div class="form"><label>Titre<input id="title" placeholder="Ex. Le Repos du Dragon"></label><label>Description<textarea id="description" placeholder="Courte indication pour les joueurs"></textarea></label><label class="filePick">📷 Choisir une image sur le téléphone<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview" alt="Aperçu de la carte"><p id="fileName" class="help">JPG, PNG ou WEBP — 8 Mo maximum.</p><button class="button primary" id="add">Ajouter la carte, cachée aux joueurs</button></div></details></section></main><script src="../../../assets/inventory-api.js?v=8"></script><script>(()=>{const A=window.BastideInventory,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let maps=[],selectedFile=null;function draw(){$('#list').innerHTML=maps.map(x=>`<div class="mapRow"><img src="${esc(x.image_url)}" alt=""><div><b>${esc(x.title)}</b><br><small>${esc(x.description)}</small></div><div class="mapActions"><button class="visibility ${x.player_visible?'on':''}" data-toggle-id="${esc(x.id)}" aria-pressed="${x.player_visible}"><span class="eye">${x.player_visible?'👁':'◉̸'}</span><span>${x.player_visible?'Visible actuellement':'Cachée actuellement'}<small>${x.player_visible?'Toucher pour cacher':'Toucher pour révéler'}</small></span></button><button class="deleteMap" data-delete-id="${esc(x.id)}">🗑 Supprimer cette carte</button></div></div>`).join('')||'<p>Aucune carte.</p>'}async function load(){try{const d=await A.call('admin');maps=d.maps||[];draw();$('#status').textContent='Atlas synchronisé.'}catch(e){$('#status').textContent=e.message}}function readBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}$('#file').onchange=e=>{selectedFile=e.target.files?.[0]||null;if(!selectedFile)return;$('#fileName').textContent=selectedFile.name+' · '+Math.ceil(selectedFile.size/1024)+' Ko';$('#preview').src=URL.createObjectURL(selectedFile);$('#preview').classList.add('ready')};document.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.toggleId){const x=maps.find(m=>m.id===b.dataset.toggleId);b.disabled=true;try{await A.call('map-item',{method:'PATCH',body:{...x,player_visible:!x.player_visible}});await load()}catch(err){$('#status').textContent=err.message}return}if(b.dataset.deleteId){const x=maps.find(m=>m.id===b.dataset.deleteId);if(!x||!confirm(`Supprimer définitivement « ${x.title} » ? Cette action est irréversible.`))return;b.disabled=true;b.textContent='Suppression…';try{const result=await A.call('map-item',{method:'DELETE',body:{id:x.id}});await load();$('#status').textContent=result.warning?'Carte retirée. '+result.warning:'Carte et image supprimées.'}catch(err){$('#status').textContent=err.message;b.disabled=false;b.textContent='🗑 Supprimer cette carte'}return}if(b.id==='add'){const title=$('#title').value.trim();if(!title||!selectedFile){$('#status').textContent='Indique un titre et choisis une image.';return}if(selectedFile.size>8*1024*1024){$('#status').textContent='Cette image dépasse 8 Mo.';return}b.disabled=true;b.textContent='Envoi de l’image…';try{const data=await readBase64(selectedFile),uploaded=await A.call('map-upload',{method:'POST',body:{mime:selectedFile.type,data}});await A.call('map-item',{method:'POST',body:{title,description:$('#description').value,image_url:uploaded.url,player_visible:false}});$('#title').value=$('#description').value='';$('#file').value='';$('#preview').classList.remove('ready');$('#fileName').textContent='JPG, PNG ou WEBP — 8 Mo maximum.';selectedFile=null;await load();$('#status').textContent='Carte ajoutée et cachée aux joueurs. Tu peux maintenant la révéler avec l’œil.'}catch(err){$('#status').textContent=err.message}finally{b.disabled=false;b.textContent='Ajouter la carte, cachée aux joueurs'}}};load()})();</script></body></html>
