<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rencontres — MJ Bastide</title><link rel="stylesheet" href="../../../assets/bastide.css"><style>.app{max-width:1050px;margin:auto;padding:14px}.cards{display:grid;gap:12px}.row{display:grid;grid-template-columns:100px 1fr auto;gap:13px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.thumb{width:100px;height:100px;object-fit:cover;border-radius:13px;background:#173a27}.ph{display:grid;place-items:center;font:700 2rem Georgia;color:var(--gold)}.actions{display:grid;gap:7px}.actions button{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#173a27;color:var(--ink);font-weight:900}.actions .visible{background:#315b3d}.actions .danger{border-color:#a84c45;background:#3a1715;color:#ffd8d3}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form .wide{grid-column:1/-1}.form input,.form textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#091d13;color:var(--ink)}.form textarea{min-height:100px}.filePick{display:grid;place-items:center;min-height:50px;border:1px dashed var(--gold);border-radius:12px;background:#173a27;font-weight:900}.filePick input{position:absolute;opacity:0;pointer-events:none}.preview{display:none;max-width:100%;max-height:260px;margin:auto;border-radius:13px}.preview.ready{display:block}.formActions{display:flex;gap:8px;flex-wrap:wrap}.help{color:var(--muted);font-size:.85rem}@media(max-width:650px){.row{grid-template-columns:72px 1fr}.thumb{width:72px;height:72px}.actions{grid-column:1/-1}.form{grid-template-columns:1fr}.form .wide{grid-column:auto}}</style></head><body><main class="app"><a class="back" href="../../">← Table du MJ</a><section class="hero"><div class="eyebrow">Mémoire de campagne</div><h1>Rencontres et <span>PNJ</span></h1><p>Prépare les fiches, garde tes secrets dans les notes MJ et révèle uniquement ce que le groupe connaît.</p></section><p id="status" class="notice">Synchronisation…</p><section class="panel"><div id="list" class="cards"></div><details id="editor"><summary>Ajouter une rencontre</summary><div class="form"><input id="id" type="hidden"><label>Nom<input id="name" placeholder="Ex. Runara"></label><label>Catégorie<input id="kind" placeholder="PNJ, groupe, créature…" value="PNJ"></label><label class="wide">Résumé court<input id="summary" placeholder="Ce que les joueurs retiennent en un regard"></label><label class="wide">Informations visibles des joueurs<textarea id="playerText" placeholder="Uniquement ce que les personnages ont découvert"></textarea></label><label class="wide">Notes privées MJ<textarea id="mjNotes" placeholder="Secrets, intentions, révélations futures — jamais affichés aux joueurs"></textarea></label><label>Ordre d’affichage<input id="sortOrder" type="number" value="100"></label><label style="display:flex;align-items:center;gap:8px"><input id="visible" type="checkbox" style="width:auto"> Publier immédiatement</label><label class="filePick wide">📷 Choisir ou remplacer l’image<input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" class="preview wide" alt="Aperçu"><p id="fileName" class="help wide">Image facultative · JPG, PNG ou WEBP · 8 Mo maximum.</p><div class="formActions wide"><button class="button primary" id="save">Enregistrer</button><button class="button" id="cancel" type="button">Annuler la modification</button></div></div></details></section></main><script src="../../../assets/inventory-api.js?v=6"></script><script>(()=>{const A=window.BastideInventory,$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let items=[],selectedFile=null,currentImage='';function draw(){$('#list').innerHTML=items.map(x=>`<div class="row">${x.image_url?`<img class="thumb" src="${esc(x.image_url)}" alt="">`:`<div class="thumb ph">${esc(x.name).slice(0,1)}</div>`}<div><b>${esc(x.name)}</b><br><small>${esc(x.kind)} · ${esc(x.summary)}</small>${x.mj_notes?`<p class="help">🔒 ${esc(x.mj_notes).slice(0,150)}</p>`:''}</div><div class="actions"><button data-toggle="${esc(x.id)}" class="${x.player_visible?'visible':''}">${x.player_visible?'👁 Visible aux joueurs':'◉̸ Cachée'}</button><button data-edit="${esc(x.id)}">✎ Modifier</button><button data-delete="${esc(x.id)}" class="danger">🗑 Supprimer</button></div></div>`).join('')||'<p>Aucune rencontre.</p>'}async function load(){try{const d=await A.call('encounters-admin');items=d.encounters||[];draw();$('#status').textContent='Rencontres synchronisées.'}catch(e){$('#status').textContent=e.message}}function reset(){['id','name','summary','playerText','mjNotes'].forEach(id=>$('#'+id).value='');$('#kind').value='PNJ';$('#sortOrder').value='100';$('#visible').checked=false;$('#file').value='';$('#preview').classList.remove('ready');$('#fileName').textContent='Image facultative · JPG, PNG ou WEBP · 8 Mo maximum.';selectedFile=null;currentImage='';$('#editor').open=false}function edit(x){$('#id').value=x.id;$('#name').value=x.name;$('#kind').value=x.kind;$('#summary').value=x.summary;$('#playerText').value=x.player_text;$('#mjNotes').value=x.mj_notes;$('#sortOrder').value=x.sort_order;$('#visible').checked=x.player_visible;currentImage=x.image_url||'';if(currentImage){$('#preview').src=currentImage;$('#preview').classList.add('ready')}else $('#preview').classList.remove('ready');$('#editor').open=true;$('#editor').scrollIntoView({behavior:'smooth'})}const base64=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(f)});$('#file').onchange=e=>{selectedFile=e.target.files?.[0]||null;if(!selectedFile)return;$('#fileName').textContent=selectedFile.name+' · '+Math.ceil(selectedFile.size/1024)+' Ko';$('#preview').src=URL.createObjectURL(selectedFile);$('#preview').classList.add('ready')};document.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='cancel'){reset();return}if(b.dataset.edit){const x=items.find(i=>i.id===b.dataset.edit);if(x)edit(x);return}if(b.dataset.toggle){const x=items.find(i=>i.id===b.dataset.toggle);if(!x)return;b.disabled=true;try{await A.call('encounter-item',{method:'PATCH',body:{...x,player_visible:!x.player_visible}});await load()}catch(err){$('#status').textContent=err.message}return}if(b.dataset.delete){const x=items.find(i=>i.id===b.dataset.delete);if(!x||!confirm(`Supprimer définitivement « ${x.name} » ?`))return;try{await A.call('encounter-item',{method:'DELETE',body:{id:x.id}});await load();$('#status').textContent='Rencontre supprimée.'}catch(err){$('#status').textContent=err.message}return}if(b.id==='save'){const name=$('#name').value.trim();if(!name){$('#status').textContent='Le nom est obligatoire.';return}if(selectedFile?.size>8*1024*1024){$('#status').textContent='Cette image dépasse 8 Mo.';return}b.disabled=true;b.textContent='Enregistrement…';try{let image_url=currentImage;if(selectedFile){const up=await A.call('encounter-upload',{method:'POST',body:{mime:selectedFile.type,data:await base64(selectedFile)}});image_url=up.url}await A.call('encounter-item',{method:$('#id').value?'PATCH':'POST',body:{id:$('#id').value||undefined,name,kind:$('#kind').value,summary:$('#summary').value,player_text:$('#playerText').value,mj_notes:$('#mjNotes').value,image_url,player_visible:$('#visible').checked,sort_order:Number($('#sortOrder').value)||100}});reset();await load();$('#status').textContent='Rencontre enregistrée. La galerie joueur est à jour.'}catch(err){$('#status').textContent=err.message}finally{b.disabled=false;b.textContent='Enregistrer'}}};load()})();</script></body></html>
