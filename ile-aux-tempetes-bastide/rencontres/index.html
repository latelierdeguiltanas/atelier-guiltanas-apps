<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a1516"><title>Rencontres — Île aux Tempêtes</title><style>body{margin:0;background:linear-gradient(#081214,#050b0c);color:#efe6d4;font-family:system-ui,-apple-system,sans-serif}.w{max-width:1080px;margin:auto;padding:18px 15px 70px}a{color:#d8b36e;text-decoration:none;font-weight:800}.h{padding:38px 0 25px}.h small,.type{color:#d8b36e;text-transform:uppercase;letter-spacing:.15em;font-weight:900}.h h1{font:700 clamp(2.5rem,8vw,4.8rem) Georgia,serif;margin:8px 0}.h p,.empty{color:#9eacab;max-width:690px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.c{overflow:hidden;border:1px solid rgba(216,179,110,.25);border-radius:20px;background:linear-gradient(145deg,#102325,#0a1516)}.portrait{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:radial-gradient(circle at 50% 35%,#345444,#132522 60%)}.placeholder{display:grid;place-items:center;font:700 4rem Georgia,serif;color:#d8b36e}.body{padding:18px}.type{font-size:.68rem}.c h2{font:700 1.4rem Georgia,serif;margin:6px 0}.summary{color:#e7dcc7;font-weight:700}.text{font-size:.9rem;color:#aab7b4;line-height:1.55;white-space:pre-line}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style></head><body><main class="w"><a href="../joueurs/">← Espace joueurs</a><header class="h"><small>Bestiaire de souvenirs</small><h1>Ceux que vous avez croisés.</h1><p>Cette galerie ne révèle rien à l’avance. Une fiche n’apparaît qu’après sa publication par le maître du jeu.</p></header><p id="status" class="empty">Chargement des souvenirs…</p><section id="grid" class="grid"></section></main><script src="../assets/inventory-api.js?v=6"></script><script>(()=>{const A=window.BastideInventory,esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const d=await A.call('encounters'),items=d.encounters||[];document.querySelector('#status').textContent=items.length?'':'Aucune rencontre publiée pour le moment.';document.querySelector('#grid').innerHTML=items.map(x=>`<article class="c">${x.image_url?`<img class="portrait" src="${esc(x.image_url)}" alt="Portrait de ${esc(x.name)}">`:`<div class="portrait placeholder" aria-hidden="true">${esc(x.name).slice(0,1)}</div>`}<div class="body"><span class="type">${esc(x.kind)}</span><h2>${esc(x.name)}</h2>${x.summary?`<p class="summary">${esc(x.summary)}</p>`:''}${x.player_text?`<p class="text">${esc(x.player_text)}</p>`:''}</div></article>`).join('')}catch(e){document.querySelector('#status').textContent='Impossible de charger les rencontres pour le moment.'}}load()})();</script><script src="../assets/analytics.js?v=3"></script></body></html>
