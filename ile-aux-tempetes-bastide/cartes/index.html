<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132f22"><title>Cartes & lieux — La Bastide</title><link rel="stylesheet" href="../assets/bastide.css"><style>.atlas{max-width:1000px;margin:auto;padding:14px}.atlasGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}.mapCard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}.mapCard button{width:100%;padding:0;border:0;background:none;color:inherit;text-align:left}.mapCard img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.mapCard div{padding:13px}.mapCard h2{margin:0;font:700 1.15rem Georgia,serif}.mapCard p{margin:6px 0 0;color:var(--muted)}.viewer{position:fixed;inset:0;z-index:100;background:#020805f4;display:grid;grid-template-rows:auto 1fr;padding:10px}.viewer[hidden]{display:none}.viewer header{display:flex;justify-content:space-between;align-items:center}.viewer header button{border:0;background:var(--gold);border-radius:10px;padding:9px 13px;font-weight:900}.viewer .stage{overflow:auto;display:grid;place-items:center}.viewer img{max-width:none;width:min(1400px,100%);height:auto}</style></head><body><main class="atlas"><header><a class="back" href="../joueurs/">← Espace joueurs</a></header><section class="hero"><div class="eyebrow">Cartes découvertes</div><h1>L’atlas du <span>groupe</span></h1><p>Seules les cartes révélées par le MJ apparaissent ici. Touche une carte pour l’agrandir.</p></section><div id="maps" class="atlasGrid"></div><p id="status" class="notice">Chargement des cartes…</p></main><div id="viewer" class="viewer" hidden><header><b id="viewerTitle"></b><button id="close">Fermer</button></header><div class="stage"><img id="viewerImage" alt=""></div></div><script src="../assets/inventory-api.js?v=6"></script><script>(()=>{const A=window.BastideInventory,box=document.getElementById('maps'),status=document.getElementById('status'),viewer=document.getElementById('viewer'),viewerTitle=document.getElementById('viewerTitle'),viewerImage=document.getElementById('viewerImage'),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));A.call('maps').then(({maps})=>{box.innerHTML=(maps||[]).map(x=>`<article class="mapCard"><button data-url="${esc(x.image_url)}" data-title="${esc(x.title)}"><img src="${esc(x.image_url)}" alt=""><div><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p></div></button></article>`).join('');status.textContent=maps?.length?'Atlas synchronisé.':'Aucune carte révélée pour le moment.'}).catch(e=>status.textContent=e.message);document.onclick=e=>{const b=e.target.closest('[data-url]');if(b){viewer.hidden=false;viewerTitle.textContent=b.dataset.title;viewerImage.src=b.dataset.url;viewerImage.alt=b.dataset.title}if(e.target.id==='close')viewer.hidden=true}})();</script></body></html>
