<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132f22"><title>Cartes & lieux — La Bastide</title><link rel="stylesheet" href="../assets/bastide.css"><style>.atlas{max-width:1000px;margin:auto;padding:14px}.atlasGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:16px}.mapCard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel)}.mapCard button{width:100%;padding:0;border:0;background:none;color:inherit;text-align:left}.mapFrame{display:grid;place-items:center;width:100%;aspect-ratio:4/3;padding:8px;background:#07170f}.mapCard img{display:block;width:100%;height:100%;object-fit:contain}.mapCard .mapText{padding:13px}.mapCard h2{margin:0;font:700 1.15rem Georgia,serif}.mapCard p{margin:6px 0 0;color:var(--muted)}.loadError{display:grid;place-items:center;gap:8px;width:100%;height:100%;padding:18px;text-align:center;color:var(--muted)}.loadError button{width:auto;padding:8px 12px;border:1px solid var(--gold);border-radius:10px;color:var(--ink)}.viewer{position:fixed;inset:0;z-index:100;background:#020805f4;display:grid;grid-template-rows:auto 1fr;padding:10px}.viewer[hidden]{display:none}.viewer header{display:flex;justify-content:space-between;align-items:center;gap:10px}.viewer header button{border:0;background:var(--gold);border-radius:10px;padding:9px 13px;font-weight:900}.viewer .stage{overflow:auto;display:grid;place-items:center;touch-action:pan-x pan-y}.viewer img{display:block;max-width:100%;max-height:calc(100vh - 70px);width:auto;height:auto;cursor:zoom-in;transition:width .15s}.viewer img.zoomed{max-width:none;max-height:none;width:max(1400px,100%);cursor:zoom-out}@media(max-width:620px){.atlasGrid{grid-template-columns:1fr}.mapFrame{aspect-ratio:auto;min-height:230px}.viewer{padding:8px}.viewer header b{font-size:.9rem}}</style></head><body><main class="atlas"><header><a class="back" href="../joueurs/">← Espace joueurs</a></header><section class="hero"><div class="eyebrow">Cartes découvertes</div><h1>L’atlas du <span>groupe</span></h1><p>Seules les cartes révélées par le MJ apparaissent ici. Touche une carte pour l’agrandir, puis touche l’image pour zoomer.</p></section><div id="maps" class="atlasGrid"></div><p id="status" class="notice">Chargement des cartes…</p></main><div id="viewer" class="viewer" hidden><header><b id="viewerTitle"></b><button id="close">Fermer</button></header><div class="stage"><img id="viewerImage" alt=""></div></div><script src="../assets/inventory-api.js?v=7"></script><script>(()=>{const A=window.BastideInventory,box=document.getElementById('maps'),status=document.getElementById('status'),viewer=document.getElementById('viewer'),viewerTitle=document.getElementById('viewerTitle'),viewerImage=document.getElementById('viewerImage'),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function card(x){return`<article class="mapCard"><button data-url="${esc(x.image_url)}" data-title="${esc(x.title)}"><span class="mapFrame"><img src="${esc(x.image_url)}" alt="${esc(x.title)}" decoding="async"></span><span class="mapText"><h2>${esc(x.title)}</h2><p>${esc(x.description)}</p></span></button></article>`}function wireImages(){box.querySelectorAll('img').forEach(img=>{img.addEventListener('error',()=>{const frame=img.closest('.mapFrame');if(!frame||frame.querySelector('.loadError'))return;frame.innerHTML=`<span class="loadError">La carte n’a pas chargé.<button type="button" data-retry="${esc(img.src)}">Réessayer</button></span>`})})}A.call('maps').then(({maps})=>{box.innerHTML=(maps||[]).map(card).join('');wireImages();status.textContent=maps?.length?'Toutes les cartes sont affichées en entier.':'Aucune carte révélée pour le moment.'}).catch(e=>status.textContent=e.message);document.onclick=e=>{const retry=e.target.closest('[data-retry]');if(retry){e.preventDefault();e.stopPropagation();const frame=retry.closest('.mapFrame'),img=document.createElement('img');img.alt='Carte';img.src=retry.dataset.retry+(retry.dataset.retry.includes('?')?'&':'?')+'reload='+Date.now();frame.replaceChildren(img);wireImages();return}const b=e.target.closest('[data-url]');if(b){viewer.hidden=false;viewerTitle.textContent=b.dataset.title;viewerImage.classList.remove('zoomed');viewerImage.src=b.dataset.url;viewerImage.alt=b.dataset.title}if(e.target===viewerImage)viewerImage.classList.toggle('zoomed');if(e.target.id==='close'){viewer.hidden=true;viewerImage.src=''}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){viewer.hidden=true;viewerImage.src=''}})})();</script></body></html>
