<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>La boutique de Mila</title>
    <link rel="stylesheet" href="../assets/bastide.css" />
    <style>
      .shop {
        width: min(900px, 100%);
        margin: auto;
        padding: 14px;
      }
      .filters { display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding:2px 0 7px;scrollbar-width:none }
      .filters::-webkit-scrollbar { display:none }
      .filters button { flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#102a1d;color:var(--ink);padding:7px 10px;font-size:.75rem;font-weight:850 }
      .filters button.active { background:var(--gold);color:#142018;border-color:transparent }
      .shopGrid { display:grid;gap:6px }
      .product {
        display: grid;
        grid-template-columns:minmax(0,1fr) auto;
        align-items:center;
        gap: 8px;
        padding:10px 12px;
        border-radius:14px;
      }
      .product h2 { margin:2px 0;font:800 1rem/1.15 system-ui,sans-serif }
      .productMeta { display:flex;flex-wrap:wrap;gap:5px;align-items:center;color:var(--muted);font-size:.72rem }
      .product details { grid-column:1/-1;font-size:.78rem;color:var(--muted) }
      .product details summary { cursor:pointer;color:var(--gold);font-weight:800 }
      .buyBox { display:grid;justify-items:end;gap:5px;white-space:nowrap }
      .product button,
      .checkout {
        border: 0;
        border-radius: 11px;
        background: var(--gold);
        color: #142018;
        padding: 8px 10px;
        font-weight: 900;
      }
      .cart {
        position: sticky;
        bottom: 8px;
        margin-top: 14px;
      }
      .cartLine {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding: 7px 0;
      }
      .empty {
        color: var(--muted);
      }
      @media (max-width: 420px) { .shop{padding:10px}.hero{padding:22px 18px}.product{padding:9px}.product button{padding:7px 9px;font-size:.75rem} }
    </style>
  </head>
  <body>
    <main class="shop">
      <a class="back" href="../joueurs/">← Espace joueurs</a>
      <section class="hero">
        <div class="eyebrow">Comptoir de l’Île</div>
        <h1>La boutique de <span>Mila</span></h1>
        <p id="who">
          Le catalogue est ouvert. Pour acheter, ouvre d’abord ton lien
          personnel de personnage sur ce téléphone.
        </p>
      </section>
      <nav class="filters" id="filters" aria-label="Catégories de la boutique"></nav>
      <section id="products" class="shopGrid"></section>
      <section class="panel cart">
        <h2>Mon panier</h2>
        <div id="cart"></div>
        <button id="checkout" class="checkout">Valider l’achat</button>
        <p id="message"></p>
      </section>
    </main>
    <script src="../assets/inventory-api.js?v=4"></script>
    <script src="../assets/analytics.js?v=3"></script>
    <script>
      (() => {
        const A = window.BastideInventory,
          cart = new Map(),
          $ = (s) => document.querySelector(s),
          esc = (s) =>
            String(s ?? "").replace(
              /[&<>"']/g,
              (c) =>
                ({
                  "&": "&amp;",
                  "<": "&lt;",
                  ">": "&gt;",
                  '"': "&quot;",
                  "'": "&#39;",
                })[c],
            );
        let catalog = [], activeCategory = "Tout";
        function drawFilters() {
          const categories = ["Tout", ...new Set(catalog.map((x) => x.category))];
          $("#filters").innerHTML = categories.map((x) => `<button class="${x===activeCategory?'active':''}" data-filter="${esc(x)}">${esc(x)}</button>`).join("");
        }
        function drawProducts() {
          const visible=activeCategory==="Tout"?catalog:catalog.filter(x=>x.category===activeCategory);
          $("#products").innerHTML = visible.map((x) => `<article class="panel product"><div><span class="pill">${esc(x.category)}</span><h2>${esc(x.name)}</h2><div class="productMeta"><span>${x.stock == null ? "Stock illimité" : x.stock + " en stock"}</span>${x.base?`<span>· ${esc(x.base)}</span>`:""}</div></div><div class="buyBox"><b>${x.price_silver} PA</b><button data-add="${x.id}" ${x.stock===0?'disabled':''}>${x.stock===0?'Épuisé':'Ajouter'}</button></div>${x.description?`<details><summary>Détails</summary><p>${esc(x.description)}</p></details>`:""}</article>`).join("") || "<p>Aucun article dans cette catégorie.</p>";
        }
        function draw() {
          const lines = [...cart].map(([id, q]) => {
            const x = catalog.find((i) => i.id === id);
            return `<div class="cartLine"><span>${esc(x.name)} × ${q}</span><b>${x.price_silver * q} pa</b></div>`;
          });
          $("#cart").innerHTML =
            lines.join("") || '<p class="empty">Panier vide.</p>';
          $("#checkout").disabled = !lines.length || !A.hasKey();
        }
        async function load() {
          try {
            catalog = (await A.call("catalog")).items || [];
            drawFilters();
            drawProducts();
            if (A.hasKey()) {
              const s = await A.call("state");
              const m=s.player.state.money||{po:0,pa:s.player.state.silver||0,pc:0};
              $("#who").textContent =
                `${s.player.display_name} · ${m.po} PO, ${m.pa} PA et ${m.pc} PC disponibles.`;
            }
            draw();
          } catch (e) {
            $("#message").textContent = e.message;
          }
        }
        document.onclick = (e) => {
          const filter=e.target.closest("[data-filter]");
          if(filter){activeCategory=filter.dataset.filter;drawFilters();drawProducts();return}
          const b = e.target.closest("[data-add]");
          if (b) {
            cart.set(b.dataset.add, (cart.get(b.dataset.add) || 0) + 1);
            draw();
          }
        };
        $("#checkout").onclick = async () => {
          try {
            for (const [itemId, quantity] of cart)
              await A.call("purchase", {
                method: "POST",
                body: { itemId, quantity },
              });
            cart.clear();
            $("#message").textContent =
              "Achat validé : les objets sont dans ton inventaire.";
            await load();
          } catch (e) {
            $("#message").textContent = e.message;
          }
        };
        load();
        setInterval(load,15000);
      })();
    </script>
  </body>
</html>
