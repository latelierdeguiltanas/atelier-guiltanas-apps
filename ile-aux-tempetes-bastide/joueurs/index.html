<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132f22"><title>Espace joueurs — La Bastide</title><link rel="stylesheet" href="../assets/bastide.css"><style>.playerShell{max-width:1180px;margin:auto;padding:10px 12px 40px}.playerHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 10px}.playerHead h1{font:700 1.2rem Georgia,serif;margin:0}.carouselWrap{position:sticky;top:0;z-index:50;margin:0 -12px;padding:8px 12px 10px;background:linear-gradient(180deg,#091a11 78%,transparent)}.carousel{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.carousel::-webkit-scrollbar{display:none}.heroChoice{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;padding:9px 13px;text-decoration:none;background:linear-gradient(135deg,#e2d29a,#a98f4e);color:#142017;font-weight:900;font-size:.82rem}.workspace{display:grid;grid-template-columns:210px minmax(0,1fr);gap:14px;margin-top:8px}.toolMenu{position:sticky;top:62px;align-self:start;display:grid;gap:7px;border:1px solid var(--line);border-radius:18px;padding:10px;background:#081b12e8}.toolMenu a{display:flex;gap:9px;align-items:center;text-decoration:none;border-radius:11px;padding:10px;background:#102a1d;font-weight:850}.toolMenu a:first-child{background:#583a27}.toolMenu span{color:var(--gold);width:22px;text-align:center}.welcome{border:1px solid var(--line);border-radius:24px;padding:clamp(24px,6vw,54px);background:linear-gradient(130deg,rgba(10,30,19,.97),rgba(30,70,45,.78)),radial-gradient(circle at 85% 15%,#d8c88f45,transparent 25%)}.welcome h2{font:700 clamp(2rem,7vw,4.5rem)/.95 Georgia,serif;margin:9px 0}.welcome h2 span{display:block;color:var(--gold2);font-style:italic}.welcome p{max-width:650px;color:var(--muted);line-height:1.55}@media(max-width:720px){.playerHead .pill{display:none}.workspace{grid-template-columns:1fr}.toolMenu{positi
