<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f7fd;background:#0c1424;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#10192c,#0b1323 45%,#121a2c);min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}a{color:#a6c9ff}.top{padding:20px max(18px,calc((100vw - 1100px)/2));border-bottom:1px solid #29364c;background:#121c30}.top h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.7px}.top p{color:#b7c3d5;margin:0;font-size:13px}.mark{color:#e3b768;font-size:11px;letter-spacing:2px;font-weight:900}.wrap{max-width:1100px;margin:auto;padding:18px 16px 90px}.nav{display:flex;gap:7px;overflow:auto;padding-bottom:14px;scrollbar-width:thin}.nav button{white-space:nowrap;border:1px solid #35455e;border-radius:11px;padding:10px 12px;color:#c4d1e6;background:#17243a}.nav button.active{background:#314967;color:white;border-color:#6b8fb7}.stack{display:grid;gap:14px}.panel{background:#18243a;border:1px solid #30415c;border-radius:16px;padding:18px;box-shadow:0 10px 30px #0002}.panel h2{font-size:18px;margin:0 0 12px}.panel h3{font-size:15px;margin:0 0 8px}.sub{color:#a9bdd3;font-size:13px}.muted{color:#8ea1bb}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.metric{font-size:28px;font-weight:800;margin:5px 0}.line{border-top:1px solid #30415c;margin:14px 0}.row{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.chip{display:inline-block;padding:5px 9px;font-size:11px;border:1px solid #49617b;border-radius:30px;color:#c8d6eb}.good{color:#9be6ba}.bad{color:#ffb6a7}.warning{color:#ffd17f}.btn{background:#d8ac60;border:0;border-radius:10px;padding:10px 13px;font-weight:750;color:#201809}.btn.alt{background:#283a56;color:#d8e6fb;border:1px solid #48617e}.btn.small{padding:6px 9px;font-size:12px}.field{width:100%;background:#0d1729;border:1px solid #435772;color:#f2f <body><header class="top"><div class="mark">L'ATELIER DE GUILTANAS • WOW FOREVER</div><h1>Atelier WoW</h1><p>Tous tes artisans. Tous tes stocks. Un seul plan.</p></header>
<main class="wrap"><nav class="nav" id="nav" aria-label="Sections"></nav><div id="notice"></div><div id="view"></div><div class="foot">Version 0.1 • données privées stockées uniquement sur cet appareil • aucune connexion Battle.net active</div></main>
<input id="fileInput" type="file" accept=".json,application/json" style="display:none">
<script>
(function(){
'use strict';
const KEY='atelier-wow-forever-v1';
const TABS=[['home','Accueil'],['stock','Stocks'],['recipes','Patrons'],['plan','Fabrications'],['sync','Synchronisation']];
const PROFESSIONS=['leatherworking','tailoring','enchanting','skinning','alchemy','blacksmithing','engineering','herbalism','mining','cooking','first-aid','fishing'];
const FR={leatherworking:'Travail du cuir',tailoring:'Couture',enchanting:'Enchantement',skinning:'Dépeçage',alchemy:'Alchimie',blacksmithing:'Forge',engineering:'Ingénierie',herbalism:'Herboristerie',mining:'Minage',cooking:'Cuisine','first-aid':'Secourisme',fishing:'Pêche'};
const empty=()=>({schema:'atelierwow-v1',characters:[],catalog:[],plans:[],updatedAt:null});
let state=empty(),tab='home',filter='',professionFilter='',knownFilter='all',stockFilter='',sortFilter='name';
const SESSION_KEY='atelierwow:bnet:session';
let bnetBackend='',bnet={status:'loading',account:null,characters:[],chosen:new Set(),session:sessionStorage.getItem(SESSION_KEY)||'',error:''};
const accountSelectionKey=()=> 'atelierwow:bnet:selection:'+String(bnet.account?.id||bnet.account?.battletag||'unknown');
function authScreen(){
 const loading=bnet.status==='loading', setup=bnet.status==='setup', failed=bnet.status==='error';
 if(bnet.status==='connected'){
 const list=bnet.characters.map((c,i)=>'<label class="authcheck"><input type="checkbox" data-character-select="'+i+'" '+(bnet.chosen.has(String(c.id||c.name+'-'+(c.surname||'')))?'checked':'')+'><span><b>'+esc(c.name)+' '+esc(c.surname||'')+'</b><small> '+esc(c.class||c.character_class?.name||'')+' · Niveau '+esc(c.level||'?')+' · '+esc(c.ruleset?.name||'WoW Forever')+'</small></span></label>').join('');
 return '<section class="panel authbox"><div class="mark">COMPTE BATTLE.NET CONNECTÉ</div><div class="authbrand">🛡️</div><h2>Valide tes personnages</h2><p class="sub">'+esc(bnet.account?.battletag||'Compte Blizzard')+' · '+bnet.characters.length+' personnage(s) trouvé(s)</p>'+(list||'<div class="alert">Aucun personnage WoW Forever trouvé sur ce compte/région.</div>')+'<button class="btn" data-auth="confirm" '+(bnet.chosen.size?'':'disabled')+'>Valider '+bnet.chosen.size+' personnage(s) et ouvrir l’atelier</button><button class="btn alt" data-auth="logout">Déconnexion Battle.net</button><div class="authfooter">Seuls les personnages sélectionnés seront ajoutés au suivi. Tu pourras modifier cette sélection.</div></section>';
 }
 return '<section class="panel authbox"><div class="mark">L’ATELIER DE GUILTANAS</div><div class="authbrand">⚔️</div><h2>Se connecter avec Battle.net</h2><p class="sub">Connecte ton véritable compte Blizzard pour retrouver et valider tes personnages WoW Forever, y compris les personnages de bas niveau.</p>'+((loading)?'<p class="sub">Vérification de la configuration…</p>':setup?'<div class="alert"><b>Connexion Blizzard à configurer.</b><p>Il faut enregistrer Atelier WoW comme application Battle.net et configurer son serveur OAuth. Aucun identifiant de connexion ne doit être saisi ici.</p><a href="https://develop.battle.net/access/clients" target="_blank" rel="noopener noreferrer">Ouvrir le portail développeur Blizzard</a></div>':failed?'<div class="alert">'+esc(bnet.error||'Connexion impossible. Réessaie.')+'</div>':'')+'<button class="btn" data-auth="login" '+(loading||setup?'disabled':'')+'>Se connecter avec Battle.net</button><div class="authfooter">La connexion s’effectue exclusivement sur le site officiel Blizzard. Aucun mot de passe n’est collecté ici.<p>Le relevé complémentaire des sacs et banques se fera ensuite via l’addon.</p></div></section>';
}
async function bnetRequest(op,init={}){
 const url=bnetBackend.replace(/\/$/,'')+'?action='+encodeURIComponent(op);
 const headers={...(init.headers||{})};if(bnet.session)headers.Authorization='Bearer '+bnet.session;
 const resp=await fetch(url,{...init,headers,cache:'no-store'});
 const data=await resp.json().catch(()=>({}));
 if(!resp.ok)throw Error(data.error||('Erreur Blizzard '+resp.status));
 return data;
}
async function setupBnet(){
 bnet.status='loading';render();
 try{
  const conf=await fetch('./blizzard-config.json',{cache:'no-store'}).then(r=>r.ok?r.json():{});
  bnetBackend=typeof conf.backendUrl==='string'?conf.backendUrl.trim():'';
  if(!/^https:\/\//.test(bnetBackend)){bnet.status='setup';render();return}
  const hash=new URLSearchParams(location.hash.slice(1));const handoff=hash.get('bnet_handoff'); const oauthError=hash.get('bnet_error');if(oauthError){history.replaceState(null,'',location.pathname+location.search);throw Error('Connexion Blizzard refusée ou annulée.')}
  if(handoff){
   history.replaceState(null,'',location.pathname+location.search);
   const result=await bnetRequest('exchange',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handoff})});
   if(!result.session)throw Error('Session invalide');
   bnet.session=result.session;sessionStorage.setItem(SESSION_KEY,bnet.session);
  }
  if(!bnet.session){bnet.status='disconnected';render();return}
  const data=await bnetRequest('characters');
  if(!Array.isArray(data.characters))throw Error('Réponse personnages invalide');
  bnet.account=data.account||{};
  bnet.characters=data.characters;
  const stored=JSON.parse(localStorage.getItem(accountSelectionKey())||'null');
  bnet.chosen=new Set(Array.isArray(stored)?stored.map(String):data.characters.map(c=>String(c.id||c.name+'-'+(c.surname||''))));
  bnet.status='connected';
  const previousConfirmed=localStorage.getItem(accountSelectionKey()+':confirmed')==='yes';
  if(previousConfirmed){syncCharacters();bnet.status='ready'}
  render();
 }catch(err){bnet.session='';sessionStorage.removeItem(SESSION_KEY);bnet.status='error';bnet.error=err.message;render()}
}
function syncCharacters(){
 for(const c of bnet.characters){
  const key=String(c.id||c.name+'-'+(c.surname||''));if(!bnet.chosen.has(key))continue;
  let match=state.characters.find(p=>String(p.blizzardId||'')===String(c.id)||((p.name||'').toLowerCase()===String(c.name||'').toLowerCase()&&(p.surname||'').toLowerCase()===String(c.surname||'').toLowerCase()));
  if(!match){match={name:c.name,surname:c.surname||'',items:[],professions:[]};state.characters.push(match)}
  match.blizzardId=c.id||match.blizzardId;match.name=c.name;match.surname=c.surname||match.surname;
  if(c.level!=null)match.level=c.level;
  if(c.class||c.character_class?.name)match.class=c.class||c.character_class.name;
  if(c.faction)match.faction=typeof c.faction==='string'?c.faction:c.faction.name;
  match.bnetVerified=true;match.bnetSyncedAt=new Date().toISOString();
 }
 save();
}
function authSelect(){bnet.status='connected';render()}

try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.characters))state=Object.assign(empty(),x)}catch(e){}
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=x=>String(x||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9-]/g,'');
const idof=c=>String(c.key||([c.name,c.surname].filter(Boolean).join('-'))||c.name||'').toLowerCase();
const save=()=>{state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Stockage local saturé. Exporte tes données.')}};
const date=x=>x?new Date((typeof x==='number'&&x<1e12)?x*1000:x).toLocaleString('fr-FR'):'Non relevé';
const fmt=n=>new Intl.NumberFormat('fr-FR').format(Number(n)||0);
function toast(message,ok=true){$('notice').innerHTML='<div class="'+(ok?'success':'alert')+'">'+esc(message)+'</div>';setTimeout(()=>$('notice')&&($('notice').innerHTML=''),6500)}
function profs(c){return Array.isArray(c.professions)?c.professions:[]}
function learnedSet(c){const s=new Set();profs(c).forEach(p=>(p.recipes||[]).forEach(r=>s.add(String(r.id||r.recipeId||''))));return s}
function ownersOf(r){return state.characters.filter(c=>learnedSet(c).has(String(r.id)))}
function recipeStock(){const map={};state.characters.forEach(c=>(c.items||[]).forEach(i=>{const k=String(i.itemId||i.id||i.name||'?');if(!map[k])map[k]={id:k,name:i.name||'Objet '+k,count:0,places:[]};map[k].count+=Number(i.count)||0;map[k].places.push({name:c.name,location:i.location||'Sacs',count:Number(i.count)||0,seen:i.seenAt||c.scannedAt})}));return map}
function availableFor(k,stock){return (stock[String(k)]||{count:0}).count}
function needForPlans(){const need={};state.plans.forEach(p=>{let r=state.catalog.find(x=>String(x.id)===String(p.recipeId));if(!r)return;(r.reagents||[]).forEach(m=>{const id=String(m.itemId||m.id||m.name),q=(Number(m.quantity||m.count)||0)*Number(p.quantity||1);if(!need[id])need[id]={name:m.name||'Objet '+id,id,qty:0};need[id].qty+=q})});return Object.values(need)}
function mergeImport(payload){if(!payload||(!Array.isArray(payload.characters)&&!Array.isArray(payload.catalog)))throw Error('Format incorrect : fichier avec "characters" ou "catalog" attendu.');if(payload.schema&&payload.schema!=='atelierwow-v1')throw Error('Version du fichier non prise en charge');const cloned=JSON.parse(JSON.stringify(state));let n=0;(payload.characters||[]).forEach(c=>{if(!c||!c.name)return;const k=idof(c);const prev=cloned.characters.find(x=>idof(x)===k||(String(x.name||'').toLowerCase()===String(c.name||'').toLowerCase()));if(prev){Object.assign(prev,c);if(c.items)prev.items=c.items;if(c.professions)prev.professions=c.professions}else cloned.characters.push(c);n++});if(Array.isArray(payload.catalog)){const by=new Map(cloned.catalog.map(r=>[String(r.id),r]));payload.catalog.forEach(r=>{if(r&&r.id)by.set(String(r.id),r)});cloned.catalog=Array.from(by.values())}if(Array.isArray(payload.plans)&&!cloned.plans.length)cloned.plans=payload.plans;state=cloned;save();render();toast(n+' personnage(s) intégrés. Import terminé.')}
function rowBtns(){return '<button class="btn alt small" data-action="export">Exporter mes données</button>'}
function renderNav(){$('nav').innerHTML=TABS.map(([id,name])=>'<button data-tab="'+id+'" class="'+(tab===id?'active':'')+'">'+name+'</button>').join('')}
function home(){
const stock=recipeStock(),invent=Object.values(stock),count=invent.reduce((x,y)=>x+y.count,0),known=new Set(state.characters.flatMap(c=>profs(c).flatMap(p=>(p.recipes||[]).map(r=>String(r.id))))).size;
let cards=state.characters.length?state.characters.map(c=>'<div class="cardrow"><div class="row"><h3>'+esc(c.name)+' '+esc(c.surname||'')+'</h3><span class="chip">Niveau '+esc(c.level||'?')+'</span></div><div class="sub">'+esc(c.class||'')+' • '+esc(c.faction||'Alliance')+' • '+(c.scannedAt?'Dernier relevé : '+esc(date(c.scannedAt)):'Non synchronisé')+'</div><div style="margin-top:10px">'+profs(c).map(p=>'<span class="tag">'+esc(FR[slug(p.slug||p.name)]||p.name||'Métier')+' '+esc(p.skill||'?')+'/'+esc(p.max||'?')+' • '+(p.recipes||[]).length+' recettes</span>').join(' ')+'</div><div class="sub" style="margin-top:8px">'+(c.items||[]).reduce((s,i)=>s+(Number(i.count)||0),0)+' objets stockés • '+esc(c.money!=null?((c.money/10000).toFixed(2)+' po'):'or non relevé')+'</div><div class="sub" style="margin-top:6px">Banque : '+(c.coverage?.bank?.status==='scanned'?('relevée le '+esc(date(c.coverage.bank.at))):'non relevée')+' · Recettes : '+(c.coverage?.recipes?.count!=null?esc(c.coverage.recipes.count)+' recensées':'pas encore vérifiées')+'</div></div>').join(''):'<div class="empty">Aucun personnage encore synchronisé.<p>Tu peux ajouter Guiltanas et Krisania comme repères, puis remplacer ces fiches par un véritable relevé de l’addon.</p><button class="btn" data-action="seed">Ajouter mes deux personnages</button></div>';
return '<div class="stack"><div class="grid">'+[['Personnages',state.characters.length],['Objets en stock',fmt(count)],['Références différentes',fmt(invent.length)],['Patrons appris',fmt(known)]].map(x=>'<div class="panel"><div class="sub">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="columns"><section class="panel"><div class="row"><h2>Mes personnages</h2><button class="btn alt small" data-auth="select">Choisir mes personnages</button></div><div class="cards">'+cards+'</div></section><section class="panel"><h2>Priorités</h2><div class="cardrow"><b>1. Relever les sacs et les banques</b><p class="sub">Pour un stock exact, connecte chaque personnage et ouvre ses banques avant de lancer le relevé.</p></div><div class="cardrow"><b>2. Ouvrir chaque fenêtre de métier</b><p class="sub">L’addon lit les recettes visibles et apprises ; la collecte peut être partielle.</p></div><div class="cardrow"><b>3. Ajouter des patrons à fabriquer</b><p class="sub">Le planificateur rassemble les composants de Guiltanas, Krisania et des futurs artisans.</p></div></section></div></div>'
}
function stockView(){let all=Object.values(recipeStock()).sort((a,b)=>a.name.localeCompare(b.name,'fr'));if(stockFilter)all=all.filter(x=>(x.name+' '+x.id+' '+x.places.map(p=>p.name).join(' ')).toLowerCase().includes(stockFilter.toLowerCase()));return '<section class="panel"><h2>Stock global du compte</h2><p class="sub">Sacs, banque et autres emplacements relevés. Les stocks anciens restent visibles avec leur date ; pas de synchronisation en temps réel.</p><div class="inputrow"><input class="field" id="stockSearch" placeholder="Rechercher un objet, un ID ou un personnage" value="'+esc(stockFilter)+'">'+rowBtns()+'</div><div class="scroll"><table><thead><tr><th>Composant</th><th>Total</th><th>Où le récupérer</th></tr></thead><tbody>'+all.map(i=>'<tr><td><b>'+esc(i.name)+'</b><div class="muted mono">#'+esc(i.id)+'</div></td><td><b>'+fmt(i.count)+'</b></td><td>'+i.places.map(p=>'<div>'+esc(p.name)+' · '+esc(p.location)+' : <b>'+fmt(p.count)+'</b><div class="muted" style="font-size:11px">'+esc(date(p.seen))+'</div></div>').join('')+'</td></tr>').join('')+'</tbody></table></div>'+(all.length?'':'<div class="empty">Aucun objet relevé. Importe un snapshot depuis le jeu.</div>')+'</section>'}
function recipesView(){
let all=state.catalog.slice();if(filter)all=all.filter(r=>(r.name+' '+r.profession+' '+r.source+' '+r.zone).toLowerCase().includes(filter.toLowerCase()));if(professionFilter)all=all.filter(r=>slug(r.profession)===professionFilter);if(knownFilter!=='all')all=all.filter(r=>knownFilter==='known'?ownersOf(r).length:!ownersOf(r).length);if(sortFilter==='skill')all.sort((a,b)=>(Number(a.skill)||0)-(Number(b.skill)||0));else all.sort((a,b)=>String(a.name).localeCompare(String(b.name),'fr'));
return '<section class="panel"><h2>Collection de patrons</h2><p class="sub">Le catalogue comprend les recettes chargées depuis ForeverDB ou un fichier. « Appris » signifie identifié sur au moins un personnage.</p><div class="grid"><input id="recipeSearch" class="field" placeholder="Patron, zone, source…" value="'+esc(filter)+'"><select id="profFilter" class="field"><option value="">Tous les métiers</option>'+PROFESSIONS.map(p=>'<option value="'+p+'" '+(professionFilter===p?'selected':'')+'>'+esc(FR[p])+'</option>').join('')+'</select><select class="field" id="knownFilter"><option value="all">Tous les patrons</option><option value="known" '+(knownFilter==='known'?'selected':'')+'>Appris sur le compte</option><option value="missing" '+(knownFilter==='missing'?'selected':'')+'>Non recensés</option></select><select class="field" id="sortFilter"><option value="name">Trier par nom</option><option value="skill" '+(sortFilter==='skill'?'selected':'')+'>Trier par compétence</option></select></div><div class="row" style="margin:13px 0"><span class="chip">'+all.length+' recettes affichées</span><button class="btn alt small" data-tab="sync">Charger le catalogue</button></div><div class="cards">'+all.slice(0,180).map(r=>{const owners=ownersOf(r);return '<div class="cardrow"><div class="row"><b>'+esc(r.name)+'</b><span class="chip '+(owners.length?'good':'warning')+'">'+(owners.length?'Appris':'Non recensé')+'</span></div><div class="sub">'+esc(FR[slug(r.profession)]||r.profession||'Métier')+' · Compétence '+esc(r.skill||'?')+'</div><p class="sub">'+esc(r.source||'Source à vérifier')+(r.zone?' · '+esc(r.zone):'')+(r.coords?' ('+esc(r.coords)+')':'')+'</p><div class="sub">Composants : '+((r.reagents||[]).map(m=>esc(m.quantity||m.count||1)+' × '+esc(m.name||m.itemId)).join(', ')||'non renseignés')+'</div><div class="row" style="margin-top:9px"><small class="good">'+(owners.map(x=>esc(x.name)).join(', ')||'Non appris dans les relevés')+'</small><button class="btn small" data-plan="'+esc(r.id)+'">Planifier</button></div></div>'}).join('')+'</div>'+(all.length>180?'<p class="sub">180 premiers résultats affichés. Affine ta recherche.</p>':'')+(!all.length?'<div class="empty">Catalogue vide ou aucun résultat. Tu peux charger une profession ForeverDB dans Synchronisation.</div>':'')+'</section>'}
function planView(){const stock=recipeStock(),needs=needForPlans();return '<div class="stack"><section class="panel"><div class="row"><h2>Mes fabrications</h2><button class="btn alt small" data-tab="recipes">Choisir des recettes</button></div>'+(state.plans.length?state.plans.map((p,i)=>{const r=state.catalog.find(x=>String(x.id)===String(p.recipeId));return '<div class="cardrow row" style="margin-bottom:9px"><div><b>'+esc(r?r.name:'Recette '+p.recipeId)+'</b><div class="sub">À fabriquer : '+esc(p.quantity)+' unité(s)</div></div><div class="row"><button class="btn alt small" data-qty="'+i+'" data-delta="-1">−</button><button class="btn alt small" data-qty="'+i+'" data-delta="1">+</button><button class="btn alt small" data-remove="'+i+'">Retirer</button></div></div>'}).join(''):'<div class="empty">Pas encore de projet. Sélectionne « Planifier » sur une recette.</div>')+'</section><section class="panel"><div class="row"><h2>Composants à réunir</h2><button class="btn alt small" data-action="copy-needs">Copier la liste de farm</button></div><div class="scroll"><table><thead><tr><th>Composant</th><th>Requis</th><th>Sur le compte</th><th>À farmer</th></tr></thead><tbody>'+needs.map(m=>{const available=availableFor(m.id,stock),remaining=Math.max(0,m.qty-available);return '<tr><td>'+esc(m.name)+'</td><td>'+fmt(m.qty)+'</td><td>'+fmt(available)+'</td><td class="'+(remaining?'warning':'good')+'">'+fmt(remaining)+'</td></tr>'}).join('')+'</tbody></table></div>'+(needs.length?'':'<div class="empty">Ajoute une recette avec ses composants pour calculer les besoins.</div>')+'<p class="sub">Les stocks de tous les personnages sont additionnés. Les composants déjà réservés à d’autres projets ne sont pas déduits automatiquement.</p></section></div>'}
function syncView(){return '<div class="stack"><section class="panel"><h2>Synchroniser les personnages</h2><div class="alert"><b>État actuel : import manuel.</b> Il n’existe pas encore de connexion Battle.net ni de pont PC → téléphone. Ne saisis jamais ton mot de passe Battle.net ici.</div><p class="sub">L’addon récupère ce que le client autorise à voir, puis écrit un fichier SavedVariables sur ton PC après <span class="mono">/reload</span>. Convertis-le en JSON puis importe le résultat dans cette application.</p><div class="row"><button class="btn" data-action="import">Importer un relevé JSON</button>'+rowBtns()+'</div><div class="line"></div><h3>Format d’import</h3><p class="sub">JSON « atelierwow-v1 » avec <span class="mono">characters</span> et/ou <span class="mono">catalog</span>, éventuellement <span class="mono">plans</span>. Les imports fusionnent les personnages en conservant leurs relevés les plus récents dans chaque fichier.</p><p class="sub">L’addon et le convertisseur se trouvent dans le dossier GitHub <a href="https://github.com/latelierdeguiltanas/atelier-guiltanas-apps/tree/main/atelier-wow/addon" target="_blank" rel="noopener">atelier-wow/addon</a>.</p></section><section class="panel"><h2>Catalogue des recettes</h2><p class="sub">Chargement depuis l’API communautaire ForeverDB. Source non officielle : les lieux et conditions d’obtention doivent être confirmés en jeu. Un blocage CORS peut empêcher l’accès depuis le navigateur.</p><div class="inputrow"><select class="field" id="catalogProf">'+PROFESSIONS.map(p=>'<option value="'+p+'">'+esc(FR[p])+'</option>').join('')+'</select><button class="btn" data-action="load-catalog">Charger ce métier</button></div><p class="sub" id="catalogStatus">Déjà en mémoire : '+fmt(state.catalog.length)+' recettes.</p><div class="line"></div><h3>Ajouter une recette manuellement</h3><div class="grid"><input class="field" id="manualName" placeholder="Nom de la recette"><input class="field" id="manualId" placeholder="Identifiant unique"><select class="field" id="manualProf">'+PROFESSIONS.map(p=>'<option value="'+p+'">'+esc(FR[p])+'</option>').join('')+'</select><input class="field" id="manualSkill" inputmode="numeric" placeholder="Compétence requise"><input class="field" id="manualSource" placeholder="Vendeur, monstre ou quête"><input class="field" id="manualZone" placeholder="Zone / coordonnées"></div><p><button class="btn alt" data-action="manual-recipe">Enregistrer le patron</button></p></section><section class="panel"><h2>Confidentialité et sauvegarde</h2><p class="sub">Les données restent dans le stockage local de ton navigateur. Les autres appareils ne les voient pas sans transfert du JSON. L’effacement des données du navigateur peut les supprimer : exporte un fichier de sauvegarde après chaque synchronisation.</p><div class="row"><span class="chip">Dernière sauvegarde locale : '+esc(date(state.updatedAt))+'</span><button class="btn alt small" data-action="clear">Effacer les données de cet appareil</button></div></section></div>'}
function render(){if(bnet.status!=='ready'){ $('nav').innerHTML='';$('view').innerHTML=authScreen();return }renderNav();$('view').innerHTML=tab==='home'?home():tab==='stock'?stockView():tab==='recipes'?recipesView():tab==='plan'?planView():syncView()}
function addPlan(id){const r=state.catalog.find(x=>String(x.id)===id);if(!r)return;let p=state.plans.find(x=>String(x.recipeId)===id);if(p)p.quantity++;else state.plans.push({recipeId:id,quantity:1});save();toast('Ajouté au plan : '+r.name)}
function download(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='atelier-wow-compte-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function adaptRecipe(r,profession){const reagents=(r.reagents||r.materials||r.ingredients||[]).map(m=>({itemId:m.itemId||m.item?.id||m.id||m.reagent?.id||m.name,name:m.name||m.item?.name||m.reagent?.name||'Matériau '+(m.itemId||m.id||'?'),quantity:m.quantity||m.count||m.amount||1}));const src=r.learnedFrom?.sources||r.learnedFrom||r.sources||r.source;let source=typeof src==='string'?src:JSON.stringify(src||'').slice(0,400);return {id:r.id||r.recipeId||r.spellId,name:r.name||r.recipeName||'Recette '+(r.id||'?'),profession,skill:r.skill?.orange||r.skillRequired||r.requiredSkill||r.skillLevel||'',reagents,source,zone:r.zone?.name||r.location?.zone||'',coords:r.coords||''}}
async function loadCatalog(profession){const target=$('catalogStatus');target.textContent='Chargement des pages ForeverDB…';let all=[],offset=0;try{for(let n=0;n<15;n++){const url='https://foreverdb.net/api/v1/professions/'+encodeURIComponent(profession)+'?limit=100&offset='+offset;const response=await fetch(url,{headers:{Accept:'application/json'}});if(!response.ok)throw Error('HTTP '+response.status);const x=await response.json();const arr=Array.isArray(x)?x:Array.isArray(x.recipes)?x.recipes:Array.isArray(x.data)?x.data:Array.isArray(x.results)?x.results:[];if(!arr.length)break;all.push(...arr.map(r=>adaptRecipe(r,profession)));offset+=arr.length;if(arr.length<100)break;}if(!all.length)throw Error('Aucune recette dans la réponse');const by=new Map(state.catalog.map(r=>[String(r.id),r]));all.forEach(r=>{if(r.id)by.set(String(r.id),r)});state.catalog=Array.from(by.values());save();render();toast(all.length+' recettes du métier chargées depuis ForeverDB.');}catch(e){target.textContent='Chargement impossible : '+e.message+'. Vérifie le réseau ou importe un catalogue JSON.';toast('Échec du catalogue : '+e.message,false)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.auth==='login'){if(bnetBackend)location.href=bnetBackend.replace(/\/$/,'')+'?action=start';else toast('Connexion Blizzard non configurée.',false);return}
 if(b.dataset.auth==='logout'){if(bnet.session){bnetRequest('logout',{method:'POST'}).catch(()=>{})}bnet.session='';bnet.status='disconnected';bnet.account=null;sessionStorage.removeItem(SESSION_KEY);render();return}
 if(b.dataset.auth==='confirm'){localStorage.setItem(accountSelectionKey(),JSON.stringify(Array.from(bnet.chosen)));localStorage.setItem(accountSelectionKey()+':confirmed','yes');syncCharacters();bnet.status='ready';render();return}
 if(b.dataset.auth==='select'){authSelect();return}
 if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.plan){addPlan(b.dataset.plan);return}if(b.dataset.remove!=null){state.plans.splice(Number(b.dataset.remove),1);save();render();return}if(b.dataset.qty!=null){const i=Number(b.dataset.qty),p=state.plans[i];if(p){p.quantity=Math.max(1,p.quantity+Number(b.dataset.delta));save();render()}return}switch(b.dataset.action){case 'seed':state.characters=[{name:'Guiltanas',surname:'Droskanan',level:28,class:'Druide',faction:'Alliance',professions:[{name:'Travail du cuir',slug:'leatherworking',skill:140,max:150,recipes:[]},{name:'Dépeçage',slug:'skinning',skill:null,max:null,recipes:[]}],items:[],source:'indiqué par le joueur'},{name:'Krisania',surname:'Droskanan',level:8,class:'Prêtre',faction:'Alliance',professions:[{name:'Couture',slug:'tailoring',skill:75,max:75,recipes:[]},{name:'Enchantement',slug:'enchanting',skill:null,max:null,recipes:[]}],items:[],source:'indiqué par le joueur'}];save();render();toast('Fiches repères créées. Aucune donnée de jeu n’a été inventée.');break;case 'import':$('fileInput').click();break;case 'export':download();break;case 'load-catalog':loadCatalog($('catalogProf').value);break;case 'manual-recipe':{const name=$('manualName').value.trim(),id=$('manualId').value.trim()||('manual-'+Date.now());if(!name){toast('Saisis un nom de patron.',false);return}state.catalog.push({id,name,profession:$('manualProf').value,skill:$('manualSkill').value,source:$('manualSource').value,zone:$('manualZone').value,reagents:[]});save();render();toast('Patron enregistré.');break}case 'copy-needs':{const stock=recipeStock(),t=needForPlans().map(m=>m.name+' : '+Math.max(0,m.qty-availableFor(m.id,stock))+' à récupérer / '+m.qty+' requis').join('\n');navigator.clipboard?.writeText(t||'Aucun composant manquant').then(()=>toast('Liste copiée.')).catch(()=>toast('La copie exige une connexion HTTPS.',false));break}case 'clear':if(confirm('Effacer toutes les données de cet appareil ? Pense à les exporter avant.')){state=empty();save();render()}break;}});
document.addEventListener('input',e=>{if(e.target.id==='recipeSearch'){filter=e.target.value;const pos=e.target.selectionStart;render();const i=$('recipeSearch');i.focus();i.setSelectionRange(pos,pos)}if(e.target.id==='stockSearch'){stockFilter=e.target.value;const pos=e.target.selectionStart;render();const i=$('stockSearch');i.focus();i.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.dataset.characterSelect!=null){
  const c=bnet.characters[Number(e.target.dataset.characterSelect)];if(c){const id=String(c.id||c.name+'-'+(c.surname||''));if(e.target.checked)bnet.chosen.add(id);else bnet.chosen.delete(id);render()}return}
 if(e.target.id==='profFilter'){professionFilter=e.target.value;render()}if(e.target.id==='knownFilter'){knownFilter=e.target.value;render()}if(e.target.id==='sortFilter'){sortFilter=e.target.value;render()}if(e.target.id==='fileInput'){const file=e.target.files?.[0];if(!file)return;file.text().then(s=>{try{mergeImport(JSON.parse(s))}catch(err){toast('Import refusé : '+err.message,false)}});e.target.value=''}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();setupBnet();
})();
</script></body></html>
